 =  --------- * sum_{j=1}^{k}  mse_j\n              k\n  \n cada observacion se usa exactamente una vez para evaluar y k-1 veces para entrenar. \n eleccion de k \n \n \n \n k \n sesgo del estimador \n varianza \n costo \n \n \n \n \n k pequeno (5) \n mas sesgo (entrena con menos datos) \n menos varianza \n barato \n \n \n k grande (10) \n menos sesgo \n mas varianza \n medio \n \n \n k = n (loocv) \n sesgo minimo \n varianza alta \n caro \n \n \n \n el estandar de la practica es  k = 5 o k = 10 . el codigo del curso usa 10. \n para que se usa \n principalmente para  calibrar el parametro de flexibilidad : se recorre una rejilla de valores del\nparametro, se calcula el cv para cada uno, y se escoge el que minimiza el error. es lo que hacen por\ndentro  ridgecv ,  lassocv ,  elasticnetcv  y  cv.glmnet . \n advertencia \n toda transformacion que use informacion de la respuesta o de toda la muestra (escalamiento,\nseleccion de variables) debe hacerse  dentro  de cada fold, no antes. si se hace antes, la\ninformacion del fold de evaluacion se filtra al entrenamiento y el error estimado sale\noptimistamente bajo.  las tres formas de particionar import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import kneighborsregressor\nfrom sklearn.model_selection import kfold\nimport matplotlib.pyplot as plt\n\nxtotal, ytotal = datasets.load_diabetes(return_x_y=true)\ndatostotal = len(xtotal)\n\n# 1. una sola particion\nxtrain, xtest, ytrain, ytest = train_test_split(xtotal, ytotal,\n                                                test_size=0.33, random_state=0)\n\n# 2. folds a mano\nfolds = 10\nkf = kfold(n_splits=folds)\nkf.get_n_splits(xtotal)\n\nfor train_index, test_index in kf.split(xtotal):\n    x_traincv, x_testcv = xtotal[train_index], xtotal[test_index]\n    y_traincv, y_testcv = ytotal[train_index], ytotal[test_index]\n    # aqui va el ajuste del modelo y el calculo del error de este fold\n\n# 3. metrica automatica sobre los folds\nfrom sklearn.model_selection import cross_val_score\n\nneigh = kneighborsregressor(n_neighbors=3)\n\nx = xtotal[:150]\ny = ytotal[:150]\n\nprint(cross_val_score(neigh, x, y, cv=10, scoring=\"neg_mean_squared_error\")) curva de mse por validacion cruzada (ejercicio del notebook resuelto) import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.neighbors import kneighborsregressor\nfrom sklearn.model_selection import kfold\n\ndef curva_mse_cv(xtotal, ytotal, folds):\n    n_total = len(xtotal)\n    max_vecinos = n_total - int(n_total/folds)   # limite por el tamano de cada fold\n\n    kf = kfold(n_splits=folds, shuffle=true, random_state=0)\n    lista_k = range(1, max_vecinos)\n    mse_por_k = []\n\n    for k in lista_k:\n        errores_fold = []\n        for train_index, test_index in kf.split(xtotal):\n            x_traincv, x_testcv = xtotal[train_index], xtotal[test_index]\n            y_traincv, y_testcv = ytotal[train_index], ytotal[test_index]\n\n            modelo = kneighborsregressor(n_neighbors=k)\n            modelo.fit(x_traincv, y_traincv)\n            prediccion = modelo.predict(x_testcv)\n\n            errores_fold.append(np.average(np.square(prediccion - y_testcv)))\n\n        mse_por_k.append(np.mean(errores_fold))\n\n    plt.plot(list(lista_k), mse_por_k)\n    plt.xlabel('numero de vecinos')\n    plt.ylabel('mse por validacion cruzada')\n    plt.title('curva de calibracion')\n    plt.show()\n\n    k_optimo = list(lista_k)[int(np.argmin(mse_por_k))]\n    print(\"k optimo:\", k_optimo, \"con mse:\", round(min(mse_por_k), 3))\n    return k_optimo, mse_por_k\n\nk_opt, curva = curva_mse_cv(xtotal, ytotal, 10) version compacta con cross_val_score y loocv from sklearn.model_selection import cross_val_score, leaveoneout, gridsearchcv\nfrom sklearn.neighbors import kneighborsregressor\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# curva de calibracion en pocas lineas\nlista_k = range(1, 50)\nmse_cv = []\n\nfor k in lista_k:\n    puntajes = cross_val_score(kneighborsregressor(n_neighbors=k),\n                               xtotal, ytotal, cv=10,\n                               scoring=\"neg_mean_squared_error\")\n    mse_cv.append(-puntajes.mean())   # el signo negativo se revierte\n\nplt.plot(list(lista_k), mse_cv)\nplt.xlabel(\"k\")\nplt.ylabel(\"mse por cv\")\nplt.show()\n\nprint(\"k optimo:\", list(lista_k)[int(np.argmin(mse_cv))])\n\n\n# leave one out\nloo = leaveoneout()\npuntajes_loo = cross_val_score(kneighborsregressor(n_neighbors=5),\n                               xtotal, ytotal, cv=loo,\n                               scoring=\"neg_mean_squared_error\")\nprint(\"loocv mse:\", -puntajes_loo.mean())\n\n\n# busqueda automatica del mejor parametro\nrejilla = {'n_neighbors': list(range(1, 50))}\nbusqueda = gridsearchcv(kneighborsregressor(), rejilla, cv=10,\n                        scoring=\"neg_mean_squared_error\")\nbusqueda.fit(xtotal, ytotal)\n\nprint(busqueda.best_params_)\nprint(-busqueda.best_score_) validacion cruzada en r # particion simple\nset.seed(0)\nn <- nrow(datos)\nidx <- sample(1:n, floor(0.67*n))\ntrain <- datos[idx, ]\ntest  <- datos[-idx, ]\n\n\n# validacion cruzada a mano con k folds\nk <- 10\nset.seed(0)\nfolds <- sample(rep(1:k, length.out = n))\n\nmse_fold <- rep(0, k)\nfor (j in 1:k) {\n  train_j <- datos[folds != j, ]\n  test_j  <- datos[folds == j, ]\n\n  modelo <- lm(y ~ ., data = train_j)\n  pred <- predict(modelo, test_j)\n  mse_fold[j] <- mean((test_j$y - pred)^2)\n}\n\nmean(mse_fold)   # estimador cv\nsd(mse_fold)     # variabilidad entre folds\n\n\n# cv.glm del paquete boot (para modelos glm o lm)\nlibrary(boot)\nmodelo_glm <- glm(grad.rate ~ ., data = college[, -1])\n\ncv10 <- cv.glm(college[, -1], modelo_glm, k = 10)\ncv10$delta[1]    # estimador cv crudo\ncv10$delta[2]    # estimador ajustado por sesgo\n\n# loocv: omitir el argumento k\ncv_loo <- cv.glm(college[, -1], modelo_glm)\ncv_loo$delta[1]\n\n\n# con el paquete caret: calibrar k vecinos por cv\nlibrary(caret)\n\ncontrol <- traincontrol(method = \"cv\", number = 10)\najuste <- train(grad.rate ~ ., data = college[, -1],\n                method = \"knn\",\n                trcontrol = control,\n                tunegrid = data.frame(k = 1:30),\n                preprocess = c(\"center\", \"scale\"))\n\najuste\nplot(ajuste)\najuste$besttune"}, {"num": "18", "slug": "seleccion-variables", "parte": "Supervisado", "titulo": "Selección de variables", "resumen": "Forward, exhaustivo, Cp de Mallows, AIC, BIC, R2 ajustado.", "clases": "Clase 12, Clase 13", "teoria": "<h3>Por qué se hace</h3>\n<p>En un modelo de regresión lineal, la <strong>cantidad de variables predictoras es el parámetro de\nflexibilidad</strong>:</p>\n<ul>\n<li>Más variables: más flexibilidad, más varianza, menos sesgo.</li>\n<li>Menos variables: menos flexibilidad, menos varianza, más sesgo.</li>\n</ul>\n<p>Por eso hay que encontrar una forma sistemática de escoger el conjunto de variables que mejor\npredice la respuesta.</p>\n<h3>Método exhaustivo</h3>\n<p>Compara <strong>todos</strong> los modelos posibles y elige el mejor bajo cierta métrica. Garantiza encontrar el\nóptimo. El número de modelos crece de forma <strong>exponencial</strong>:</p>\n<pre><code>2^p - 1  modelos\n</code></pre>\n<p>Con p = 20 son más de un millón. Se vuelve impracticable rápido.</p>\n<h3>Método forward</h3>\n<p>Heurística. Empieza comparando todos los modelos con una sola variable. Luego agrega variables una a\nuna, <strong>dejando fijas</strong> las que ya entraron en iteraciones anteriores. No garantiza el óptimo, pero\nes mucho más eficiente. El número de modelos crece de forma <strong>cuadrática</strong>:</p>\n<pre><code>p(p+1) / 2  modelos\n</code></pre>\n<p>Con p = 20 son 210 modelos. También existe el método <strong>backward</strong>, que empieza con todas y va\nquitando.</p>\n<h3>Métricas para comparar modelos con distinto número de variables</h3>\n<p>No se puede usar el R^2 crudo ni el RSS, porque siempre mejoran al agregar variables. Hay que\npenalizar el tamaño del modelo:</p>\n<p><strong>R^2 ajustado.</strong> Se busca el <strong>máximo</strong>.</p>\n<pre><code>                  (1 - R^2)(n - 1)\nR2_adj = 1 -  ------------------------\n                   n - p - 1\n</code></pre>\n<p><strong>Cp de Mallows.</strong> Se busca el <strong>mínimo</strong>. Estima el error de predicción.</p>\n<pre><code>Cp = (1/n) * ( RSS + 2 * d * sigma_hat^2 )\n</code></pre>\n<p><strong>AIC.</strong> Se busca el <strong>mínimo</strong>. Penaliza con 2 por parámetro.</p>\n<p><strong>BIC.</strong> Se busca el <strong>mínimo</strong>. Penaliza con log(n) por parámetro, así que castiga más los modelos\ngrandes cuando n es grande. <strong>BIC tiende a escoger modelos más pequeños que AIC.</strong></p>\n<h3>Regla práctica para el parcial</h3>\n<table>\n<thead>\n<tr>\n<th>Métrica</th>\n<th>Dirección</th>\n<th>Penalización</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>R^2 ajustado</td>\n<td>máximo</td>\n<td>moderada</td>\n</tr>\n<tr>\n<td>Cp de Mallows</td>\n<td>mínimo</td>\n<td>2 por parámetro</td>\n</tr>\n<tr>\n<td>AIC</td>\n<td>mínimo</td>\n<td>2 por parámetro</td>\n</tr>\n<tr>\n<td>BIC</td>\n<td>mínimo</td>\n<td>log(n) por parámetro, la más fuerte</td>\n</tr>\n<tr>\n<td>MSE en test o CV</td>\n<td>mínimo</td>\n<td>ninguna, se mide directo</td>\n</tr>\n</tbody>\n</table>", "relacion": "<h3>En Python</h3>\n<p>Dos funciones distintas, una por método:</p>\n<ul>\n<li><strong>Forward</strong>: <code>SequentialFeatureSelector(LinearRegression(), n_features_to_select=a,\n  direction='forward')</code> de <code>sklearn.feature_selection</code>.</li>\n<li><strong>Exhaustivo</strong>: <code>ExhaustiveFeatureSelector(LinearRegression(), min_features=1, max_features=p,\n  scoring=\"neg_mean_squared_error\")</code> del paquete <strong>mlxtend</strong>, que no es sklearn.</li>\n</ul>\n<p>El notebook implementa el forward con un loop explícito sobre el número de variables <code>a</code>, calculando\nel R2 ajustado en cada iteración:</p>\n<pre><code class=\"language-python\">r2Modelo = regAuxiliar.score(XTrainSeleccionado, yTrain)\nr2adjModelo = 1-(1-r2Modelo)*(datosTrain-1)/(datosTrain-a-1)\n</code></pre>\n<p>Ese es exactamente el R2 ajustado de la fórmula. El <code>if(a &lt; p)</code> existe porque cuando se piden todas\nlas variables no hay nada que seleccionar, se ajusta el modelo completo directo.</p>\n<p>Después <code>nVariablesSeleccionadas = np.argmax(r2adj)+1</code> toma el máximo. El <strong>+1</strong> es porque el índice\n0 corresponde al modelo con 1 variable.</p>\n<p>Cuidado con el indexado al predecir: <code>XTest[:, variablesSeleccionadas-1]</code>. El vector\n<code>variablesSeleccionadas</code> está en base 1 (se construyó con <code>range(1, p+1)</code>), y numpy indexa en base 0.</p>\n<h3>En R</h3>\n<p>Una sola función hace todo: <strong><code>regsubsets</code></strong> del paquete <code>leaps</code>.</p>\n<pre><code>reg_subset = regsubsets(Salary~., Hitters, nvmax=12, method=&quot;exhaustive&quot;)\n</code></pre>\n<ul>\n<li>La fórmula <code>Y~.</code> significa respuesta contra todas las demás variables.</li>\n<li><code>nvmax</code> es el máximo número de variables (el L del comentario del profesor).</li>\n<li><code>method</code> cambia entre <code>\"exhaustive\"</code>, <code>\"forward\"</code> y <code>\"backward\"</code>. <strong>Ese es el único cambio entre\n  los dos métodos.</strong></li>\n</ul>\n<p>El resultado se lee con <code>summary()</code>, y de ahí salen las métricas:</p>\n<pre><code>reg_sub_summary$cp      # Cp de Mallows de cada mejor modelo por tamaño\nreg_sub_summary$bic     # BIC\nreg_sub_summary$adjr2   # R2 ajustado\n</code></pre>\n<p>Se grafican con <code>plot(..., type=\"b\")</code> y se busca el mínimo (Cp, BIC) o el máximo (adjr2). La función\n<code>which.min()</code> da la posición.</p>\n<p>Detalle: <code>Hitters = na.omit(Hitters)</code> es obligatorio, porque <code>regsubsets</code> no maneja datos faltantes.</p>", "python": [{"titulo": "Método forward con R2 ajustado", "origen": "Del curso, class13_book1_variable_selection.ipynb", "code": "import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.feature_selection import SequentialFeatureSelector\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.metrics import r2_score\nimport matplotlib.pyplot as plt\n\nXTotal, yTotal = datasets.load_diabetes(return_X_y=True)\nXTrain, XTest, yTrain, yTest = train_test_split(XTotal, yTotal,\n                                                test_size=0.33, random_state=18)\n\np = len(XTrain[1, ])\ndatosTrain = len(yTrain)\n\nr2adj = []\n\nfor a in range(1, p+1):\n    if(a < (p)):\n        sfs = SequentialFeatureSelector(LinearRegression(),\n                                        n_features_to_select=a,\n                                        direction='forward')\n        sfs.fit(XTrain, yTrain)\n        XTrainSeleccionado = sfs.fit_transform(XTrain, yTrain)\n        regAuxiliar = LinearRegression()\n        regAuxiliar.fit(XTrainSeleccionado, yTrain)\n        r2Modelo = regAuxiliar.score(XTrainSeleccionado, yTrain)\n        r2adjModelo = 1-(1-r2Modelo)*(datosTrain-1)/(datosTrain-a-1)\n        r2adj.append(r2adjModelo)\n    else:\n        regAuxiliar = LinearRegression()\n        regAuxiliar.fit(XTrain, yTrain)\n        r2Modelo = regAuxiliar.score(XTrain, yTrain)\n        r2adjModelo = 1-(1-r2Modelo)*(datosTrain-1)/(datosTrain-a-1)\n        r2adj.append(r2adjModelo)\n\nplt.plot(range(1, p+1), r2adj)\nplt.xlabel('Número de variables')\nplt.title('R^2 ajustado')\nplt.show()"}, {"titulo": "Elegir el mejor modelo forward y calcular el MSE", "origen": "Del curso, class13_book1_variable_selection.ipynb", "code": "nVariablesSeleccionadas = np.argmax(r2adj)+1   # el +1 corrige el índice base 0\n\nif(nVariablesSeleccionadas < p):\n    sfsElegido = SequentialFeatureSelector(LinearRegression(),\n                                           n_features_to_select=nVariablesSeleccionadas)\n    sfsElegido.fit(XTrain, yTrain)\n    XTrainSeleccionado = sfsElegido.fit_transform(XTrain, yTrain)\n    modeloFwd = LinearRegression()\n    modeloFwd.fit(XTrainSeleccionado, yTrain)\n    variablesSeleccionadas = np.array(range(1, p+1))[sfsElegido.get_support()]\nelse:\n    modeloFwd = LinearRegression()\n    modeloFwd.fit(XTrain, yTrain)\n    variablesSeleccionadas = np.array(range(1, p+1))\n\nmensaje = ['El número de variables seleccionadas es', str(nVariablesSeleccionadas),\n           'y corresponden a las columnas:', str(variablesSeleccionadas)]\nprint(\" \".join(mensaje))\n\n# Predicción y MSE. Ojo con el -1 por el cambio de base del índice\nprediccionFwd = modeloFwd.predict(XTest[:, variablesSeleccionadas-1])\nMSEFwd = np.average(np.square(prediccionFwd-yTest))\nprint('MSE forward:', MSEFwd)"}, {"titulo": "Método exhaustivo con mlxtend", "origen": "Del curso, class13_book1_variable_selection.ipynb", "code": "from mlxtend.feature_selection import ExhaustiveFeatureSelector\n\nsfse = ExhaustiveFeatureSelector(LinearRegression(),\n                                 min_features=1, max_features=p,\n                                 scoring=\"neg_mean_squared_error\")\nsfse.fit(XTrain, yTrain)\n\nmensaje = ['El número de variables seleccionadas es',\n           str(len(sfse.best_feature_names_)),\n           'y corresponden a las columnas:',\n           str(np.vectorize(int)(np.array(sfse.best_feature_names_))\n               + [1]*len(sfse.best_feature_names_))]\nprint(\" \".join(mensaje))\n\nXTrainSeleccionado = sfse.transform(XTrain)\nmodeloExh = LinearRegression()\nmodeloExh.fit(XTrainSeleccionado, yTrain)\nXTestSeleccionado = sfse.transform(XTest)\nprediccionExh = modeloExh.predict(XTestSeleccionado)\nMSEExh = np.average(np.square(prediccionExh-yTest))\nprint('MSE exhaustivo:', MSEExh)\n\n\n# Comparación de modelos\nfig = plt.figure()\nax = fig.add_axes([0, 0, 1, 1])\nax.set_title(\"Comparación de modelos\")\nejeX = ['Método forward', 'Método exhaustivo']\nejeY = [MSEFwd, MSEExh]\nax.bar(ejeX, ejeY)\n\ndef addlabels(x, y, plotP):\n    for i in range(len(x)):\n        plotP.text(i, y[i], y[i])\n\naddlabels(ejeX, ejeY, plt)\nplt.show()"}, {"titulo": "AIC y BIC en Python con statsmodels", "origen": "Equivalente agregado, no viene del material del curso", "code": "import statsmodels.api as sm\nimport numpy as np\n\n# statsmodels requiere agregar la constante a mano\nX_const = sm.add_constant(XTrain)\nmodelo = sm.OLS(yTrain, X_const).fit()\n\nprint(modelo.summary())\nprint(\"AIC:\", modelo.aic)\nprint(\"BIC:\", modelo.bic)\nprint(\"R2 ajustado:\", modelo.rsquared_adj)\n\n# Cp de Mallows calculado a mano\nmodelo_completo = sm.OLS(yTrain, sm.add_constant(XTrain)).fit()\nsigma2 = modelo_completo.mse_resid\n\ndef cp_mallows(modelo, sigma2, n):\n    rss = np.sum(modelo.resid**2)\n    d = modelo.df_model + 1\n    return (rss + 2*d*sigma2)/n\n\nprint(\"Cp:\", cp_mallows(modelo, sigma2, len(yTrain)))"}], "r": [{"titulo": "regsubsets: exhaustivo y forward (código del curso)", "origen": "Del curso, code1_class13.txt", "code": "######################################################################\n##Paquetes requeridos\n  library(ISLR)\n  library(leaps)\n\n######################################################################\n##Datos: atributos de jugadores de Baseball\n  fix(Hitters)\n#Para quitarle los datos faltantes\n  Hitters=na.omit(Hitters)\n\n\n######################################################################\n##Modelo lineal usando todas las variables\n  lm1=lm(Salary~.,data=Hitters)\n  summary(lm1)\n  AIC(lm1);  BIC(lm1)\n\n\n######################################################################\n##Búsqueda Exhaustiva\n#La función es \"regsubsets\" del paquete \"leaps\"\n#Se escribe el modelo como \"Y~X\"=\"Dependiente~independientes\"\n#El parámetro L (máximo de variables) se controla con \"nvmax\"\n\n  reg_subset=regsubsets(Salary~.,Hitters,nvmax=12,method=\"exhaustive\")\n\n  reg_sub_summary=summary(reg_subset)\n  reg_sub_summary\n\n#Argumentos del resultado\n  reg_sub_summary$cp  #(los Cp de Mallows para cada mejor modelo con cada k)\n\n#Gráficos\n  plot(reg_sub_summary$cp,type=\"b\")               #Cp de Mallows\n  plot(reg_sub_summary$bic,type=\"b\",col=\"red\")    #BIC\n  plot(reg_sub_summary$adjr2,type=\"b\",col=\"blue\") #R2 ajustado\n\n\n######################################################################\n##Método Forward\n##Se escribe igual, solo cambia el método:\n\n  reg_subset=regsubsets(Salary~.,Hitters,method=\"forward\",nvmax=19)"}, {"titulo": "Extraer el mejor modelo y sus coeficientes", "origen": "Equivalente agregado, no viene del material del curso", "code": "library(ISLR)\nlibrary(leaps)\n\nHitters <- na.omit(Hitters)\n\nsubs <- regsubsets(Salary ~ ., Hitters, nvmax = 19, method = \"exhaustive\")\nres <- summary(subs)\n\n# Mejor tamaño según cada criterio\nwhich.min(res$cp)      # Cp de Mallows: mínimo\nwhich.min(res$bic)     # BIC: mínimo\nwhich.max(res$adjr2)   # R2 ajustado: máximo\nwhich.min(res$rss)     # RSS: siempre el modelo más grande, por eso no sirve\n\n# Coeficientes del mejor modelo de tamaño k\nk <- which.min(res$bic)\ncoef(subs, k)\n\n# Qué variables entraron\nnames(coef(subs, k))[-1]\n\n# Gráficos de los tres criterios juntos\npar(mfrow = c(1, 3))\nplot(res$cp, type = \"b\", xlab = \"Número de variables\", ylab = \"Cp\")\npoints(which.min(res$cp), min(res$cp), col = \"red\", cex = 2, pch = 20)\n\nplot(res$bic, type = \"b\", xlab = \"Número de variables\", ylab = \"BIC\")\npoints(which.min(res$bic), min(res$bic), col = \"red\", cex = 2, pch = 20)\n\nplot(res$adjr2, type = \"b\", xlab = \"Número de variables\", ylab = \"R2 ajustado\")\npoints(which.max(res$adjr2), max(res$adjr2), col = \"red\", cex = 2, pch = 20)\npar(mfrow = c(1, 1))\n\n# Gráfico propio de regsubsets: qué variables entran en cada mejor modelo\nplot(subs, scale = \"bic\")\n\n\n# Comparar exhaustivo, forward y backward\nexh  <- regsubsets(Salary ~ ., Hitters, nvmax = 19, method = \"exhaustive\")\nfwd  <- regsubsets(Salary ~ ., Hitters, nvmax = 19, method = \"forward\")\nbwd  <- regsubsets(Salary ~ ., Hitters, nvmax = 19, method = \"backward\")\n\ncoef(exh, 7)\ncoef(fwd, 7)\ncoef(bwd, 7)   # no tienen que coincidir\n\n\n# Selección por AIC paso a paso con step()\nmodelo_completo <- lm(Salary ~ ., data = Hitters)\nmodelo_nulo <- lm(Salary ~ 1, data = Hitters)\n\nstep_fwd <- step(modelo_nulo,\n                 scope = list(lower = modelo_nulo, upper = modelo_completo),\n                 direction = \"forward\")\n\nstep_bwd <- step(modelo_completo, direction = \"backward\")\n\n# Para usar BIC en vez de AIC se pasa k = log(n)\nstep_bic <- step(modelo_completo, direction = \"backward\", k = log(nrow(Hitters)))"}, {"titulo": "Selección con MSE en test", "origen": "Del curso, code2_class14.txt (primera parte)", "code": "library(ISLR)\ncollege=College\ncollege=college[,-1]\n\n########################################################################\n#Se parte la muestra en dos: train y test\n#Se usa el MSE con la muestra test\n\nset.seed(23)\nn1=sample(seq(1:dim(college)[1]),dim(college)[1]-200)\ntrain=college[n1,]\ntest=college[-n1,]\n\n\n########################################################################\n#Modelo con el mejor subconjunto de variables\nlibrary(leaps)\n\nsubs=regsubsets(Grad.Rate~.,train,nvmax=14)\nsum_subs=summary(subs)\nplot(sum_subs$cp)\nwhich.min(sum_subs$cp)\nsum_subs\n\n#Best choice\nlm1=lm(Grad.Rate~Apps+Enroll+Top25perc+F.Undergrad+P.Undergrad+\n       Outstate+Room.Board+Personal+perc.alumni,data=train)\nsummary(lm1)\npred=predict(lm1,test)\nmse=mean((test$Grad.Rate-pred)^2)\nmse"}], "busqueda": "18 seleccion de variables forward, exhaustivo, cp de mallows, aic, bic, r2 ajustado. supervisado clase 12, clase 13  por que se hace \n en un modelo de regresion lineal, la  cantidad de variables predictoras es el parametro de\nflexibilidad : \n \n mas variables: mas flexibilidad, mas varianza, menos sesgo. \n menos variables: menos flexibilidad, menos varianza, mas sesgo. \n \n por eso hay que encontrar una forma sistematica de escoger el conjunto de variables que mejor\npredice la respuesta. \n metodo exhaustivo \n compara  todos  los modelos posibles y elige el mejor bajo cierta metrica. garantiza encontrar el\noptimo. el numero de modelos crece de forma  exponencial : \n  2^p - 1  modelos\n  \n con p = 20 son mas de un millon. se vuelve impracticable rapido. \n metodo forward \n heuristica. empieza comparando todos los modelos con una sola variable. luego agrega variables una a\nuna,  dejando fijas  las que ya entraron en iteraciones anteriores. no garantiza el optimo, pero\nes mucho mas eficiente. el numero de modelos crece de forma  cuadratica : \n  p(p+1) / 2  modelos\n  \n con p = 20 son 210 modelos. tambien existe el metodo  backward , que empieza con todas y va\nquitando. \n metricas para comparar modelos con distinto numero de variables \n no se puede usar el r^2 crudo ni el rss, porque siempre mejoran al agregar variables. hay que\npenalizar el tamano del modelo: \n  r^2 ajustado.  se busca el  maximo . \n                    (1 - r^2)(n - 1)\nr2_adj = 1 -  ------------------------\n                   n - p - 1\n  \n  cp de mallows.  se busca el  minimo . estima el error de prediccion. \n  cp = (1/n) * ( rss + 2 * d * sigma_hat^2 )\n  \n  aic.  se busca el  minimo . penaliza con 2 por parametro. \n  bic.  se busca el  minimo . penaliza con log(n) por parametro, asi que castiga mas los modelos\ngrandes cuando n es grande.  bic tiende a escoger modelos mas pequenos que aic.  \n regla practica para el parcial \n \n \n \n metrica \n direccion \n penalizacion \n \n \n \n \n r^2 ajustado \n maximo \n moderada \n \n \n cp de mallows \n minimo \n 2 por parametro \n \n \n aic \n minimo \n 2 por parametro \n \n \n bic \n minimo \n log(n) por parametro, la mas fuerte \n \n \n mse en test o cv \n minimo \n ninguna, se mide directo \n \n \n  metodo forward con r2 ajustado import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.feature_selection import sequentialfeatureselector\nfrom sklearn.linear_model import linearregression\nfrom sklearn.metrics import r2_score\nimport matplotlib.pyplot as plt\n\nxtotal, ytotal = datasets.load_diabetes(return_x_y=true)\nxtrain, xtest, ytrain, ytest = train_test_split(xtotal, ytotal,\n                                                test_size=0.33, random_state=18)\n\np = len(xtrain[1, ])\ndatostrain = len(ytrain)\n\nr2adj = []\n\nfor a in range(1, p+1):\n    if(a < (p)):\n        sfs = sequentialfeatureselector(linearregression(),\n                                        n_features_to_select=a,\n                                        direction='forward')\n        sfs.fit(xtrain, ytrain)\n        xtrainseleccionado = sfs.fit_transform(xtrain, ytrain)\n        regauxiliar = linearregression()\n        regauxiliar.fit(xtrainseleccionado, ytrain)\n        r2modelo = regauxiliar.score(xtrainseleccionado, ytrain)\n        r2adjmodelo = 1-(1-r2modelo)*(datostrain-1)/(datostrain-a-1)\n        r2adj.append(r2adjmodelo)\n    else:\n        regauxiliar = linearregression()\n        regauxiliar.fit(xtrain, ytrain)\n        r2modelo = regauxiliar.score(xtrain, ytrain)\n        r2adjmodelo = 1-(1-r2modelo)*(datostrain-1)/(datostrain-a-1)\n        r2adj.append(r2adjmodelo)\n\nplt.plot(range(1, p+1), r2adj)\nplt.xlabel('numero de variables')\nplt.title('r^2 ajustado')\nplt.show() elegir el mejor modelo forward y calcular el mse nvariablesseleccionadas = np.argmax(r2adj)+1   # el +1 corrige el indice base 0\n\nif(nvariablesseleccionadas < p):\n    sfselegido = sequentialfeatureselector(linearregression(),\n                                           n_features_to_select=nvariablesseleccionadas)\n    sfselegido.fit(xtrain, ytrain)\n    xtrainseleccionado = sfselegido.fit_transform(xtrain, ytrain)\n    modelofwd = linearregression()\n    modelofwd.fit(xtrainseleccionado, ytrain)\n    variablesseleccionadas = np.array(range(1, p+1))[sfselegido.get_support()]\nelse:\n    modelofwd = linearregression()\n    modelofwd.fit(xtrain, ytrain)\n    variablesseleccionadas = np.array(range(1, p+1))\n\nmensaje = ['el numero de variables seleccionadas es', str(nvariablesseleccionadas),\n           'y corresponden a las columnas:', str(variablesseleccionadas)]\nprint(\" \".join(mensaje))\n\n# prediccion y mse. ojo con el -1 por el cambio de base del indice\nprediccionfwd = modelofwd.predict(xtest[:, variablesseleccionadas-1])\nmsefwd = np.average(np.square(prediccionfwd-ytest))\nprint('mse forward:', msefwd) metodo exhaustivo con mlxtend from mlxtend.feature_selection import exhaustivefeatureselector\n\nsfse = exhaustivefeatureselector(linearregression(),\n                                 min_features=1, max_features=p,\n                                 scoring=\"neg_mean_squared_error\")\nsfse.fit(xtrain, ytrain)\n\nmensaje = ['el numero de variables seleccionadas es',\n           str(len(sfse.best_feature_names_)),\n           'y corresponden a las columnas:',\n           str(np.vectorize(int)(np.array(sfse.best_feature_names_))\n               + [1]*len(sfse.best_feature_names_))]\nprint(\" \".join(mensaje))\n\nxtrainseleccionado = sfse.transform(xtrain)\nmodeloexh = linearregression()\nmodeloexh.fit(xtrainseleccionado, ytrain)\nxtestseleccionado = sfse.transform(xtest)\nprediccionexh = modeloexh.predict(xtestseleccionado)\nmseexh = np.average(np.square(prediccionexh-ytest))\nprint('mse exhaustivo:', mseexh)\n\n\n# comparacion de modelos\nfig = plt.figure()\nax = fig.add_axes([0, 0, 1, 1])\nax.set_title(\"comparacion de modelos\")\nejex = ['metodo forward', 'metodo exhaustivo']\nejey = [msefwd, mseexh]\nax.bar(ejex, ejey)\n\ndef addlabels(x, y, plotp):\n    for i in range(len(x)):\n        plotp.text(i, y[i], y[i])\n\naddlabels(ejex, ejey, plt)\nplt.show() aic y bic en python con statsmodels import statsmodels.api as sm\nimport numpy as np\n\n# statsmodels requiere agregar la constante a mano\nx_const = sm.add_constant(xtrain)\nmodelo = sm.ols(ytrain, x_const).fit()\n\nprint(modelo.summary())\nprint(\"aic:\", modelo.aic)\nprint(\"bic:\", modelo.bic)\nprint(\"r2 ajustado:\", modelo.rsquared_adj)\n\n# cp de mallows calculado a mano\nmodelo_completo = sm.ols(ytrain, sm.add_constant(xtrain)).fit()\nsigma2 = modelo_completo.mse_resid\n\ndef cp_mallows(modelo, sigma2, n):\n    rss = np.sum(modelo.resid**2)\n    d = modelo.df_model + 1\n    return (rss + 2*d*sigma2)/n\n\nprint(\"cp:\", cp_mallows(modelo, sigma2, len(ytrain))) regsubsets: exhaustivo y forward (codigo del curso) ######################################################################\n##paquetes requeridos\n  library(islr)\n  library(leaps)\n\n######################################################################\n##datos: atributos de jugadores de baseball\n  fix(hitters)\n#para quitarle los datos faltantes\n  hitters=na.omit(hitters)\n\n\n######################################################################\n##modelo lineal usando todas las variables\n  lm1=lm(salary~.,data=hitters)\n  summary(lm1)\n  aic(lm1);  bic(lm1)\n\n\n######################################################################\n##busqueda exhaustiva\n#la funcion es \"regsubsets\" del paquete \"leaps\"\n#se escribe el modelo como \"y~x\"=\"dependiente~independientes\"\n#el parametro l (maximo de variables) se controla con \"nvmax\"\n\n  reg_subset=regsubsets(salary~.,hitters,nvmax=12,method=\"exhaustive\")\n\n  reg_sub_summary=summary(reg_subset)\n  reg_sub_summary\n\n#argumentos del resultado\n  reg_sub_summary$cp  #(los cp de mallows para cada mejor modelo con cada k)\n\n#graficos\n  plot(reg_sub_summary$cp,type=\"b\")               #cp de mallows\n  plot(reg_sub_summary$bic,type=\"b\",col=\"red\")    #bic\n  plot(reg_sub_summary$adjr2,type=\"b\",col=\"blue\") #r2 ajustado\n\n\n######################################################################\n##metodo forward\n##se escribe igual, solo cambia el metodo:\n\n  reg_subset=regsubsets(salary~.,hitters,method=\"forward\",nvmax=19) extraer el mejor modelo y sus coeficientes library(islr)\nlibrary(leaps)\n\nhitters <- na.omit(hitters)\n\nsubs <- regsubsets(salary ~ ., hitters, nvmax = 19, method = \"exhaustive\")\nres <- summary(subs)\n\n# mejor tamano segun cada criterio\nwhich.min(res$cp)      # cp de mallows: minimo\nwhich.min(res$bic)     # bic: minimo\nwhich.max(res$adjr2)   # r2 ajustado: maximo\nwhich.min(res$rss)     # rss: siempre el modelo mas grande, por eso no sirve\n\n# coeficientes del mejor modelo de tamano k\nk <- which.min(res$bic)\ncoef(subs, k)\n\n# que variables entraron\nnames(coef(subs, k))[-1]\n\n# graficos de los tres criterios juntos\npar(mfrow = c(1, 3))\nplot(res$cp, type = \"b\", xlab = \"numero de variables\", ylab = \"cp\")\npoints(which.min(res$cp), min(res$cp), col = \"red\", cex = 2, pch = 20)\n\nplot(res$bic, type = \"b\", xlab = \"numero de variables\", ylab = \"bic\")\npoints(which.min(res$bic), min(res$bic), col = \"red\", cex = 2, pch = 20)\n\nplot(res$adjr2, type = \"b\", xlab = \"numero de variables\", ylab = \"r2 ajustado\")\npoints(which.max(res$adjr2), max(res$adjr2), col = \"red\", cex = 2, pch = 20)\npar(mfrow = c(1, 1))\n\n# grafico propio de regsubsets: que variables entran en cada mejor modelo\nplot(subs, scale = \"bic\")\n\n\n# comparar exhaustivo, forward y backward\nexh  <- regsubsets(salary ~ ., hitters, nvmax = 19, method = \"exhaustive\")\nfwd  <- regsubsets(salary ~ ., hitters, nvmax = 19, method = \"forward\")\nbwd  <- regsubsets(salary ~ ., hitters, nvmax = 19, method = \"backward\")\n\ncoef(exh, 7)\ncoef(fwd, 7)\ncoef(bwd, 7)   # no tienen que coincidir\n\n\n# seleccion por aic paso a paso con step()\nmodelo_completo <- lm(salary ~ ., data = hitters)\nmodelo_nulo <- lm(salary ~ 1, data = hitters)\n\nstep_fwd <- step(modelo_nulo,\n                 scope = list(lower = modelo_nulo, upper = modelo_completo),\n                 direction = \"forward\")\n\nstep_bwd <- step(modelo_completo, direction = \"backward\")\n\n# para usar bic en vez de aic se pasa k = log(n)\nstep_bic <- step(modelo_completo, direction = \"backward\", k = log(nrow(hitters))) seleccion con mse en test library(islr)\ncollege=college\ncollege=college[,-1]\n\n########################################################################\n#se parte la muestra en dos: train y test\n#se usa el mse con la muestra test\n\nset.seed(23)\nn1=sample(seq(1:dim(college)[1]),dim(college)[1]-200)\ntrain=college[n1,]\ntest=college[-n1,]\n\n\n########################################################################\n#modelo con el mejor subconjunto de variables\nlibrary(leaps)\n\nsubs=regsubsets(grad.rate~.,train,nvmax=14)\nsum_subs=summary(subs)\nplot(sum_subs$cp)\nwhich.min(sum_subs$cp)\nsum_subs\n\n#best choice\nlm1=lm(grad.rate~apps+enroll+top25perc+f.undergrad+p.undergrad+\n       outstate+room.board+personal+perc.alumni,data=train)\nsummary(lm1)\npred=predict(lm1,test)\nmse=mean((test$grad.rate-pred)^2)\nmse"}, {"num": "19", "slug": "ridge-lasso-elasticnet", "parte": "Supervisado", "titulo": "Ridge, LASSO y Elastic Net", "resumen": "Penalización, norma 1 y norma 2, lambda por CV, glmnet y alpha.", "clases": "Clase 14", "teoria": "<h3>El punto de partida</h3>\n<p>Mínimos cuadrados resuelve:</p>\n<pre><code>beta_hat = argmin  sum_i ( Y_i - beta^t X_i )^2\n</code></pre>\n<p>El problema: si hay <strong>redundancia de información</strong> entre las variables predictoras\n(multicolinealidad), la estimación de los betas tiene mucha varianza y algunos betas toman valores\nabsolutos muy grandes. Los signos se vuelven inestables y el modelo predice mal fuera de muestra.</p>\n<h3>La solución: penalizar</h3>\n<p>Se agrega un término que castiga el tamaño del vector de betas:</p>\n<pre><code>beta_hat = argmin  sum_i ( Y_i - beta^t X_i )^2  +  lambda * || beta ||\n</code></pre>\n<p>donde lambda &gt; 0 es el <strong>parámetro de penalización</strong> (el parámetro de flexibilidad de estos\nmodelos). La diferencia entre los tres métodos es <strong>cómo se define la norma</strong>.</p>\n<h3>Ridge, penalización cuadrática (norma 2)</h3>\n<pre><code>beta_hat = argmin  sum_i ( Y_i - beta^t X_i )^2  +  lambda * sum_j beta_j^2\n</code></pre>\n<ul>\n<li><strong>Encoge</strong> los coeficientes hacia cero pero <strong>nunca los hace exactamente cero</strong>.</li>\n<li>Conserva todas las variables en el modelo.</li>\n<li>Funciona muy bien con multicolinealidad: reparte el peso entre variables correlacionadas.</li>\n</ul>\n<h3>LASSO, penalización de valor absoluto (norma 1)</h3>\n<pre><code>beta_hat = argmin  sum_i ( Y_i - beta^t X_i )^2  +  lambda * sum_j |beta_j|\n</code></pre>\n<ul>\n<li><strong>Sí hace exactamente cero</strong> algunos coeficientes. Es decir, <strong>selecciona variables</strong>\n  automáticamente.</li>\n<li>Produce modelos dispersos (sparse) y más fáciles de interpretar.</li>\n<li>Entre variables muy correlacionadas tiende a escoger una y anular las demás, de forma algo\n  arbitraria.</li>\n</ul>\n<h3>Elastic Net, combinación de las dos</h3>\n<pre><code>beta_hat = argmin  sum_i ( Y_i - beta^t X_i )^2  +  lambda * ( (1-alpha) sum_j beta_j^2 + alpha sum_j |beta_j| )\n</code></pre>\n<p>Dos parámetros de calibración: lambda y alpha.</p>\n<ul>\n<li><strong>alpha = 0</strong>: es Ridge.</li>\n<li><strong>alpha = 1</strong>: es LASSO.</li>\n<li>Intermedio: selecciona variables como LASSO pero maneja mejor los grupos de variables\n  correlacionadas, tendiendo a incluirlas o excluirlas juntas.</li>\n</ul>\n<h3>Cuidado con la convención de alpha</h3>\n<p>Esta es una trampa clásica de parcial. <strong>La notación de la fórmula del curso y la de glmnet en R\nestán invertidas:</strong></p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>alpha = 0</th>\n<th>alpha = 1</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fórmula del curso</td>\n<td>Ridge</td>\n<td>LASSO</td>\n</tr>\n<tr>\n<td><code>glmnet</code> en R</td>\n<td>Ridge</td>\n<td>LASSO</td>\n</tr>\n<tr>\n<td><code>ElasticNet</code> en sklearn (<code>l1_ratio</code>)</td>\n<td>Ridge</td>\n<td>LASSO</td>\n</tr>\n</tbody>\n</table>\n<p>En la fórmula del curso alpha multiplica la norma 1, igual que en glmnet y que <code>l1_ratio</code> de\nsklearn. Así que las tres coinciden. Lo que sí hay que recordar: en sklearn el parámetro de\npenalización se llama <strong><code>alpha</code></strong> (es el lambda de la teoría) y la mezcla se llama <strong><code>l1_ratio</code></strong>.</p>\n<h3>Escalamiento</h3>\n<p>Las tres penalizaciones dependen de la escala de las variables, porque penalizan el tamaño de los\ncoeficientes. <strong>Siempre se estandariza antes.</strong> <code>glmnet</code> lo hace por defecto con\n<code>standardize = TRUE</code>.</p>\n<h3>Cómo se ve el efecto de lambda</h3>\n<p>El gráfico típico pone lambda en el eje horizontal (en escala logarítmica y muchas veces invertido)\ny los coeficientes en el vertical. Se ve como todos convergen a cero cuando lambda crece. En LASSO\nlos coeficientes tocan cero y se quedan ahí, en Ridge solo se acercan asintóticamente.</p>", "relacion": "<h3>En Python</h3>\n<p>Cada modelo tiene <strong>dos versiones</strong> en sklearn:</p>\n<table>\n<thead>\n<tr>\n<th>Sin CV</th>\n<th>Con CV</th>\n<th>Qué hace la versión CV</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Ridge(alpha=a)</code></td>\n<td><code>RidgeCV(alphas=...)</code></td>\n<td>prueba toda la rejilla y se queda con la mejor</td>\n</tr>\n<tr>\n<td><code>Lasso(alpha=a)</code></td>\n<td><code>LassoCV(alphas=...)</code></td>\n<td>igual</td>\n</tr>\n<tr>\n<td><code>ElasticNet(alpha=a)</code></td>\n<td><code>ElasticNetCV(alphas=..., cv=5)</code></td>\n<td>igual</td>\n</tr>\n</tbody>\n</table>\n<p>La rejilla se arma siempre igual:</p>\n<pre><code class=\"language-python\">n_alphas = 200\nalphasCalibrar = np.logspace(-10, 2, n_alphas)   # de 10^-10 a 10^2, en escala log\n</code></pre>\n<p>Se usa escala logarítmica porque el efecto de lambda es multiplicativo, no aditivo.</p>\n<p>Después de ajustar, <code>modeloRidge.alpha_</code> (con guion bajo al final) guarda el <strong>lambda escogido</strong>.\nNo confundir con el argumento <code>alphas</code> de entrada.</p>\n<p>El bloque que gráfica los coeficientes usa <code>Ridge</code> sin CV dentro de un loop, porque necesita el\nvector de betas para <strong>cada</strong> valor de la rejilla, no solo el óptimo:</p>\n<pre><code class=\"language-python\">coefs = []\nfor a in alphasCalibrar:\n    ridge = Ridge(alpha=a, fit_intercept=False)\n    ridge.fit(XTrain, yTrain)\n    coefs.append(ridge.coef_)\n</code></pre>\n<p>El <code>ax.set_xlim(ax.get_xlim()[::-1])</code> invierte el eje para que la flexibilidad crezca hacia la\nderecha.</p>\n<p>Nota: <code>store_cv_values=True</code> en <code>RidgeCV</code> cambio de nombre en versiones recientes de sklearn a\n<code>store_cv_results</code>. Si da error, se quita ese argumento.</p>\n<h3>En R</h3>\n<p>Una sola función, <code>glmnet</code>, y el tipo de penalización se controla con <strong><code>alpha</code></strong>:</p>\n<pre><code>cvmod = cv.glmnet(X, y, alpha=0)     # Ridge\ncvmod = cv.glmnet(X, y, alpha=1)     # LASSO\ncvmod = cv.glmnet(X, y, alpha=0.3)   # Elastic Net\n</code></pre>\n<p>Flujo estándar, que se repite idéntico para los tres:</p>\n<ol>\n<li><code>X = model.matrix(Grad.Rate~., train)[,-1]</code> convierte el data frame en matriz numérica.\n   El <code>[,-1]</code> quita la columna del intercepto, que glmnet agrega por su cuenta. <strong>Este paso es\n   obligatorio</strong>, glmnet no acepta fórmulas ni factores directamente.</li>\n<li><code>cvmod = cv.glmnet(X, y, alpha=...)</code> hace la validación cruzada sobre lambda.</li>\n<li><code>cvmod$lambda.min</code> es el lambda que minimiza el error de CV.\n   <code>cvmod$lambda.1se</code> es el mayor lambda que queda dentro de un error estándar del mínimo, un modelo\n   más simple y más robusto.</li>\n<li><code>plot(cvmod)</code> gráfica la curva de CV con las barras de error.</li>\n<li><code>glmnet(X, y, alpha=..., lambda=cvmod$lambda.min)</code> ajusta el modelo final.</li>\n<li><code>coef(mod_pen1)</code> muestra los coeficientes. <strong>En LASSO los ceros aparecen como puntos.</strong></li>\n<li><code>predict(mod, Xtest)</code> y luego el MSE a mano.</li>\n</ol>\n<p>Para el gráfico de las trayectorias de los betas se ajusta <strong>sin</strong> especificar lambda, y glmnet\nrecorre toda la secuencia: <code>plot(glmnet(X,y,alpha=1), xvar=\"lambda\")</code>.</p>", "python": [{"titulo": "Ridge con calibración por CV", "origen": "Del curso, class14_book1_penalty.ipynb", "code": "import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.linear_model import RidgeCV, Ridge\nfrom sklearn.linear_model import LassoCV, Lasso\nfrom sklearn.linear_model import ElasticNetCV, ElasticNet\nimport matplotlib.pyplot as plt\n\nXTotal, yTotal = datasets.load_diabetes(return_X_y=True)\nXTrain, XTest, yTrain, yTest = train_test_split(XTotal, yTotal,\n                                                test_size=0.33, random_state=0)\n\n# Rejilla logarítmica de valores de lambda\nn_alphas = 200\nalphasCalibrar = np.logspace(-10, 2, n_alphas)\n\nmodeloRidge = RidgeCV(alphas=alphasCalibrar, store_cv_values=True).fit(XTrain, yTrain)\n\nprint('El parámetro de penalización óptimo es:')\nprint(modeloRidge.alpha_)\nprint('El valor del R^2 es:')\nprint(modeloRidge.score(XTrain, yTrain))\nprint('Los coeficientes estimados son:')\nprint(modeloRidge.coef_)\n\n# Trayectoria de los coeficientes al variar lambda\ncoefs = []\nfor a in alphasCalibrar:\n    ridge = Ridge(alpha=a, fit_intercept=False)\n    ridge.fit(XTrain, yTrain)\n    coefs.append(ridge.coef_)\n\nax = plt.gca()\nax.plot(alphasCalibrar, coefs)\nax.set_xscale('log')\nax.set_xlim(ax.get_xlim()[::-1])\nplt.xlabel('Parámetro de penalización')\nplt.ylabel('Coeficientes')\nplt.title('Penalización Ridge')\nplt.axis('tight')\nplt.show()\n\nprediccionRidge = modeloRidge.predict(XTest)\nMSERidge = np.average(np.square(prediccionRidge-yTest))\nprint('MSE Ridge:', MSERidge)"}, {"titulo": "LASSO", "origen": "Del curso, class14_book1_penalty.ipynb", "code": "n_alphas = 200\nalphasCalibrar = np.logspace(-10, 2, n_alphas)\n\nmodeloLASSO = LassoCV(alphas=alphasCalibrar).fit(XTrain, yTrain)\n\nprint('El parámetro de penalización es:')\nprint(modeloLASSO.alpha_)\nprint('El valor del R^2 es:')\nprint(modeloLASSO.score(XTrain, yTrain))\nprint('Los coeficientes estimados son:')\nprint(modeloLASSO.coef_)   # algunos seran exactamente cero\n\ncoefs = []\nfor a in alphasCalibrar:\n    lasso = Lasso(alpha=a, fit_intercept=False, max_iter=10000)\n    lasso.fit(XTrain, yTrain)\n    coefs.append(lasso.coef_)\n\nax = plt.gca()\nax.plot(alphasCalibrar, coefs)\nax.set_xscale('log')\nax.set_xlim(ax.get_xlim()[::-1])\nplt.xlabel('Parámetro de penalización')\nplt.ylabel('Coeficientes')\nplt.title('Penalización LASSO')\nplt.axis('tight')\nplt.show()\n\nprediccionLASSO = modeloLASSO.predict(XTest)\nMSELASSO = np.average(np.square(prediccionLASSO-yTest))\nprint('MSE LASSO:', MSELASSO)\n\n# Variables que sobrevivieron\nprint(\"Variables seleccionadas:\", np.where(modeloLASSO.coef_ != 0)[0])"}, {"titulo": "Elastic Net y comparación final", "origen": "Del curso, class14_book1_penalty.ipynb", "code": "n_alphas = 200\nalphasCalibrar = np.logspace(-10, 2, n_alphas)\n\nmodeloElastic = ElasticNetCV(alphas=alphasCalibrar, cv=5,\n                             random_state=0).fit(XTrain, yTrain)\n\nprint('El parámetro de penalización es:')\nprint(modeloElastic.alpha_)\nprint('El valor del R^2 es:')\nprint(modeloElastic.score(XTrain, yTrain))\nprint('Los coeficientes estimados son:')\nprint(modeloElastic.coef_)\n\ncoefs = []\nfor a in alphasCalibrar:\n    elasticNet = ElasticNet(alpha=a, fit_intercept=False, max_iter=10000)\n    elasticNet.fit(XTrain, yTrain)\n    coefs.append(elasticNet.coef_)\n\nax = plt.gca()\nax.plot(alphasCalibrar, coefs)\nax.set_xscale('log')\nax.set_xlim(ax.get_xlim()[::-1])\nplt.xlabel('Parámetro de penalización')\nplt.ylabel('Coeficientes')\nplt.title('Penalización Elastic Net')\nplt.axis('tight')\nplt.show()\n\nprediccionElastic = modeloElastic.predict(XTest)\nMSEElastic = np.average(np.square(prediccionElastic-yTest))\nprint('MSE Elastic Net:', MSEElastic)\n\n\n# Comparación de los tres modelos\nfig = plt.figure()\nax = fig.add_axes([0, 0, 1, 1])\nax.set_title(\"Comparación de modelos\")\nejeX = ['LASSO', 'Ridge', 'Elastic Net']\nejeY = [MSELASSO, MSERidge, MSEElastic]\nax.bar(ejeX, ejeY)\n\ndef addlabels(x, y, plotP):\n    for i in range(len(x)):\n        plotP.text(i, y[i], y[i])\n\naddlabels(ejeX, ejeY, plt)\nplt.show()"}, {"titulo": "Calibrar lambda y l1_ratio al tiempo", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.linear_model import ElasticNetCV\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.pipeline import make_pipeline\nimport numpy as np\n\n# ElasticNetCV puede calibrar los dos parámetros a la vez\nmodelo = ElasticNetCV(l1_ratio=[0.1, 0.3, 0.5, 0.7, 0.9, 0.95, 1.0],\n                      alphas=np.logspace(-4, 2, 100),\n                      cv=10, random_state=0, max_iter=10000)\nmodelo.fit(XTrain, yTrain)\n\nprint(\"lambda escogido:\", modelo.alpha_)\nprint(\"l1_ratio escogido:\", modelo.l1_ratio_)\nprint(\"Coeficientes en cero:\", np.sum(modelo.coef_ == 0))\n\n# Con escalamiento dentro del pipeline (evita filtrar información entre folds)\ntuberia = make_pipeline(\n    StandardScaler(),\n    ElasticNetCV(l1_ratio=[0.1, 0.5, 0.9, 1.0],\n                 alphas=np.logspace(-4, 2, 100),\n                 cv=10, random_state=0, max_iter=10000)\n)\ntuberia.fit(XTrain, yTrain)\n\nprediccion = tuberia.predict(XTest)\nprint(\"MSE:\", np.average(np.square(prediccion - yTest)))"}], "r": [{"titulo": "Ridge, s betas toman valores\nabsolutos muy grandes. los signos se vuelven inestables y el modelo predice mal fuera de muestra. \n la solucion: penalizar \n se agrega un termino que castiga el tamano del vector de betas: \n  beta_hat = argmin  sum_i ( y_i - beta^t x_i )^2  +  lambda * || beta ||\n  \n donde lambda &gt; 0 es el  parametro de penalizacion  (el parametro de flexibilidad de estos\nmodelos). la diferencia entre los tres metodos es  como se define la norma . \n ridge, penalizacion cuadratica (norma 2) \n  beta_hat = argmin  sum_i ( y_i - beta^t x_i )^2  +  lambda * sum_j beta_j^2\n  \n \n  encoge  los coeficientes hacia cero pero  nunca los hace exactamente cero . \n conserva todas las variables en el modelo. \n funciona muy bien con multicolinealidad: reparte el peso entre variables correlacionadas. \n \n lasso, penalizacion de valor absoluto (norma 1) \n  beta_hat = argmin  sum_i ( y_i - beta^t x_i )^2  +  lambda * sum_j |beta_j|\n  \n \n  si hace exactamente cero  algunos coeficientes. es decir,  selecciona variables \n  automaticamente. \n produce modelos dispersos (sparse) y mas faciles de interpretar. \n entre variables muy correlacionadas tiende a escoger una y anular las demas, de forma algo\n  arbitraria. \n \n elastic net, combinacion de las dos \n  beta_hat = argmin  sum_i ( y_i - beta^t x_i )^2  +  lambda * ( (1-alpha) sum_j beta_j^2 + alpha sum_j |beta_j| )\n  \n dos parametros de calibracion: lambda y alpha. \n \n  alpha = 0 : es ridge. \n  alpha = 1 : es lasso. \n intermedio: selecciona variables como lasso pero maneja mejor los grupos de variables\n  correlacionadas, tendiendo a incluirlas o excluirlas juntas. \n \n cuidado con la convencion de alpha \n esta es una trampa clasica de parcial.  la notacion de la formula del curso y la de glmnet en r\nestan invertidas:  \n \n \n \n  \n alpha = 0 \n alpha = 1 \n \n \n \n \n formula del curso \n ridge \n lasso \n \n \n  glmnet  en r \n ridge \n lasso \n \n \n  elasticnet  en sklearn ( l1_ratio ) \n ri  minimiza el error de cv\ncvmod$lambda.1se   # el mayor lambda a un error estandar del minimo (modelo mas simple)\n\ncoef(cvmod, s = \"lambda.min\")\ncoef(cvmod, s = \"lambda.1se\")\n\n# numero de variables distintas de cero para cada lambda\ncvmod$nzero\n\n# ver que variables sobreviven en lasso\nbetas <- coef(cvmod, s = \"lambda.min\")\nbetas[betas[, 1] != 0, , drop = false]\n\n\n# calibrar alpha y lambda al tiempo\nalphas <- seq(0, 1, by = 0.1)\nresultados <- data.frame(alpha = alphas, lambda = na, mse_cv = na)\n\nset.seed(1)\nfoldid <- sample(1:10, size = length(y), replace = true)   # mismos folds para comparar\n\nfor (i in seq_along(alphas)) {\n  cv_i <- cv.glmnet(x, y, alpha = alphas[i], foldid = foldid)\n  resultados$lambda[i] <- cv_i$lambda.min\n  resultados$mse_cv[i] <- min(cv_i$cvm)\n}\n\nresultados\nmejor <- resultados[which.min(resultados$mse_cv), ]\nmejor\n\n# modelo final\nmodelo_final <- glmnet(x, y, alpha = mejor$alpha, lambda = mejor$lambda)\ncoef(modelo_final)\n\n\n# trayectorias de coeficientes\nmod_path <- glmnet(x, y, alpha = 1)\nplot(mod_path, xvar = \"lambda\", label = true)\nplot(mod_path, xvar = \"dev\", label = true)     # contra desviacion explicada\nplot(mod_path, xvar = \"norm\", label = true)    # contra norma l1\n\n\n# glmnet estandariza por defecto. para desactivarlo:\n# glmnet(x, y, alpha = 1, standardize = false)"}], "cheat": "<h1>Referencia rápida: funciones equivalentes</h1>\n<h2>Clustering</h2>\n<table>\n<thead>\n<tr>\n<th>Tarea</th>\n<th>Python</th>\n<th>R</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>K-Means</td>\n<td><code>KMeans(n_clusters=K, n_init=10).fit(X)</code></td>\n<td><code>kmeans(X, centers=K, nstart=25)</code></td>\n</tr>\n<tr>\n<td>Centroides</td>\n<td><code>modelo.cluster_centers_</code></td>\n<td><code>km$centers</code></td>\n</tr>\n<tr>\n<td>Etiquetas</td>\n<td><code>modelo.labels_</code></td>\n<td><code>km$cluster</code></td>\n</tr>\n<tr>\n<td>WSS o SSE</td>\n<td><code>modelo.inertia_</code></td>\n<td><code>km$tot.withinss</code></td>\n</tr>\n<tr>\n<td>Escalar</td>\n<td><code>scale(X)</code> de <code>sklearn.preprocessing</code></td>\n<td><code>scale(X)</code></td>\n</tr>\n<tr>\n<td>K-Medoides</td>\n<td><code>kmedoids.fasterpam(D, K)</code></td>\n<td><code>pam(X, k=K)</code></td>\n</tr>\n<tr>\n<td>Distancia de Gower</td>\n<td><code>gower.gower_matrix(X)</code></td>\n<td><code>daisy(X, metric=\"gower\")</code></td>\n</tr>\n<tr>\n<td>Matriz de distancias</td>\n<td><code>distance_matrix(X, X)</code></td>\n<td><code>dist(X)</code></td>\n</tr>\n<tr>\n<td>Jerárquico, etiquetas</td>\n<td><code>AgglomerativeClustering(n_clusters=K, linkage=...)</code></td>\n<td><code>cutree(hclust(d, method=...), k=K)</code></td>\n</tr>\n<tr>\n<td>Jerárquico, árbol</td>\n<td><code>linkage(X, method=...)</code> de scipy</td>\n<td><code>hclust(dist(X), method=...)</code></td>\n</tr>\n<tr>\n<td>Dendrograma</td>\n<td><code>dendrogram(arbol)</code></td>\n<td><code>plot(hc)</code></td>\n</tr>\n<tr>\n<td>Cortar el árbol</td>\n<td><code>fcluster(arbol, t=K, criterion='maxclust')</code></td>\n<td><code>cutree(hc, k=K)</code></td>\n</tr>\n<tr>\n<td>DBSCAN</td>\n<td><code>DBSCAN(eps=..., min_samples=...).fit(X)</code></td>\n<td><code>dbscan(X, eps=..., minPts=...)</code></td>\n</tr>\n<tr>\n<td>Etiqueta de ruido</td>\n<td><code>-1</code></td>\n<td><code>0</code></td>\n</tr>\n<tr>\n<td>Distancia al k vecino</td>\n<td><code>NearestNeighbors(n_neighbors=k)</code></td>\n<td><code>kNNdistplot(X, k=k)</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Métricas de clustering</h2>\n<table>\n<thead>\n<tr>\n<th>Métrica</th>\n<th>Python</th>\n<th>R</th>\n<th>Dirección</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Silhouette</td>\n<td><code>silhouette_score(X, etiquetas)</code></td>\n<td><code>mean(silhouette(cl, dist(X))[,3])</code></td>\n<td>máximo</td>\n</tr>\n<tr>\n<td>Silhouette por punto</td>\n<td><code>silhouette_samples(X, etiquetas)</code></td>\n<td><code>silhouette(cl, d)[,3]</code></td>\n<td></td>\n</tr>\n<tr>\n<td>Calinski-Harabasz</td>\n<td><code>calinski_harabasz_score(X, etiquetas)</code></td>\n<td><code>cluster.stats(d, cl)$ch</code></td>\n<td>máximo</td>\n</tr>\n<tr>\n<td>Davies-Bouldin</td>\n<td><code>davies_bouldin_score(X, etiquetas)</code></td>\n<td><code>index.DB(X, cl)$DB</code></td>\n<td>mínimo</td>\n</tr>\n</tbody>\n</table>\n<h2>Detección de outliers</h2>\n<table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Python</th>\n<th>R</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Z-Score</td>\n<td><code>stats.zscore(x)</code></td>\n<td><code>scale(x)</code></td>\n</tr>\n<tr>\n<td>Mahalanobis</td>\n<td><code>distance.mahalanobis(x, mu, inv_S)</code></td>\n<td><code>mahalanobis(X, mu, S)</code> devuelve d^2</td>\n</tr>\n<tr>\n<td>Umbral chi cuadrado</td>\n<td><code>chi2.ppf(0.975, df=p)</code></td>\n<td><code>qchisq(0.975, df=p)</code></td>\n</tr>\n<tr>\n<td>LOF</td>\n<td><code>LocalOutlierFactor(n_neighbors=k)</code></td>\n<td><code>lof(X, minPts=k)</code></td>\n</tr>\n<tr>\n<td>Score de LOF</td>\n<td><code>negative_outlier_factor_</code> (negativo es atípico)</td>\n<td><code>lof()</code> directo (mayor a 1 es atípico)</td>\n</tr>\n<tr>\n<td>Isolation Forest</td>\n<td><code>IsolationForest(n_estimators=50)</code></td>\n<td><code>isolation.forest()</code> de isotree</td>\n</tr>\n<tr>\n<td>Predicción</td>\n<td><code>-1</code> outlier, <code>1</code> inlier</td>\n<td>según el paquete</td>\n</tr>\n</tbody>\n</table>\n<h2>Reducción de dimensiones</h2>\n<table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Python</th>\n<th>R</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PCA</td>\n<td><code>PCA().fit_transform(X)</code></td>\n<td><code>princomp(X, scores=T)</code> o <code>prcomp(X, scale.=T)</code></td>\n</tr>\n<tr>\n<td>Eigenvalores</td>\n<td><code>pca.explained_variance_</code></td>\n<td><code>pca$sdev^2</code></td>\n</tr>\n<tr>\n<td>Varianza explicada</td>\n<td><code>pca.explained_variance_ratio_</code></td>\n<td><code>summary(pca)</code></td>\n</tr>\n<tr>\n<td>Cargas</td>\n<td><code>pca.components_</code> (fila por componente)</td>\n<td><code>pca$loadings</code> o <code>pr$rotation</code> (columna por componente)</td>\n</tr>\n<tr>\n<td>Scores</td>\n<td><code>pca.transform(X)</code></td>\n<td><code>pca$scores</code> o <code>pr$x</code></td>\n</tr>\n<tr>\n<td>Descomposición espectral</td>\n<td><code>np.linalg.eigh(S)</code></td>\n<td><code>eigen(S)</code></td>\n</tr>\n<tr>\n<td>Biplot</td>\n<td>a mano</td>\n<td><code>biplot(pca)</code></td>\n</tr>\n<tr>\n<td>MDS clásico</td>\n<td><code>MDS(dissimilarity='precomputed')</code></td>\n<td><code>cmdscale(D, k=2, eig=T)</code></td>\n</tr>\n<tr>\n<td>MDS no métrico</td>\n<td><code>MDS(metric=False)</code></td>\n<td><code>isoMDS(D)</code> de MASS</td>\n</tr>\n<tr>\n<td>Análisis factorial</td>\n<td><code>FactorAnalyzer(n_factors=d, rotation='varimax')</code></td>\n<td><code>factanal(X, d)</code></td>\n</tr>\n<tr>\n<td>Unicidades</td>\n<td><code>fa.get_uniquenesses()</code></td>\n<td><code>fa$uniquenesses</code></td>\n</tr>\n<tr>\n<td>Kernel PCA</td>\n<td><code>KernelPCA(kernel='rbf', gamma=...)</code></td>\n<td><code>kpca(~., data, kernel=\"rbfdot\", kpar=list(sigma=...))</code></td>\n</tr>\n<tr>\n<td>SVD</td>\n<td><code>np.linalg.svd(X)</code></td>\n<td><code>svd(X)</code></td>\n</tr>\n<tr>\n<td>Isomap</td>\n<td><code>manifold.Isomap(n_neighbors=k)</code></td>\n<td><code>isomap(dist(X), k=k)</code> de vegan</td>\n</tr>\n<tr>\n<td>t-SNE</td>\n<td><code>manifold.TSNE(perplexity=...)</code></td>\n<td><code>Rtsne(X, perplexity=...)</code></td>\n</tr>\n<tr>\n<td>LLE</td>\n<td><code>manifold.LocallyLinearEmbedding(method=...)</code></td>\n<td><code>lle(X, m=2, k=k)</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Supervisado</h2>\n<table>\n<thead>\n<tr>\n<th>Tarea</th>\n<th>Python</th>\n<th>R</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Partición train y test</td>\n<td><code>train_test_split(X, y, test_size=0.33, random_state=0)</code></td>\n<td><code>sample()</code> más indexado</td>\n</tr>\n<tr>\n<td>K vecinos</td>\n<td><code>KNeighborsRegressor(n_neighbors=k)</code></td>\n<td><code>knn.reg(train, test, y, k)</code> de FNN</td>\n</tr>\n<tr>\n<td>Regresión lineal</td>\n<td><code>LinearRegression().fit(X, y)</code></td>\n<td><code>lm(y ~ ., data)</code></td>\n</tr>\n<tr>\n<td>MSE</td>\n<td><code>np.average(np.square(pred - y))</code></td>\n<td><code>mean((y - pred)^2)</code></td>\n</tr>\n<tr>\n<td>KFold</td>\n<td><code>KFold(n_splits=10)</code></td>\n<td><code>sample(rep(1:K, length.out=n))</code></td>\n</tr>\n<tr>\n<td>Validación cruzada automática</td>\n<td><code>cross_val_score(modelo, X, y, cv=10, scoring=\"neg_mean_squared_error\")</code></td>\n<td><code>cv.glm(datos, modelo, K=10)$delta[1]</code></td>\n</tr>\n<tr>\n<td>Búsqueda de parámetro</td>\n<td><code>GridSearchCV(modelo, rejilla, cv=10)</code></td>\n<td><code>train()</code> de caret</td>\n</tr>\n<tr>\n<td>Forward</td>\n<td><code>SequentialFeatureSelector(direction='forward')</code></td>\n<td><code>regsubsets(..., method=\"forward\")</code></td>\n</tr>\n<tr>\n<td>Exhaustivo</td>\n<td><code>ExhaustiveFeatureSelector()</code> de mlxtend</td>\n<td><code>regsubsets(..., method=\"exhaustive\")</code></td>\n</tr>\n<tr>\n<td>Cp, BIC, R2 ajustado</td>\n<td>a mano o con statsmodels</td>\n<td><code>summary(subs)$cp</code>, <code>$bic</code>, <code>$adjr2</code></td>\n</tr>\n<tr>\n<td>AIC y BIC</td>\n<td><code>modelo.aic</code>, <code>modelo.bic</code> de statsmodels</td>\n<td><code>AIC(lm1)</code>, <code>BIC(lm1)</code></td>\n</tr>\n<tr>\n<td>Ridge</td>\n<td><code>RidgeCV(alphas=...)</code></td>\n<td><code>cv.glmnet(X, y, alpha=0)</code></td>\n</tr>\n<tr>\n<td>LASSO</td>\n<td><code>LassoCV(alphas=...)</code></td>\n<td><code>cv.glmnet(X, y, alpha=1)</code></td>\n</tr>\n<tr>\n<td>Elastic Net</td>\n<td><code>ElasticNetCV(alphas=..., l1_ratio=...)</code></td>\n<td><code>cv.glmnet(X, y, alpha=0.3)</code></td>\n</tr>\n<tr>\n<td>Lambda escogido</td>\n<td><code>modelo.alpha_</code></td>\n<td><code>cvmod$lambda.min</code></td>\n</tr>\n<tr>\n<td>Coeficientes</td>\n<td><code>modelo.coef_</code></td>\n<td><code>coef(modelo)</code></td>\n</tr>\n<tr>\n<td>Matriz de diseño</td>\n<td>ya es matriz</td>\n<td><code>model.matrix(y ~ ., datos)[,-1]</code></td>\n</tr>\n</tbody>\n</table>\n<h2>Cosas que se olvidan en el parcial</h2>\n<ol>\n<li><strong>Escalar antes</strong> de K-Means, jerárquico, DBSCAN, PCA y cualquier penalización.</li>\n<li>En DBSCAN el ruido es <code>-1</code> en Python y <code>0</code> en R.</li>\n<li><code>negative_outlier_factor_</code> de LOF está <strong>negado</strong>: mientras más negativo, más atípico.</li>\n<li><code>cross_val_score</code> devuelve el MSE con <strong>signo negativo</strong> (<code>neg_mean_squared_error</code>).</li>\n<li><code>glmnet</code> no acepta data frames: hay que pasar por <code>model.matrix(...)[,-1]</code>.</li>\n<li>En <code>regsubsets</code> hay que correr <code>na.omit()</code> antes.</li>\n<li><code>pca.components_</code> de sklearn tiene una <strong>fila</strong> por componente y <code>pr$rotation</code> de R tiene una\n   <strong>columna</strong> por componente. Están transpuestas entre sí.</li>\n<li>En k vecinos y en kernel regression el parámetro es <strong>inversamente</strong> proporcional a la\n   flexibilidad: k grande o h grande significa un modelo menos flexible.</li>\n<li>El MSE de <strong>train</strong> no sirve para calibrar, porque siempre baja con la flexibilidad.</li>\n<li><code>mahalanobis()</code> de R ya devuelve la distancia <strong>al cuadrado</strong>.</li>\n</ol>"}</script>
<script>
(function(){
"use strict";

var BASE = JSON.parse(document.getElementById("datos").textContent);
var TEMAS = BASE.temas;
var CHEAT = BASE.cheat;

// tema extra: referencia rapida
TEMAS.push({
  num:"20", slug:"referencia", parte:"Referencia", titulo:"Referencia rápida R contra Python",
  resumen:"Tabla de funciones equivalentes y errores típicos.",
  clases:"Todas", teoria:CHEAT, relacion:"", python:[], r:[],
  busqueda:sinTildes("referencia rapida cheatsheet equivalencias tabla "+CHEAT)
});

function sinTildes(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

var PY_KW = new Set(("False None True and as assert async await break class continue def del elif else "+
  "except finally for from global if import in is lambda nonlocal not or pass raise return try while "+
  "with yield print self").split(" "));
var R_KW = new Set(("if else repeat while function for in next break TRUE FALSE NULL Inf NaN NA "+
  "NA_integer_ NA_real_ NA_character_ library require return T F").split(" "));

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function resaltar(codigo, lenguaje){
  var patron = lenguaje === "py"
    ? /("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|#[^\n]*|\b\d+\.?\d*(?:[eE][-+]?\d+)?\b|[A-Za-z_][A-Za-z_0-9]*)/g
    : /("(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|#[^\n]*|\b\d+\.?\d*(?:[eE][-+]?\d+)?\b|[A-Za-z_.][A-Za-z_0-9._]*)/g;
  var salida = "", ultimo = 0, m, claves = (lenguaje === "py" ? PY_KW : R_KW);
  while ((m = patron.exec(codigo)) !== null){
    salida += esc(codigo.slice(ultimo, m.index));
    var tok = m[0], clase = "";
    if (tok.charAt(0) === "#") clase = "cm";
    else if (tok.charAt(0) === '"' || tok.charAt(0) === "'") clase = "st";
    else if (/^[0-9]/.test(tok)) clase = "nm";
    else if (claves.has(tok)) clase = "kw";
    else if (codigo.charAt(m.index + tok.length) === "(") clase = "fn";
    salida += clase ? '<span class="'+clase+'">'+esc(tok)+"</span>" : esc(tok);
    ultimo = m.index + tok.length;
  }
  salida += esc(codigo.slice(ultimo));
  return salida;
}

// ---------------------------------------------------------- rail
var rail = document.getElementById("rail");
var enlaces = [];
var parteActual = null;

TEMAS.forEach(function(t, i){
  if (t.parte !== parteActual){
    parteActual = t.parte;
    var g = document.createElement("div");
    g.className = "grupo-titulo";
    g.textContent = t.parte;
    rail.appendChild(g);
  }
  var a = document.createElement("a");
  a.href = "#" + t.slug;
  a.dataset.indice = i;
  a.innerHTML = '<span class="n">'+ (t.num === "20" ? "&#9733;" : t.num) +
                '</span><span class="t">'+ esc(t.titulo) +"</span>";
  a.addEventListener("click", function(e){
    e.preventDefault();
    mostrar(i);
    if (window.innerWidth <= 900) cerrarMenu();
  });
  rail.appendChild(a);
  enlaces.push(a);
});

var vacio = document.createElement("p");
vacio.className = "sin-resultados";
vacio.textContent = "Ningún tema coincide con la búsqueda.";
vacio.hidden = true;
rail.appendChild(vacio);

// ---------------------------------------------------------- paneles
var panelTeoria = document.getElementById("panel-teoria");
var panelPy = document.getElementById("panel-py");
var panelR = document.getElementById("panel-r");
var tabs = {
  teoria: document.getElementById("tab-teoria"),
  py: document.getElementById("tab-py"),
  r: document.getElementById("tab-r")
};
var paneles = { teoria: panelTeoria, py: panelPy, r: panelR };
var actual = 0;
var pestanaActual = "teoria";

function bloquesHTML(bloques, lenguaje){
  if (!bloques.length){
    return '<p class="aviso">Este tema no tiene código en ' +
           (lenguaje === "py" ? "Python" : "R") + " en este repositorio.</p>";
  }
  return bloques.map(function(b, k){
    var delCurso = b.origen.indexOf("Del curso") === 0;
    return '<article class="bloque">' +
      "<header>" +
        '<h3 class="bloque-titulo">' + esc(b.titulo) + "</h3>" +
        '<span class="origen ' + (delCurso ? "curso" : "agregado") + '">' + esc(b.origen) + "</span>" +
        '<button class="copiar" data-lang="' + lenguaje + '" data-k="' + k + '">Copiar</button>' +
      "</header>" +
      "<pre><code>" + resaltar(b.code, lenguaje) + "</code></pre>" +
    "</article>";
  }).join("");
}

function mostrar(i){
  actual = i;
  var t = TEMAS[i];

  document.getElementById("ejeParte").textContent = t.parte;
  document.getElementById("ejeClases").textContent = t.clases;
  document.getElementById("tituloNum").textContent = (t.num === "20" ? "" : t.num + ".");
  document.getElementById("tituloTexto").textContent = t.titulo;
  document.getElementById("tituloResumen").textContent = t.resumen;

  panelTeoria.innerHTML =
    '<div class="prosa">' + t.teoria + "</div>" +
    (t.relacion
      ? '<hr class="divisor"><div class="rotulo-seccion">Cómo se relaciona el código con el tema</div>' +
        '<div class="prosa">' + t.relacion + "</div>"
      : "");

  panelPy.innerHTML = bloquesHTML(t.python, "py");
  panelR.innerHTML = bloquesHTML(t.r, "r");

  document.getElementById("cuentaPy").textContent = t.python.length || "";
  document.getElementById("cuentaR").textContent = t.r.length || "";
  tabs.py.hidden = (t.num === "20");
  tabs.r.hidden = (t.num === "20");

  enlaces.forEach(function(a, k){ a.classList.toggle("activo", k === i); });

  if (t.num === "20") cambiarPestana("teoria");
  else cambiarPestana(pestanaActual);

  if (history.replaceState) history.replaceState(null, "", "#" + t.slug);
  window.scrollTo(0, 0);
}

function cambiarPestana(nombre){
  if (TEMAS[actual].num === "20") nombre = "teoria";
  pestanaActual = nombre;
  Object.keys(paneles).forEach(function(k){
    paneles[k].hidden = (k !== nombre);
    tabs[k].setAttribute("aria-selected", k === nombre ? "true" : "false");
  });
}

Object.keys(tabs).forEach(function(k){
  tabs[k].addEventListener("click", function(){ cambiarPestana(k); });
});

// ---------------------------------------------------------- copiar
document.addEventListener("click", function(e){
  var boton = e.target.closest(".copiar");
  if (!boton) return;
  var t = TEMAS[actual];
  var lista = boton.dataset.lang === "py" ? t.python : t.r;
  var texto = lista[parseInt(boton.dataset.k, 10)].code;

  function exito(){
    boton.textContent = "Copiado";
    boton.classList.add("listo");
    setTimeout(function(){ boton.textContent = "Copiar"; boton.classList.remove("listo"); }, 1400);
  }

  if (navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texto).then(exito, respaldo);
  } else {
    respaldo();
  }

  function respaldo(){
    var area = document.createElement("textarea");
    area.value = texto;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try { document.execCommand("copy"); exito(); } catch (err) { boton.textContent = "Usa Ctrl+C"; }
    document.body.removeChild(area);
  }
});

// ---------------------------------------------------------- busqueda
var entrada = document.getElementById("busqueda");

entrada.addEventListener("input", function(){
  var q = sinTildes(entrada.value.trim());
  var visibles = 0;
  enlaces.forEach(function(a, k){
    var coincide = !q || TEMAS[k].busqueda.indexOf(q) !== -1;
    a.classList.toggle("oculto", !coincide);
    if (coincide) visibles++;
  });
  vacio.hidden = (visibles > 0);
  rail.querySelectorAll(".grupo-titulo").forEach(function(g){
    var hay = false, n = g.nextElementSibling;
    while (n && n.tagName === "A"){
      if (!n.classList.contains("oculto")) hay = true;
      n = n.nextElementSibling;
    }
    g.style.display = hay ? "" : "none";
  });
});

entrada.addEventListener("keydown", function(e){
  if (e.key === "Escape"){ entrada.value = ""; entrada.dispatchEvent(new Event("input")); entrada.blur(); }
  if (e.key === "Enter"){
    var primero = enlaces.find(function(a){ return !a.classList.contains("oculto"); });
    if (primero){ mostrar(parseInt(primero.dataset.indice, 10)); entrada.blur(); }
  }
});

// ---------------------------------------------------------- teclado
document.addEventListener("keydown", function(e){
  var enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !enCampo){ e.preventDefault(); entrada.focus(); entrada.select(); return; }
  if (enCampo || e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    var disponibles = enlaces.filter(function(a){ return !a.classList.contains("oculto"); });
    if (!disponibles.length) return;
    var pos = disponibles.findIndex(function(a){ return parseInt(a.dataset.indice, 10) === actual; });
    pos = (e.key === "ArrowDown") ? Math.min(pos + 1, disponibles.length - 1) : Math.max(pos - 1, 0);
    if (pos < 0) pos = 0;
    mostrar(parseInt(disponibles[pos].dataset.indice, 10));
  }
  if (e.key === "1") cambiarPestana("teoria");
  if (e.key === "2") cambiarPestana("py");
  if (e.key === "3") cambiarPestana("r");
});

// ---------------------------------------------------------- menu movil
var btnMenu = document.getElementById("btnMenu");
function cerrarMenu(){ rail.classList.remove("abierto"); btnMenu.setAttribute("aria-expanded", "false"); }
btnMenu.addEventListener("click", function(){
  var abierto = rail.classList.toggle("abierto");
  btnMenu.setAttribute("aria-expanded", abierto ? "true" : "false");
});

// ---------------------------------------------------------- inicio
var inicial = 0;
if (location.hash){
  var buscado = location.hash.slice(1);
  TEMAS.forEach(function(t, k){ if (t.slug === buscado) inicial = k; });
}
mostrar(inicial);

})();
</script>
