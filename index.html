os métodos estadísticos funcionan bien para <strong>pocas dimensiones</strong> o datos unidimensionales.\nLa idea general es medir distancias relativas a la dispersión de la muestra, con lo que se\nencuentran datos relativamente altos o bajos.</p>\n<h3>Z-Score (caso unidimensional)</h3>\n<p>Cuando los datos son de una sola variable, o se hace el análisis variable por variable:</p>\n<pre><code>             x_i - xbar\nZ(x_i) = -----------------\n          sd(x_1, ..., x_n)\n</code></pre>\n<p>Regla práctica: |Z| &gt; 3 marca un candidato a outlier bajo normalidad aproximada.</p>\n<p><strong>Limitación importante.</strong> El Z-Score usa la media y la desviación muestrales, que a su vez están\ncontaminadas por el outlier. Un punto muy extremo infla <code>sd</code> y se esconde a si mismo. Esto se llama\nefecto de enmascaramiento (masking).</p>\n<p><strong>Limitación mayor.</strong> Aplicado variable por variable, el Z-Score no detecta outliers\n<strong>multivariados</strong>: un punto puede tener valores normales en cada variable por separado y aun así\nser imposible dada la correlación entre ellas.</p>\n<h3>Distancia de Mahalanobis (caso multivariado)</h3>\n<p>Corrige el problema anterior porque incorpora la matriz de covarianza:</p>\n<pre><code>d_M(x)^2 = (x - mu)^T * S^{-1} * (x - mu)\n</code></pre>\n<p>Interpretación: es la distancia euclidiana después de blanquear los datos, es decir, después de\nquitarles la correlación y estandarizar cada dirección. Los contornos de igual distancia son las\nelipses de la distribución, no círculos.</p>\n<p>Bajo normalidad multivariada, d_M^2 se distribuye aproximadamente <strong>chi cuadrado con p grados de\nlibertad</strong>. Eso da un umbral formal: un punto es atípico si d_M^2 supera el cuantil 0.975 de una\nchi cuadrado con p grados de libertad.</p>\n<h3>Por qué se pasa a métodos locales</h3>\n<p>Ambos métodos asumen <strong>una sola nube de datos</strong> con un centro. Si los datos tienen varios grupos\no densidades distintas, fallan. Ese es el motivo para pasar a LOF e Isolation Forest (tema 08).</p>", "relacion": "<p>El notebook hace tres cosas en orden:</p>\n<ol>\n<li><strong>Simula datos normales limpios</strong> y gráfica el histograma contra la densidad teórica.</li>\n<li><strong>Contamina la muestra a mano</strong>: <code>samples[n-1] = 12.3</code>. Ese es el outlier inyectado.</li>\n<li><strong>Calcula el Z-Score</strong> con <code>stats.zscore(samples)</code> de scipy y lo gráfica. El pico del gráfico\n   es el punto contaminado.</li>\n</ol>\n<p>Para Mahalanobis el notebook hace <strong>dos versiones equivalentes</strong>:</p>\n<ul>\n<li>Versión con scipy: <code>distance.mahalanobis(x, mean2, inv_cov)</code> dentro de una lista por comprensión,\n  punto por punto.</li>\n<li>Versión matricial: <code>left = (x - mean2).T @ inv_cov</code> y luego <code>mahal = left @ (x - mean2)</code>. Como\n  esto produce una matriz n por n, la respuesta está en <code>mahal.diagonal()</code>, porque solo interesa\n  el producto de cada punto consigo mismo.</li>\n</ul>\n<p>Cuidado con la orientación de la matriz en ese bloque: el código genera <code>x</code> con <code>.T</code> al final, así\nque <code>x</code> queda de 2 por n. Al calcular medias y covarianza hay que ser consistente con el eje. En el\ncódigo de abajo se incluye una versión limpia con las dimensiones ordenadas.</p>", "python": [{"titulo": "Z-Score sobre una muestra contaminada", "origen": "Del curso, class5_book1_outlier.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nrng = np.random.default_rng()\n\nmean = 5.0\nstd_dev = 1.5\nn = 80\n\nsamples = rng.normal(loc=mean, scale=std_dev, size=n)\n\ncount, bins, ignored = plt.hist(samples, 10, density=True)\nplt.plot(bins, 1/(std_dev * np.sqrt(2 * np.pi)) *\n         np.exp(-(bins - mean)**2 / (2 * std_dev**2)),\n         linewidth=2, color='r')\nplt.show()\n\n# Se contamina la muestra con un valor extremo\nsamples[n-1] = 12.3\n\ncount, bins, ignored = plt.hist(samples, 10, density=True)\nplt.plot(bins, 1/(std_dev * np.sqrt(2 * np.pi)) *\n         np.exp(-(bins - mean)**2 / (2 * std_dev**2)),\n         linewidth=2, color='r')\nplt.show()\n\n# Z-Score\nz_scores = stats.zscore(samples)\nprint(z_scores)\n\nplt.plot(z_scores, linewidth=2, color='r')\n\n# Regla práctica\nprint(\"Outliers con |Z| > 3:\", np.where(np.abs(z_scores) > 3)[0])"}, {"titulo": "Distancia de Mahalanobis", "origen": "Del curso, class5_book1_outlier.ipynb", "code": "from scipy.spatial import distance\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nmean = [2, 3]\ncov = [[3, 1.5], [1.5, 4]]\nn = 200\n\nx = np.random.multivariate_normal(mean, cov, n).T\n\nplt.plot(x[0, :], x[1, :], 'x')\nplt.axis('equal')\nplt.show()\n\nmean2 = np.mean(x, axis=0)\n\ncov_matrix = np.cov(x.T, rowvar=False)\ninv_cov = np.linalg.inv(cov_matrix)\n\ndistances = [distance.mahalanobis(x, mean2, inv_cov) for x in x]\n\n# Versión matricial: la respuesta está en la diagonal\nleft = np.dot((x-mean2).T, inv_cov)\nmahal = np.dot(left, (x-mean2))\nmahal.diagonal()"}, {"titulo": "Mahalanobis con umbral chi cuadrado (versión ordenada)", "origen": "Equivalente agregado, no viene del material del curso", "code": "import numpy as np\nfrom scipy.stats import chi2\n\n# Datos con forma n x p (cada FILA una observación)\nn = 200\np = 2\nX = np.random.multivariate_normal([2, 3], [[3, 1.5], [1.5, 4]], n)\n\nmedia = np.mean(X, axis=0)\nS = np.cov(X, rowvar=False)\nS_inv = np.linalg.inv(S)\n\ncentrado = X - media\nd2 = np.sum(centrado @ S_inv * centrado, axis=1)   # d_M^2 de cada punto\n\n# Umbral: cuantil 0.975 de una chi cuadrado con p grados de libertad\numbral = chi2.ppf(0.975, df=p)\noutliers = np.where(d2 > umbral)[0]\n\nprint(\"Umbral chi2:\", round(umbral, 3))\nprint(\"Índices atípicos:\", outliers)\n\nimport matplotlib.pyplot as plt\nplt.scatter(X[:, 0], X[:, 1], c=(d2 > umbral), cmap='coolwarm')\nplt.title(\"Outliers por distancia de Mahalanobis\")\nplt.show()"}], "r": [{"titulo": "Z-Score y Mahalanobis en R", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Z-Score\nset.seed(1)\nn <- 80\nmuestra <- rnorm(n, mean = 5, sd = 1.5)\nmuestra[n] <- 12.3          # contaminación\n\nz <- scale(muestra)          # equivale a (x - mean)/sd\nplot(z, type = \"l\", col = \"red\", lwd = 2)\nwhich(abs(z) > 3)\n\n\n# Mahalanobis\nX <- as.matrix(iris[, 1:4])\n\nmedias <- colMeans(X)\nS <- var(X)\n\nd2 <- mahalanobis(X, center = medias, cov = S)   # devuelve d^2 directamente\n\np <- ncol(X)\numbral <- qchisq(0.975, df = p)\n\nwhich(d2 > umbral)\n\nplot(d2, pch = 16, col = ifelse(d2 > umbral, \"red\", \"black\"))\nabline(h = umbral, col = \"blue\", lty = 2)\n\n# QQ-plot contra la chi cuadrado\nqqplot(qchisq(ppoints(nrow(X)), df = p), d2,\n       xlab = \"Cuantiles chi2\", ylab = \"Distancia de Mahalanobis al cuadrado\")\nabline(0, 1, col = \"red\")\n\n\n# Versión robusta (MCD), no se enmascara con los propios outliers\nlibrary(MASS)\nrob <- cov.rob(X, method = \"mcd\")\nd2_rob <- mahalanobis(X, center = rob$center, cov = rob$cov)\nwhich(d2_rob > umbral)"}], "busqueda": "07 outliers: z-score y mahalanobis metodos estadisticos, una variable y el caso multivariado. outliers clase 5  cuando sirven \n los metodos estadisticos funcionan bien para  pocas dimensiones  o datos unidimensionales.\nla idea general es medir distancias relativas a la dispersion de la muestra, con lo que se\nencuentran datos relativamente altos o bajos. \n z-score (caso unidimensional) \n cuando los datos son de una sola variable, o se hace el analisis variable por variable: \n               x_i - xbar\nz(x_i) = -----------------\n          sd(x_1, ..., x_n)\n  \n regla practica: |z| &gt; 3 marca un candidato a outlier bajo normalidad aproximada. \n  limitacion importante.  el z-score usa la media y la desviacion muestrales, que a su vez estan\ncontaminadas por el outlier. un punto muy extremo infla  sd  y se esconde a si mismo. esto se llama\nefecto de enmascaramiento (masking). \n  limitacion mayor.  aplicado variable por variable, el z-score no detecta outliers\n multivariados : un punto puede tener valores normales en cada variable por separado y aun asi\nser imposible dada la correlacion entre ellas. \n distancia de mahalanobis (caso multivariado) \n corrige el problema anterior porque incorpora la matriz de covarianza: \n  d_m(x)^2 = (x - mu)^t * s^{-1} * (x - mu)\n  \n interpretacion: es la distancia euclidiana despues de blanquear los datos, es decir, despues de\nquitarles la correlacion y estandarizar cada direccion. los contornos de igual distancia son las\nelipses de la distribucion, no circulos. \n bajo normalidad multivariada, d_m^2 se distribuye aproximadamente  chi cuadrado con p grados de\nlibertad . eso da un umbral formal: un punto es atipico si d_m^2 supera el cuantil 0.975 de una\nchi cuadrado con p grados de libertad. \n por que se pasa a metodos locales \n ambos metodos asumen  una sola nube de datos  con un centro. si los datos tienen varios grupos\no densidades distintas, fallan. ese es el motivo para pasar a lof e isolation forest (tema 08).  z-score sobre una muestra contaminada import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nrng = np.random.default_rng()\n\nmean = 5.0\nstd_dev = 1.5\nn = 80\n\nsamples = rng.normal(loc=mean, scale=std_dev, size=n)\n\ncount, bins, ignored = plt.hist(samples, 10, density=true)\nplt.plot(bins, 1/(std_dev * np.sqrt(2 * np.pi)) *\n         np.exp(-(bins - mean)**2 / (2 * std_dev**2)),\n         linewidth=2, color='r')\nplt.show()\n\n# se contamina la muestra con un valor extremo\nsamples[n-1] = 12.3\n\ncount, bins, ignored = plt.hist(samples, 10, density=true)\nplt.plot(bins, 1/(std_dev * np.sqrt(2 * np.pi)) *\n         np.exp(-(bins - mean)**2 / (2 * std_dev**2)),\n         linewidth=2, color='r')\nplt.show()\n\n# z-score\nz_scores = stats.zscore(samples)\nprint(z_scores)\n\nplt.plot(z_scores, linewidth=2, color='r')\n\n# regla practica\nprint(\"outliers con |z| > 3:\", np.where(np.abs(z_scores) > 3)[0]) distancia de mahalanobis from scipy.spatial import distance\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nmean = [2, 3]\ncov = [[3, 1.5], [1.5, 4]]\nn = 200\n\nx = np.random.multivariate_normal(mean, cov, n).t\n\nplt.plot(x[0, :], x[1, :], 'x')\nplt.axis('equal')\nplt.show()\n\nmean2 = np.mean(x, axis=0)\n\ncov_matrix = np.cov(x.t, rowvar=false)\ninv_cov = np.linalg.inv(cov_matrix)\n\ndistances = [distance.mahalanobis(x, mean2, inv_cov) for x in x]\n\n# version matricial: la respuesta esta en la diagonal\nleft = np.dot((x-mean2).t, inv_cov)\nmahal = np.dot(left, (x-mean2))\nmahal.diagonal() mahalanobis con umbral chi cuadrado (version ordenada) import numpy as np\nfrom scipy.stats import chi2\n\n# datos con forma n x p (cada fila una observacion)\nn = 200\np = 2\nx = np.random.multivariate_normal([2, 3], [[3, 1.5], [1.5, 4]], n)\n\nmedia = np.mean(x, axis=0)\ns = np.cov(x, rowvar=false)\ns_inv = np.linalg.inv(s)\n\ncentrado = x - media\nd2 = np.sum(centrado @ s_inv * centrado, axis=1)   # d_m^2 de cada punto\n\n# umbral: cuantil 0.975 de una chi cuadrado con p grados de libertad\numbral = chi2.ppf(0.975, df=p)\noutliers = np.where(d2 > umbral)[0]\n\nprint(\"umbral chi2:\", round(umbral, 3))\nprint(\"indices atipicos:\", outliers)\n\nimport matplotlib.pyplot as plt\nplt.scatter(x[:, 0], x[:, 1], c=(d2 > umbral), cmap='coolwarm')\nplt.title(\"outliers por distancia de mahalanobis\")\nplt.show() z-score y mahalanobis en r # z-score\nset.seed(1)\nn <- 80\nmuestra <- rnorm(n, mean = 5, sd = 1.5)\nmuestra[n] <- 12.3          # contaminacion\n\nz <- scale(muestra)          # equivale a (x - mean)/sd\nplot(z, type = \"l\", col = \"red\", lwd = 2)\nwhich(abs(z) > 3)\n\n\n# mahalanobis\nx <- as.matrix(iris[, 1:4])\n\nmedias <- colmeans(x)\ns <- var(x)\n\nd2 <- mahalanobis(x, center = medias, cov = s)   # devuelve d^2 directamente\n\np <- ncol(x)\numbral <- qchisq(0.975, df = p)\n\nwhich(d2 > umbral)\n\nplot(d2, pch = 16, col = ifelse(d2 > umbral, \"red\", \"black\"))\nabline(h = umbral, col = \"blue\", lty = 2)\n\n# qq-plot contra la chi cuadrado\nqqplot(qchisq(ppoints(nrow(x)), df = p), d2,\n       xlab = \"cuantiles chi2\", ylab = \"distancia de mahalanobis al cuadrado\")\nabline(0, 1, col = \"red\")\n\n\n# version robusta (mcd), no se enmascara con los propios outliers\nlibrary(mass)\nrob <- cov.rob(x, method = \"mcd\")\nd2_rob <- mahalanobis(x, center = rob$center, cov = rob$cov)\nwhich(d2_rob > umbral)"}, {"num": "08", "slug": "lof-isolation-forest", "parte": "Outliers", "titulo": "LOF e Isolation Forest", "resumen": "Densidad local relativa y aislamiento por particiones aleatorias.", "clases": "Clase 6", "teoria": "<h3>Local Outlier Factor (LOF)</h3>\n<p>Método basado en <strong>densidades</strong>. La idea fundamental es comparar la densidad local de una\nobservación con las densidades de sus vecinos. Es local: un punto puede ser normal para un grupo\ndenso y atípico para uno disperso.</p>\n<p>Se define la densidad local alcanzable (local reachability density):</p>\n<pre><code>                        k\nlrd_k(x) = ------------------------------\n            sum_{y en N_k(x)}  RD_k(x, y)\n</code></pre>\n<p>donde N_k(x) es el conjunto de los k vecinos más cercanos a x, y RD_k es la distancia de\nalcanzabilidad (reachability distance), que suaviza distancias muy pequeñas.</p>\n<p>El factor LOF es la razón entre la densidad de los vecinos y la densidad propia:</p>\n<pre><code>                1        sum_{y en N_k(x)}  lrd_k(y)\nLOF(x) = ------------- *  ---------------------------\n          k * lrd_k(x)                 1\n</code></pre>\n<p>Interpretación:</p>\n<ul>\n<li><strong>LOF cerca de 1</strong>: el punto tiene densidad parecida a la de sus vecinos. Normal.</li>\n<li><strong>LOF mucho mayor que 1</strong>: la densidad del punto es mucho menor que la de sus vecinos. Outlier.</li>\n<li><strong>LOF menor que 1</strong>: el punto está en una zona más densa que sus vecinos.</li>\n</ul>\n<p>La ventaja frente a Mahalanobis es que <strong>no asume una sola nube</strong>. Detecta outliers locales.</p>\n<h3>Isolation Forest (iForest)</h3>\n<p>Método basado en ML supervisado (árboles). La idea fundamental es hacer particiones del espacio X\n<strong>aleatorias y paralelas a los ejes</strong> hasta aislar alguna observación.</p>\n<p>Razonamiento central: los puntos anómalos son <strong>más fáciles de separar</strong> del resto de la muestra,\nes decir, requieren menos particiones.</p>\n<pre><code>h(x) = número de particiones necesarias para aislar x\n</code></pre>\n<p>Se promedia h(x) sobre muchos árboles y se normaliza en un score:</p>\n<pre><code>s(x, m) cerca de 1    -&gt;  Outlier\ns(x, m) cerca de 0.5  -&gt;  Normal\n</code></pre>\n<p>Ventajas: escala muy bien en n y en p, no necesita calcular distancias, es rápido.</p>\n<h3>Cuándo usar cuál</h3>\n<table>\n<thead>\n<tr>\n<th>Situación</th>\n<th>Método</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Una sola nube, pocas dimensiones</td>\n<td>Mahalanobis</td>\n</tr>\n<tr>\n<td>Varios grupos con densidades distintas</td>\n<td>LOF</td>\n</tr>\n<tr>\n<td>Muchos datos o muchas dimensiones</td>\n<td>Isolation Forest</td>\n</tr>\n</tbody>\n</table>", "relacion": "<h3>LOF</h3>\n<pre><code>lof = LocalOutlierFactor(n_neighbors=5, contamination='auto')\ny_pred = lof.fit_predict(X)\nlofs_scores = lof.negative_outlier_factor_\n</code></pre>\n<p>Tres cosas para no confundir en el parcial:</p>\n<ul>\n<li><code>y_pred</code> devuelve <strong>-1 para outliers y 1 para inliers</strong>.</li>\n<li><code>negative_outlier_factor_</code> es el LOF con <strong>signo cambiado</strong>. Cuanto más negativo, más atípico.\n  Un punto normal da un valor cercano a -1.</li>\n<li><code>n_neighbors</code> es el k de la fórmula. Es el parámetro que define qué tan local es el análisis.</li>\n</ul>\n<p>El gráfico del notebook dibuja círculos cuyo radio es proporcional al score normalizado:\n<code>radius = (max - scores) / (max - min)</code>. A mayor círculo, más atípico el punto.</p>\n<h3>Isolation Forest</h3>\n<pre><code>clf = IsolationForest(n_estimators=50, random_state=0).fit(X)\nclf_scores = clf.decision_function(X)\nclf_labels = clf.predict(X)\n</code></pre>\n<ul>\n<li><code>n_estimators</code> es el número de árboles del bosque.</li>\n<li><code>decision_function(X)</code> da el score: <strong>valores negativos son anómalos</strong>, positivos normales.\n  Ojo, sklearn invierte el signo respecto a la s(x,m) de la teoría.</li>\n<li><code>predict(X)</code> da -1 y 1, igual que LOF.</li>\n<li>A diferencia de LOF, IsolationForest sí se puede ajustar en una muestra y aplicar a otra, porque\n  guarda el modelo. Por eso en el notebook se ajusta con <code>X</code> y se evalúa sobre <code>Xl</code>.</li>\n</ul>", "python": [{"titulo": "Datos simulados con tres grupos más outliers", "origen": "Del curso, class6_book1_outlier_lof.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.neighbors import LocalOutlierFactor\nfrom scipy.linalg import sqrtm\n\nvcov1 = np.array([[2.0, 1.5], [1.5, 4.0]])\nvcov2 = np.array([[2.0, -1.5], [-1.5, 4.0]])\n\nm1 = [-4, -2]\nm2 = [1, -5]\nm3 = [4, 3]\n\nn1 = 50 ; n2 = 80 ; n3 = 60\n\nX1 = m1 + 0.5*np.dot(np.random.randn(n1, 2), sqrtm(vcov1))\nX2 = m2 + 0.3*np.dot(np.random.randn(n2, 2), sqrtm(vcov1))\nX3 = m3 + 0.5*np.dot(np.random.randn(n3, 2), sqrtm(vcov2))\n\nX = np.r_[X1, X2, X3]\nplt.scatter(X[:, 0], X[:, 1])\n\n# Se agregan puntos outliers\nXout = 2.5 * np.random.randn(10, 2)\nX = np.r_[X, Xout]\nplt.scatter(X[:, 0], X[:, 1])"}, {"titulo": "Local Outlier Factor", "origen": "Del curso, class6_book1_outlier_lof.ipynb", "code": "# n_neighbors es el k de la fórmula\nlof = LocalOutlierFactor(n_neighbors=5, contamination='auto')\n\n# -1 para outliers, 1 para inliers\ny_pred = lof.fit_predict(X)\n\n# Puntuaciones de anomalía: cuanto más negativo, más atípico\nlofs_scores = lof.negative_outlier_factor_\n\nprint(\"Predicciones (1 = normal, -1 = atípico):\", y_pred)\nprint(\"Puntuaciones LOF:\", lofs_scores)\n\n\n# Gráfico con círculos proporcionales al score\nfrom matplotlib.legend_handler import HandlerPathCollection\n\ndef update_legend_marker_size(handle, orig):\n    handle.update_from(orig)\n    handle.set_sizes([20])\n\nplt.scatter(X[:, 0], X[:, 1], color=\"k\", s=3.0, label=\"Data points\")\nradius = (lofs_scores.max() - lofs_scores) / (lofs_scores.max() - lofs_scores.min())\nscatter = plt.scatter(\n    X[:, 0], X[:, 1],\n    s=1000 * radius,\n    edgecolors=\"r\",\n    facecolors=\"none\",\n    label=\"Outlier scores\",\n)\nplt.axis(\"tight\")\nplt.xlim((-7.5, 7.5))\nplt.ylim((-7.5, 7.5))\nplt.legend(handler_map={scatter: HandlerPathCollection(update_func=update_legend_marker_size)})\nplt.title(\"Local Outlier Factor (LOF)\")\nplt.show()"}, {"titulo": "Isolation Forest", "origen": "Del curso, class6_book1_outlier_lof.ipynb", "code": "from sklearn.ensemble import IsolationForest\n\nclf = IsolationForest(n_estimators=50, random_state=0).fit(X)\n\nclf_scores = clf.decision_function(X)   # negativo = anómalo\nclf_labels = clf.predict(X)             # -1 outlier, 1 inlier\n\nclf.decision_function(X)\n\nplt.scatter(X[:, 0], X[:, 1], c=clf_labels)\n\n\n# Datos reales: aplicar el modelo a otra base\n#!pip install -U ucimlrepo\nfrom ucimlrepo import fetch_ucirepo\n\nlymphography = fetch_ucirepo(id=63)\nXl = lymphography.data.features\nyl = lymphography.data.targets\n\nclfl = IsolationForest(n_estimators=50, random_state=0).fit(Xl)\nclfl_scores = clf.decision_function(Xl)\nclfl_scores"}], "r": [{"titulo": "LOF e Isolation Forest en R", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Local Outlier Factor\nlibrary(dbscan)\n\nX <- as.matrix(iris[, 1:4])\n\n# k es el número de vecinos. Devuelve el LOF directo (no negado como en sklearn)\npuntajes_lof <- lof(X, minPts = 5)\n\n# LOF cerca de 1 = normal. LOF muy mayor que 1 = outlier\nsummary(puntajes_lof)\nwhich(puntajes_lof > 1.5)\n\nplot(X[, 3], X[, 4], pch = 16,\n     cex = puntajes_lof,          # tamaño proporcional al LOF\n     col = ifelse(puntajes_lof > 1.5, \"red\", \"black\"))\n\n\n# Isolation Forest\nlibrary(isotree)\n\nmodelo_if <- isolation.forest(as.data.frame(X), ntrees = 50, nthreads = 1)\n\n# En isotree el score va de 0 a 1: cerca de 1 es outlier\npuntajes_if <- predict(modelo_if, as.data.frame(X))\n\nsummary(puntajes_if)\nwhich(puntajes_if > 0.6)\n\nplot(X[, 3], X[, 4], pch = 16,\n     col = ifelse(puntajes_if > 0.6, \"red\", \"black\"))\n\n\n# Alternativa con solitude\n# library(solitude)\n# iso <- isolationForest$new(num_trees = 50)\n# iso$fit(as.data.frame(X))\n# pred <- iso$predict(as.data.frame(X))\n# pred$anomaly_score"}], "busqueda": "08 lof e isolation forest densidad local relativa y aislamiento por particiones aleatorias. outliers clase 6  local outlier factor (lof) \n metodo basado en  densidades . la idea fundamental es comparar la densidad local de una\nobservacion con las densidades de sus vecinos. es local: un punto puede ser normal para un grupo\ndenso y atipico para uno disperso. \n se define la densidad local alcanzable (local reachability density): \n                          k\nlrd_k(x) = ------------------------------\n            sum_{y en n_k(x)}  rd_k(x, y)\n  \n donde n_k(x) es el conjunto de los k vecinos mas cercanos a x, y rd_k es la distancia de\nalcanzabilidad (reachability distance), que suaviza distancias muy pequenas. \n el factor lof es la razon entre la densidad de los vecinos y la densidad propia: \n                  1        sum_{y en n_k(x)}  lrd_k(y)\nlof(x) = ------------- *  ---------------------------\n          k * lrd_k(x)                 1\n  \n interpretacion: \n \n  lof cerca de 1 : el punto tiene densidad parecida a la de sus vecinos. normal. \n  lof mucho mayor que 1 : la densidad del punto es mucho menor que la de sus vecinos. outlier. \n  lof menor que 1 : el punto esta en una zona mas densa que sus vecinos. \n \n la ventaja frente a mahalanobis es que  no asume una sola nube . detecta outliers locales. \n isolation forest (iforest) \n metodo basado en ml supervisado (arboles). la idea fundamental es hacer particiones del espacio x\n aleatorias y paralelas a los ejes  hasta aislar alguna observacion. \n razonamiento central: los puntos anomalos son  mas faciles de separar  del resto de la muestra,\nes decir, requieren menos particiones. \n  h(x) = numero de particiones necesarias para aislar x\n  \n se promedia h(x) sobre muchos arboles y se normaliza en un score: \n  s(x, m) cerca de 1    -&gt;  outlier\ns(x, m) cerca de 0.5  -&gt;  normal\n  \n ventajas: escala muy bien en n y en p, no necesita calcular distancias, es rapido. \n cuando usar cual \n \n \n \n situacion \n metodo \n \n \n \n \n una sola nube, pocas dimensiones \n mahalanobis \n \n \n varios grupos con densidades distintas \n lof \n \n \n muchos datos o muchas dimensiones \n isolation forest \n \n \n  datos simulados con tres grupos mas outliers import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.neighbors import localoutlierfactor\nfrom scipy.linalg import sqrtm\n\nvcov1 = np.array([[2.0, 1.5], [1.5, 4.0]])\nvcov2 = np.array([[2.0, -1.5], [-1.5, 4.0]])\n\nm1 = [-4, -2]\nm2 = [1, -5]\nm3 = [4, 3]\n\nn1 = 50 ; n2 = 80 ; n3 = 60\n\nx1 = m1 + 0.5*np.dot(np.random.randn(n1, 2), sqrtm(vcov1))\nx2 = m2 + 0.3*np.dot(np.random.randn(n2, 2), sqrtm(vcov1))\nx3 = m3 + 0.5*np.dot(np.random.randn(n3, 2), sqrtm(vcov2))\n\nx = np.r_[x1, x2, x3]\nplt.scatter(x[:, 0], x[:, 1])\n\n# se agregan puntos outliers\nxout = 2.5 * np.random.randn(10, 2)\nx = np.r_[x, xout]\nplt.scatter(x[:, 0], x[:, 1]) local outlier factor # n_neighbors es el k de la formula\nlof = localoutlierfactor(n_neighbors=5, contamination='auto')\n\n# -1 para outliers, 1 para inliers\ny_pred = lof.fit_predict(x)\n\n# puntuaciones de anomalia: cuanto mas negativo, mas atipico\nlofs_scores = lof.negative_outlier_factor_\n\nprint(\"predicciones (1 = normal, -1 = atipico):\", y_pred)\nprint(\"puntuaciones lof:\", lofs_scores)\n\n\n# grafico con circulos proporcionales al score\nfrom matplotlib.legend_handler import handlerpathcollection\n\ndef update_legend_marker_size(handle, orig):\n    handle.update_from(orig)\n    handle.set_sizes([20])\n\nplt.scatter(x[:, 0], x[:, 1], color=\"k\", s=3.0, label=\"data points\")\nradius = (lofs_scores.max() - lofs_scores) / (lofs_scores.max() - lofs_scores.min())\nscatter = plt.scatter(\n    x[:, 0], x[:, 1],\n    s=1000 * radius,\n    edgecolors=\"r\",\n    facecolors=\"none\",\n    label=\"outlier scores\",\n)\nplt.axis(\"tight\")\nplt.xlim((-7.5, 7.5))\nplt.ylim((-7.5, 7.5))\nplt.legend(handler_map={scatter: handlerpathcollection(update_func=update_legend_marker_size)})\nplt.title(\"local outlier factor (lof)\")\nplt.show() isolation forest from sklearn.ensemble import isolationforest\n\nclf = isolationforest(n_estimators=50, random_state=0).fit(x)\n\nclf_scores = clf.decision_function(x)   # negativo = anomalo\nclf_labels = clf.predict(x)             # -1 outlier, 1 inlier\n\nclf.decision_function(x)\n\nplt.scatter(x[:, 0], x[:, 1], c=clf_labels)\n\n\n# datos reales: aplicar el modelo a otra base\n#!pip install -u ucimlrepo\nfrom ucimlrepo import fetch_ucirepo\n\nlymphography = fetch_ucirepo(id=63)\nxl = lymphography.data.features\nyl = lymphography.data.targets\n\nclfl = isolationforest(n_estimators=50, random_state=0).fit(xl)\nclfl_scores = clf.decision_function(xl)\nclfl_scores lof e isolation forest en r # local outlier factor\nlibrary(dbscan)\n\nx <- as.matrix(iris[, 1:4])\n\n# k es el numero de vecinos. devuelve el lof directo (no negado como en sklearn)\npuntajes_lof <- lof(x, minpts = 5)\n\n# lof cerca de 1 = normal. lof muy mayor que 1 = outlier\nsummary(puntajes_lof)\nwhich(puntajes_lof > 1.5)\n\nplot(x[, 3], x[, 4], pch = 16,\n     cex = puntajes_lof,          # tamano proporcional al lof\n     col = ifelse(puntajes_lof > 1.5, \"red\", \"black\"))\n\n\n# isolation forest\nlibrary(isotree)\n\nmodelo_if <- isolation.forest(as.data.frame(x), ntrees = 50, nthreads = 1)\n\n# en isotree el score va de 0 a 1: cerca de 1 es outlier\npuntajes_if <- predict(modelo_if, as.data.frame(x))\n\nsummary(puntajes_if)\nwhich(puntajes_if > 0.6)\n\nplot(x[, 3], x[, 4], pch = 16,\n     col = ifelse(puntajes_if > 0.6, \"red\", \"black\"))\n\n\n# alternativa con solitude\n# library(solitude)\n# iso <- isolationforest$new(num_trees = 50)\n# iso$fit(as.data.frame(x))\n# pred <- iso$predict(as.data.frame(x))\n# pred$anomaly_score"}, {"num": "09", "slug": "pca", "parte": "Reducción de dimensiones", "titulo": "PCA (componentes principales)", "resumen": "Descomposición espectral, scores, varianza explicada, biplot, gráfico de codo.", "clases": "Clase 6, Clase 7, Clase 8", "teoria": "<h3>El problema general de reducción de dimensiones</h3>\n<pre><code>Input :  matriz X de n x p.  Se observan p variables X1, ..., Xp\nOutput:  matriz Z de n x d con d &lt; p.  Se representan los datos en d variables Z1, ..., Zd\n</code></pre>\n<p>El criterio de \"mejor representación posible\" del curso es <strong>conservar las relaciones entre los\npuntos</strong>, es decir, las distancias:</p>\n<pre><code>Dist(x_i, x_j)  aprox  Dist(z_i, z_j)   para todo i, j\n</code></pre>\n<p>Por qué se usa: entender mejor los datos en grandes dimensiones (feature extraction, variables\nlatentes, graficar en 2D o 3D), manipular datos de forma más eficiente (compresión de imágenes,\ncómputos más rápidos) y eliminar información redundante (modelos supervisados con menos variables).</p>\n<h3>PCA como método lineal</h3>\n<p>En los métodos lineales la transformación es una multiplicación por una matriz:</p>\n<pre><code>Z = X A       con A en R^{p x d}\n</code></pre>\n<p>PCA escoge A de forma que las nuevas variables (componentes) tengan <strong>máxima varianza</strong> y sean\n<strong>ortogonales</strong> entre si.</p>\n<h3>Solución por descomposición espectral</h3>\n<p>Sea S la matriz de covarianza muestral de X. Se resuelve:</p>\n<pre><code>S w = lambda w\n</code></pre>\n<ul>\n<li>El <strong>primer componente principal</strong> es el eigenvector w_1 asociado al eigenvalor más grande.</li>\n<li>La <strong>varianza del componente j</strong> es exactamente el eigenvalor lambda_j.</li>\n<li>La <strong>proporción de varianza explicada</strong> por el componente j es lambda_j / sum(lambda).</li>\n</ul>\n<p>Los <strong>scores</strong> son las coordenadas de los datos en la nueva base, calculadas sobre datos centrados:</p>\n<pre><code>Z = (X - media) W\n</code></pre>\n<h3>Reconstrucción</h3>\n<p>Con d componentes se puede reconstruir una aproximación de los datos originales:</p>\n<pre><code>X_aprox = Z_d W_d^T + media\n</code></pre>\n<p>Cuantos más componentes, mejor la reconstrucción. Con d = p la reconstrucción es exacta. Este es\nel principio de la compresión de imágenes del ejemplo de dígitos.</p>\n<h3>Decisiones prácticas</h3>\n<ul>\n<li><strong>Centrar siempre.</strong> PCA sobre datos no centrados mide algo distinto.</li>\n<li><strong>Escalar (usar la matriz de correlación) si las unidades difieren.</strong> Con <code>princomp</code> en R se usa\n  <code>cor = TRUE</code>, en Python se estandariza antes. Sin escalar, la variable con mayor varianza numérica\n  domina el primer componente.</li>\n<li><strong>Cuántos componentes</strong>: gráfico de codo de los eigenvalores (<code>plot(pca$sdev^2, type=\"b\")</code>),\n  o varianza acumulada superior a un porcentaje, o la regla de Kaiser (eigenvalores mayores a 1\n  sobre la matriz de correlación).</li>\n<li><strong>Biplot</strong>: muestra al tiempo los scores de las observaciones y las cargas (loadings) de las\n  variables originales. Sirve para interpretar qué significa cada componente.</li>\n</ul>", "relacion": "<p>El código del curso para PCA está en <strong>R</strong>. Hace el procedimiento dos veces, a mano y con la función.</p>\n<p><strong>Versión manual, paso a paso:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Concepto</th>\n<th>Línea</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Matriz de covarianza S</td>\n<td><code>S = var(X)</code></td>\n</tr>\n<tr>\n<td>Descomposición espectral</td>\n<td><code>eigen(S)</code></td>\n</tr>\n<tr>\n<td>Primer eigenvector w_1</td>\n<td><code>w = eigen(S)$vectors[,1]</code></td>\n</tr>\n<tr>\n<td>Primer eigenvalor</td>\n<td><code>lambda = eigen(S)$values[1]</code></td>\n</tr>\n<tr>\n<td>Datos centrados</td>\n<td><code>XX = as.matrix(X - medias)</code></td>\n</tr>\n<tr>\n<td>Primer componente (scores)</td>\n<td><code>Z = XX %*% w</code></td>\n</tr>\n<tr>\n<td>Reconstrucción</td>\n<td><code>ZZ = cbind(Z*w[1], Z*w[2])</code> y se le suman las medias</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Versión con la función:</strong> <code>princomp(X, scores = TRUE)</code>.</p>\n<ul>\n<li><code>summary(pca, loadings = TRUE)</code> da la varianza explicada y las cargas.</li>\n<li><code>pca$sdev^2</code> son los eigenvalores. Graficarlos es el <strong>gráfico de codo</strong>.</li>\n<li><code>pca$scores</code> son las nuevas coordenadas Z.</li>\n<li><code>sqrt(lambda)</code> coincide con la primera entrada de <code>pca$sdev</code>, y\n  <code>lambda/sum(eigen(S)$values)</code> es la proporción de varianza explicada. El código hace esa\n  verificación a propósito.</li>\n</ul>\n<p>En el ejemplo de dígitos, la reconstrucción con k componentes se arma pegando ceros:\n<code>ZZ = Z %*% rbind(t(w)[1:k,], matriz de ceros)</code>. Eso equivale a anular los componentes que no se\nusan. Luego se vuelve a sumar la media y se gráfica la imagen reconstruida contra la original.</p>", "python": [{"titulo": "PCA con sklearn (equivalente del código en R)", "origen": "Equivalente agregado. El código de PCA del curso está en R", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.datasets import load_iris\n\niris = load_iris()\nX = iris.data\n\n# Escalar si las variables tienen unidades distintas\nXs = StandardScaler().fit_transform(X)\n\npca = PCA()            # sin argumento calcula todos los componentes\nscores = pca.fit_transform(Xs)\n\npca.explained_variance_          # eigenvalores (varianza de cada componente)\npca.explained_variance_ratio_    # proporción de varianza explicada\nnp.cumsum(pca.explained_variance_ratio_)   # varianza acumulada\npca.components_                  # cargas (loadings), una FILA por componente\n\n# Gráfico de codo\nplt.plot(range(1, len(pca.explained_variance_)+1), pca.explained_variance_, marker='o')\nplt.xlabel(\"Componente\")\nplt.ylabel(\"Varianza (eigenvalor)\")\nplt.title(\"Varianzas de Componentes\")\nplt.show()\n\n# Proyección en los dos primeros componentes\nplt.scatter(scores[:, 0], scores[:, 1], c=iris.target)\nplt.xlabel(\"1st Principal Component\")\nplt.ylabel(\"2nd Principal Component\")\nplt.show()"}, {"titulo": "PCA a mano con descomposición espectral y reconstrucción", "origen": "Equivalente agregado. Replica el procedimiento manual del código en R", "code": "import numpy as np\n\n# Matriz de covarianza\nS = np.cov(X, rowvar=False)\n\n# Descomposición espectral\nvalores, vectores = np.linalg.eigh(S)\n\n# eigh devuelve en orden ascendente: se invierte\norden = np.argsort(valores)[::-1]\nvalores = valores[orden]\nvectores = vectores[:, orden]\n\nprint(\"Eigenvalores:\", valores)\nprint(\"Proporción explicada:\", valores/np.sum(valores))\n\n# Datos centrados y scores\nmedias = X.mean(axis=0)\nXc = X - medias\nZ = Xc @ vectores\n\n# Reconstrucción con k componentes\nk = 2\nX_aprox = Z[:, :k] @ vectores[:, :k].T + medias\n\nerror = np.mean((X - X_aprox)**2)\nprint(\"Error cuadrático medio de reconstrucción con\", k, \"componentes:\", round(error, 4))"}, {"titulo": "Biplot en Python", "origen": "Equivalente agregado, no viene del material del curso", "code": "import matplotlib.pyplot as plt\nimport numpy as np\n\ndef biplot(scores, cargas, nombres):\n    xs = scores[:, 0]\n    ys = scores[:, 1]\n    escala_x = 1/(xs.max() - xs.min())\n    escala_y = 1/(ys.max() - ys.min())\n\n    plt.scatter(xs*escala_x, ys*escala_y, s=10, alpha=0.5)\n    for i, nombre in enumerate(nombres):\n        plt.arrow(0, 0, cargas[0, i], cargas[1, i], color='r', alpha=0.7)\n        plt.text(cargas[0, i]*1.1, cargas[1, i]*1.1, nombre, color='r')\n\n    plt.xlabel(\"PC1\")\n    plt.ylabel(\"PC2\")\n    plt.grid(alpha=0.2)\n    plt.show()\n\nbiplot(scores, pca.components_, iris.feature_names)"}], "r": [{"titulo": "PCA paso a paso y con princomp (código del curso)", "origen": "Del curso, code1_class7_ejemplo1-pca.txt", "code": "data=read.table(\"measure.txt\")\n\nX=data[,1:2]\nn=dim(X)[1]\nS=var(X)\n\n#Spectral decomposition (finding eigenvalues and eigenvectors)\n  eigen(S)\n\n#Solución a primer componente principal\n  w=eigen(S)$vectors[,1]\n  lambda=eigen(S)$values[1]\n\n#New variable: First Component\n  medias=cbind(rep(colMeans(X)[1],n),rep(colMeans(X)[2],n))\n  XX=as.matrix(X-medias)  #datos centrados\n  Z=XX%*%w\n  plot(density(Z))\n\n#Points reconstruction\n  ZZ=cbind(Z*w[1],Z*w[2])\n  ZZ=ZZ+medias  #agregar la medias otra vez\n  plot(ZZ)\n  plot(X,lwd=2)\n  points(ZZ,col=2,lwd=2)\n\n#Using princomp\n  pp2=princomp(X)\n  summary(pp2,loadings=T)\n  sqrt(lambda)\n  lambda/sum(eigen(S)$values)\n\n\n#De tres a dos dimensiones\n  X=data[,1:3]\n  pca=princomp(X,scores=T)\n  summary(pca,loadings=T)\n  pca$scores\n  par(mfrow=c(1,2))\n  biplot(pca)\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4)[data[,4]])\n\n#Gráfico de codo\n  plot(pca$sdev^2,type=\"b\",main=\"Varianzas de Componentes\")\n\n\n#Ahora cambiamos de base de datos\ndata=iris\n\n  X=data[,1:4]\n  pca=princomp(X,scores=T)\n  summary(pca,loadings=T)\n  pca$scores\n  par(mfrow=c(1,2))\n  biplot(pca)\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4,3)[data[,5]])"}, {"titulo": "PCA sobre dígitos manuscritos y reconstrucción de imágenes", "origen": "Del curso, code2_class7_ejemplo2-pca.txt", "code": "#######################################################\n#data: handwritten digits\n\n  data=read.csv(\"digits.txt\",head=F)\n  pix=data[,1:64]\n  y=data[,65]\n\n##########################################\n#PLOT\nindex=211\n\npixi=matrix(rep(0,64),ncol=8)\nfor(i in 1:8){\n  for(j in 1:8){\n    pixi[j,i]=pix[index,(i-1)*8+j]\n  }\n}\nx=seq(0,1,by=1/8)\nyy=seq(0,1,by=1/8)\nimage(x, yy, pixi,col = terrain.colors(100))\ny[index]\n\n##########################################\n#Principal components\nS=var(pix)\nlibrary(corrplot)\nM=cor(pix)\ncorrplot(M, method=\"circle\")\n\npp=princomp(pix,scores=T)\nsummary(pp)\n\n#Gráfico de codo\n  plot(pp$sdev^2,type=\"b\",main=\"Varianzas de Componentes\")\n\n##############################################\n#Images reconstruction\nnn=dim(pix)[1]\np=dim(pix)[2]\n\n  w=eigen(S)$vectors\n\n    medias = colMeans(pix)\n    pixx=as.matrix(pix - rep(medias, rep.int(nrow(pix), ncol(pix))))\n    Z=pixx%*%w\n\n#Projections\n#number of components\n  k=6\n  ZZ=Z%*%rbind(t(w)[1:k,],matrix(rep(0,(p-k)*p),ncol=p))\n  ZZ=as.matrix(ZZ+rep(medias, rep.int(nrow(pix), ncol(pix))))\n\nindex=18\n\npixi=matrix(rep(0,64),ncol=8)\npixi2=matrix(rep(0,64),ncol=8)\n\nfor(i in 1:8){\n  for(j in 1:8){\n    pixi[j,i]=pix[index,(i-1)*8+j]\n    pixi2[j,i]=ZZ[index,(i-1)*8+j]\n  }\n}\n\nx=seq(0,1,by=1/8)\nyy=seq(0,1,by=1/8)\n\npar(mfrow=c(2,1))\nimage(x, yy, pixi,col = terrain.colors(100))\nimage(x, yy, pixi2,col = terrain.colors(100))\n\ny[index]"}, {"titulo": "prcomp: la alternativa a princomp", "origen": "Equivalente agregado, no viene del material del curso", "code": "# prcomp usa SVD y es numéricamente más estable que princomp\nX <- iris[, 1:4]\n\npr <- prcomp(X, center = TRUE, scale. = TRUE)   # scale. = TRUE usa la correlación\n\npr$sdev^2        # eigenvalores\npr$rotation      # cargas (una COLUMNA por componente)\npr$x             # scores\n\nsummary(pr)      # varianza explicada y acumulada\n\nplot(pr$sdev^2, type = \"b\", main = \"Gráfico de codo\")\nbiplot(pr)\n\n# Varianza acumulada\ncumsum(pr$sdev^2)/sum(pr$sdev^2)\n\n# Regla de Kaiser sobre la correlación: eigenvalores mayores a 1\nwhich(pr$sdev^2 > 1)"}], "busqueda": "09 pca (componentes principales) descomposicion espectral, scores, varianza explicada, biplot, grafico de codo. reduccion de dimensiones clase 6, clase 7, clase 8  el problema general de reduccion de dimensiones \n  input :  matriz x de n x p.  se observan p variables x1, ..., xp\noutput:  matriz z de n x d con d &lt; p.  se representan los datos en d variables z1, ..., zd\n  \n el criterio de \"mejor representacion posible\" del curso es  conservar las relaciones entre los\npuntos , es decir, las distancias: \n  dist(x_i, x_j)  aprox  dist(z_i, z_j)   para todo i, j\n  \n por que se usa: entender mejor los datos en grandes dimensiones (feature extraction, variables\nlatentes, graficar en 2d o 3d), manipular datos de forma mas eficiente (compresion de imagenes,\ncomputos mas rapidos) y eliminar informacion redundante (modelos supervisados con menos variables). \n pca como metodo lineal \n en los metodos lineales la transformacion es una multiplicacion por una matriz: \n  z = x a       con a en r^{p x d}\n  \n pca escoge a de forma que las nuevas variables (componentes) tengan  maxima varianza  y sean\n ortogonales  entre si. \n solucion por descomposicion espectral \n sea s la matriz de covarianza muestral de x. se resuelve: \n  s w = lambda w\n  \n \n el  primer componente principal  es el eigenvector w_1 asociado al eigenvalor mas grande. \n la  varianza del componente j  es exactamente el eigenvalor lambda_j. \n la  proporcion de varianza explicada  por el componente j es lambda_j / sum(lambda). \n \n los  scores  son las coordenadas de los datos en la nueva base, calculadas sobre datos centrados: \n  z = (x - media) w\n  \n reconstruccion \n con d componentes se puede reconstruir una aproximacion de los datos originales: \n  x_aprox = z_d w_d^t + media\n  \n cuantos mas componentes, mejor la reconstruccion. con d = p la reconstruccion es exacta. este es\nel principio de la compresion de imagenes del ejemplo de digitos. \n decisiones practicas \n \n  centrar siempre.  pca sobre datos no centrados mide algo distinto. \n  escalar (usar la matriz de correlacion) si las unidades difieren.  con  princomp  en r se usa\n   cor = true , en python se estandariza antes. sin escalar, la variable con mayor varianza numerica\n  domina el primer componente. \n  cuantos componentes : grafico de codo de los eigenvalores ( plot(pca$sdev^2, type=\"b\") ),\n  o varianza acumulada superior a un porcentaje, o la regla de kaiser (eigenvalores mayores a 1\n  sobre la matriz de correlacion). \n  biplot : muestra al tiempo los scores de las observaciones y las cargas (loadings) de las\n  variables originales. sirve para interpretar que significa cada componente. \n  pca con sklearn (equivalente del codigo en r) import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import pca\nfrom sklearn.preprocessing import standardscaler\nfrom sklearn.datasets import load_iris\n\niris = load_iris()\nx = iris.data\n\n# escalar si las variables tienen unidades distintas\nxs = standardscaler().fit_transform(x)\n\npca = pca()            # sin argumento calcula todos los componentes\nscores = pca.fit_transform(xs)\n\npca.explained_variance_          # eigenvalores (varianza de cada componente)\npca.explained_variance_ratio_    # proporcion de varianza explicada\nnp.cumsum(pca.explained_variance_ratio_)   # varianza acumulada\npca.components_                  # cargas (loadings), una fila por componente\n\n# grafico de codo\nplt.plot(range(1, len(pca.explained_variance_)+1), pca.explained_variance_, marker='o')\nplt.xlabel(\"componente\")\nplt.ylabel(\"varianza (eigenvalor)\")\nplt.title(\"varianzas de componentes\")\nplt.show()\n\n# proyeccion en los dos primeros componentes\nplt.scatter(scores[:, 0], scores[:, 1], c=iris.target)\nplt.xlabel(\"1st principal component\")\nplt.ylabel(\"2nd principal component\")\nplt.show() pca a mano con descomposicion espectral y reconstruccion import numpy as np\n\n# matriz de covarianza\ns = np.cov(x, rowvar=false)\n\n# descomposicion espectral\nvalores, vectores = np.linalg.eigh(s)\n\n# eigh devuelve en orden ascendente: se invierte\norden = np.argsort(valores)[::-1]\nvalores = valores[orden]\nvectores = vectores[:, orden]\n\nprint(\"eigenvalores:\", valores)\nprint(\"proporcion explicada:\", valores/np.sum(valores))\n\n# datos centrados y scores\nmedias = x.mean(axis=0)\nxc = x - medias\nz = xc @ vectores\n\n# reconstruccion con k componentes\nk = 2\nx_aprox = z[:, :k] @ vectores[:, :k].t + medias\n\nerror = np.mean((x - x_aprox)**2)\nprint(\"error cuadratico medio de reconstruccion con\", k, \"componentes:\", round(error, 4)) biplot en python import matplotlib.pyplot as plt\nimport numpy as np\n\ndef biplot(scores, cargas, nombres):\n    xs = scores[:, 0]\n    ys = scores[:, 1]\n    escala_x = 1/(xs.max() - xs.min())\n    escala_y = 1/(ys.max() - ys.min())\n\n    plt.scatter(xs*escala_x, ys*escala_y, s=10, alpha=0.5)\n    for i, nombre in enumerate(nombres):\n        plt.arrow(0, 0, cargas[0, i], cargas[1, i], color='r', alpha=0.7)\n        plt.text(cargas[0, i]*1.1, cargas[1, i]*1.1, nombre, color='r')\n\n    plt.xlabel(\"pc1\")\n    plt.ylabel(\"pc2\")\n    plt.grid(alpha=0.2)\n    plt.show()\n\nbiplot(scores, pca.components_, iris.feature_names) pca paso a paso y con princomp (codigo del curso) data=read.table(\"measure.txt\")\n\nx=data[,1:2]\nn=dim(x)[1]\ns=var(x)\n\n#spectral decomposition (finding eigenvalues and eigenvectors)\n  eigen(s)\n\n#solucion a primer componente principal\n  w=eigen(s)$vectors[,1]\n  lambda=eigen(s)$values[1]\n\n#new variable: first component\n  medias=cbind(rep(colmeans(x)[1],n),rep(colmeans(x)[2],n))\n  xx=as.matrix(x-medias)  #datos centrados\n  z=xx%*%w\n  plot(density(z))\n\n#points reconstruction\n  zz=cbind(z*w[1],z*w[2])\n  zz=zz+medias  #agregar la medias otra vez\n  plot(zz)\n  plot(x,lwd=2)\n  points(zz,col=2,lwd=2)\n\n#using princomp\n  pp2=princomp(x)\n  summary(pp2,loadings=t)\n  sqrt(lambda)\n  lambda/sum(eigen(s)$values)\n\n\n#de tres a dos dimensiones\n  x=data[,1:3]\n  pca=princomp(x,scores=t)\n  summary(pca,loadings=t)\n  pca$scores\n  par(mfrow=c(1,2))\n  biplot(pca)\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4)[data[,4]])\n\n#grafico de codo\n  plot(pca$sdev^2,type=\"b\",main=\"varianzas de componentes\")\n\n\n#ahora cambiamos de base de datos\ndata=iris\n\n  x=data[,1:4]\n  pca=princomp(x,scores=t)\n  summary(pca,loadings=t)\n  pca$scores\n  par(mfrow=c(1,2))\n  biplot(pca)\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4,3)[data[,5]]) pca sobre digitos manuscritos y reconstruccion de imagenes #######################################################\n#data: handwritten digits\n\n  data=read.csv(\"digits.txt\",head=f)\n  pix=data[,1:64]\n  y=data[,65]\n\n##########################################\n#plot\nindex=211\n\npixi=matrix(rep(0,64),ncol=8)\nfor(i in 1:8){\n  for(j in 1:8){\n    pixi[j,i]=pix[index,(i-1)*8+j]\n  }\n}\nx=seq(0,1,by=1/8)\nyy=seq(0,1,by=1/8)\nimage(x, yy, pixi,col = terrain.colors(100))\ny[index]\n\n##########################################\n#principal components\ns=var(pix)\nlibrary(corrplot)\nm=cor(pix)\ncorrplot(m, method=\"circle\")\n\npp=princomp(pix,scores=t)\nsummary(pp)\n\n#grafico de codo\n  plot(pp$sdev^2,type=\"b\",main=\"varianzas de componentes\")\n\n##############################################\n#images reconstruction\nnn=dim(pix)[1]\np=dim(pix)[2]\n\n  w=eigen(s)$vectors\n\n    medias = colmeans(pix)\n    pixx=as.matrix(pix - rep(medias, rep.int(nrow(pix), ncol(pix))))\n    z=pixx%*%w\n\n#projections\n#number of components\n  k=6\n  zz=z%*%rbind(t(w)[1:k,],matrix(rep(0,(p-k)*p),ncol=p))\n  zz=as.matrix(zz+rep(medias, rep.int(nrow(pix), ncol(pix))))\n\nindex=18\n\npixi=matrix(rep(0,64),ncol=8)\npixi2=matrix(rep(0,64),ncol=8)\n\nfor(i in 1:8){\n  for(j in 1:8){\n    pixi[j,i]=pix[index,(i-1)*8+j]\n    pixi2[j,i]=zz[index,(i-1)*8+j]\n  }\n}\n\nx=seq(0,1,by=1/8)\nyy=seq(0,1,by=1/8)\n\npar(mfrow=c(2,1))\nimage(x, yy, pixi,col = terrain.colors(100))\nimage(x, yy, pixi2,col = terrain.colors(100))\n\ny[index] prcomp: la alternativa a princomp # prcomp usa svd y es numericamente mas estable que princomp\nx <- iris[, 1:4]\n\npr <- prcomp(x, center = true, scale. = true)   # scale. = true usa la correlacion\n\npr$sdev^2        # eigenvalores\npr$rotation      # cargas (una columna por componente)\npr$x             # scores\n\nsummary(pr)      # varianza explicada y acumulada\n\nplot(pr$sdev^2, type = \"b\", main = \"grafico de codo\")\nbiplot(pr)\n\n# varianza acumulada\ncumsum(pr$sdev^2)/sum(pr$sdev^2)\n\n# regla de kaiser sobre la correlacion: eigenvalores mayores a 1\nwhich(pr$sdev^2 > 1)"}, {"num": "10", "slug": "mds", "parte": "Reducción de dimensiones", "titulo": "Multidimensional Scaling (MDS)", "resumen": "Reconstruir coordenadas a partir de distancias, MDS clásico, métrico y no métrico.", "clases": "Clase 7, Clase 8", "teoria": "<h3>La intuición fundamental</h3>\n<p>Suponga que se tienen las distancias entre un grupo de observaciones, contenidas en una matriz:</p>\n<pre><code>D = [ d_ij ]  en R^{n x n}\n</code></pre>\n<p>pero <strong>no se tienen las coordenadas originales</strong>, es decir, se desconoce la matriz X.\n¿Cómo se pueden reconstruir las observaciones? En particular, ¿cómo hacer un mapa en 2D?</p>\n<p>La clave está en la relación entre las distancias y los <strong>productos punto</strong>:</p>\n<pre><code>D = [ d_ij ]  en R^{n x n}\nB = [ &lt;x_i, x_j&gt; ] = X X^T  en R^{n x n}\n</code></pre>\n<p>Conociendo D se puede recuperar B mediante doble centrado, y de B se recuperan coordenadas\nhaciendo descomposición espectral. Ese es el MDS clásico.</p>\n<h3>Los tres sabores</h3>\n<p><strong>1. MDS clásico (cmdscale).</strong> Usa distancias euclidianas y doble centrado. Es <strong>equivalente a PCA</strong>\ncuando la matriz de distancias es euclidiana: da las mismas coordenadas salvo rotación y reflexión.\nLa diferencia es la entrada: PCA recibe X, MDS recibe D.</p>\n<p><strong>2. MDS métrico.</strong> Se usa cuando las distancias no son euclidianas pero sí son cuantitativas, por\nejemplo la distancia de Gower para datos mixtos. Busca coordenadas que aproximen los valores de las\ndistancias minimizando una función de estrés.</p>\n<p><strong>3. MDS no métrico (isoMDS, Kruskal).</strong> Se usa cuando solo importa el <strong>orden</strong> de las distancias,\nno sus valores. Típico con datos de percepción, similitud o votaciones. Minimiza el estrés sobre una\ntransformación monótona de las distancias.</p>\n<h3>Salidas y diagnósticos</h3>\n<ul>\n<li><code>mds$points</code>: las coordenadas nuevas (la matriz Z).</li>\n<li><code>mds$eig</code>: los eigenvalores. Eigenvalores negativos grandes indican que la matriz de distancias\n  no es euclidiana. La proporción de los primeros d eigenvalores indica la calidad del mapa.</li>\n<li>En el no métrico, el <strong>estrés</strong> mide el ajuste. Menos de 5 por ciento es excelente, más de 20 por\n  ciento es malo.</li>\n</ul>\n<h3>Ejemplo canónico</h3>\n<p><code>eurodist</code> contiene las distancias por carretera entre ciudades europeas. MDS reconstruye el mapa de\nEuropa a partir de esa tabla, sin conocer una sola coordenada geográfica. El mapa sale rotado o\nreflejado (por eso el código escribe <code>y &lt;- -mds$points[,2]</code>, para poner el norte arriba). Esa\nambigüedad de rotación y reflexión es inherente al método.</p>", "relacion": "<p>El código del curso muestra los tres casos, uno tras otro.</p>\n<p><strong>Caso 1, clásico:</strong> <code>mds = cmdscale(eurodist, k = 2, eig = TRUE)</code>.\nEl argumento <code>k</code> es la dimensión destino y <code>eig = TRUE</code> pide los eigenvalores para diagnosticar.\nLa línea <code>y &lt;- -mds$points[, 2]</code> invierte el segundo eje <strong>solo por estética</strong>, para que el norte\nquede arriba. El gráfico se arma con <code>type = \"n\"</code> (no dibujar puntos) y luego <code>text()</code> para poner\nlos nombres de las ciudades.</p>\n<p><strong>Caso 2, métrico con datos mixtos:</strong> aquí está el paso clave del tema.</p>\n<pre><code>dis = daisy(xx, metric = &quot;gower&quot;)   # matriz de distancias para datos mixtos\nmds = cmdscale(dis, k = 2, eig = TRUE)\n</code></pre>\n<p>La función <code>daisy</code> del paquete <code>cluster</code> convierte una base con variables categóricas y continuas en\nuna matriz de distancias. Es exactamente la misma idea del tema 04 (K-Medoides con Gower): si el\nmétodo solo necesita distancias, se puede aplicar a cualquier tipo de dato.</p>\n<p><strong>Caso 3, no métrico:</strong> <code>mds = isoMDS(voting)</code> del paquete MASS, sobre datos de votaciones donde\nsolo el orden de similitud tiene sentido.</p>", "python": [{"titulo": "MDS clásico, métrico y no métrico con sklearn", "origen": "Equivalente agregado. El código de MDS del curso está en R", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.manifold import MDS\nfrom sklearn.metrics import pairwise_distances\n\n# Con datos: primero se calculan las distancias\nfrom sklearn.datasets import load_iris\nX = load_iris().data\nD = pairwise_distances(X, metric='euclidean')\n\n# MDS métrico (usa los valores de las distancias)\nmds_metrico = MDS(n_components=2, dissimilarity='precomputed',\n                  normalized_stress='auto', random_state=0)\nZ = mds_metrico.fit_transform(D)\n\nprint(\"Stress:\", mds_metrico.stress_)\n\nplt.scatter(Z[:, 0], Z[:, 1], c=load_iris().target)\nplt.title(\"MDS métrico\")\nplt.show()\n\n# MDS no métrico (solo usa el orden de las distancias)\nmds_no_metrico = MDS(n_components=2, dissimilarity='precomputed',\n                     metric=False, normalized_stress='auto', random_state=0)\nZ_nm = mds_no_metrico.fit_transform(D)\n\nplt.scatter(Z_nm[:, 0], Z_nm[:, 1], c=load_iris().target)\nplt.title(\"MDS no métrico\")\nplt.show()"}, {"titulo": "MDS clásico a mano (doble centrado)", "origen": "Equivalente agregado, no viene del material del curso", "code": "import numpy as np\n\ndef mds_clasico(D, d=2):\n    n = D.shape[0]\n\n    # Doble centrado: B = -1/2 * J D^2 J\n    J = np.eye(n) - np.ones((n, n))/n\n    B = -0.5 * J @ (D**2) @ J\n\n    # Descomposición espectral de B\n    valores, vectores = np.linalg.eigh(B)\n    orden = np.argsort(valores)[::-1]\n    valores = valores[orden]\n    vectores = vectores[:, orden]\n\n    # Coordenadas: Z = V_d * sqrt(Lambda_d)\n    L = np.diag(np.sqrt(np.maximum(valores[:d], 0)))\n    Z = vectores[:, :d] @ L\n\n    return Z, valores\n\nZ, eigenvalores = mds_clasico(D, d=2)\n\nprint(\"Primeros eigenvalores:\", eigenvalores[:5])\nprint(\"Proporción explicada:\", np.sum(np.abs(eigenvalores[:2]))/np.sum(np.abs(eigenvalores)))"}, {"titulo": "Distancia de Gower en Python para MDS con datos mixtos", "origen": "Equivalente agregado, no viene del material del curso", "code": "#!pip install gower   # quitar el # si falta instalar\nimport gower\nfrom sklearn.manifold import MDS\nimport matplotlib.pyplot as plt\n\n# W puede tener variables continuas y categóricas mezcladas\nD_gower = gower.gower_matrix(W)\n\nmds = MDS(n_components=2, dissimilarity='precomputed',\n          normalized_stress='auto', random_state=0)\nZ = mds.fit_transform(D_gower)\n\nplt.scatter(Z[:, 0], Z[:, 1])\nplt.title(\"MDS sobre distancia de Gower\")\nplt.show()"}], "r": [{"titulo": "MDS clásico, métrico y no métrico (código del curso)", "origen": "Del curso, code3_class7_MDS.txt", "code": "##################################\n#MDS\n\ndata=eurodist\n\nmds=cmdscale(data,k=2,eig=T)\nmds\n\nlibrary(graphics)\n\nx <- mds$points[, 1]\ny <- -mds$points[, 2] # reflect so North is at the top\n\nplot(x, y, type = \"n\", xlab = \"\", ylab = \"\", asp = 1, axes = FALSE,\n     main = \"cmdscale(eurodist)\")\ntext(x, y, rownames(mds$points), cex = 0.6)\n\nmds$eig\n\n\n##################################\n#MDS-metric\n\nlibrary(cluster)\n\n#datos sobre esponjas marinas\n  xx=read.table(\"sponge.txt\",header=T,sep=\",\")\n\n#cálculo de distancias tipo gower\n  dis=daisy(xx,metric=\"gower\")\n\nmds=cmdscale(dis,k=2,eig=T)\nmds\n\nplot(mds$points)\n\n\n##################################\n#MDS non-metric\n\nlibrary(HSAUR2)\nlibrary(MASS)\n\ndata=voting\n\nmds=isoMDS(voting)\nmds\n\nplot(mds$points)\nplot(mds$points, type = \"n\", xlab = \"\", ylab = \"\", asp = 1, axes = FALSE,\n     main = \"MDS votes\")\ntext(mds$points, rownames(mds$points), cex = 0.6)"}, {"titulo": "Diagnóstico de calidad del MDS", "origen": "Equivalente agregado, no viene del material del curso", "code": "mds <- cmdscale(eurodist, k = 2, eig = TRUE)\n\n# Proporción de información retenida por los dos primeros ejes\nsum(abs(mds$eig[1:2])) / sum(abs(mds$eig))\n\n# Eigenvalores negativos grandes indican distancias no euclidianas\nmds$eig[mds$eig < 0]\n\n# Comparar distancias originales contra distancias en el mapa (diagrama de Shepard)\nd_original <- as.vector(eurodist)\nd_mapa <- as.vector(dist(mds$points))\n\nplot(d_original, d_mapa, pch = 16, cex = 0.5,\n     xlab = \"Distancia original\", ylab = \"Distancia en el mapa\")\nabline(0, 1, col = \"red\")\n\ncor(d_original, d_mapa)\n\n# En el no métrico, el estrés está en el objeto\nlibrary(MASS)\nmds_nm <- isoMDS(eurodist, k = 2)\nmds_nm$stress   # en porcentaje. Menos de 5 es excelente, más de 20 es malo"}], "busqueda": "10 multidimensional scaling (mds) reconstruir coordenadas a partir de distancias, mds clasico, metrico y no metrico. reduccion de dimensiones clase 7, clase 8  la intuicion fundamental \n suponga que se tienen las distancias entre un grupo de observaciones, contenidas en una matriz: \n  d = [ d_ij ]  en r^{n x n}\n  \n pero  no se tienen las coordenadas originales , es decir, se desconoce la matriz x.\n¿como se pueden reconstruir las observaciones? en particular, ¿como hacer un mapa en 2d? \n la clave esta en la relacion entre las distancias y los  productos punto : \n  d = [ d_ij ]  en r^{n x n}\nb = [ &lt;x_i, x_j&gt; ] = x x^t  en r^{n x n}\n  \n conociendo d se puede recuperar b mediante doble centrado, y de b se recuperan coordenadas\nhaciendo descomposicion espectral. ese es el mds clasico. \n los tres sabores \n  1. mds clasico (cmdscale).  usa distancias euclidianas y doble centrado. es  equivalente a pca \ncuando la matriz de distancias es euclidiana: da las mismas coordenadas salvo rotacion y reflexion.\nla diferencia es la entrada: pca recibe x, mds recibe d. \n  2. mds metrico.  se usa cuando las distancias no son euclidianas pero si son cuantitativas, por\nejemplo la distancia de gower para datos mixtos. busca coordenadas que aproximen los valores de las\ndistancias minimizando una funcion de estres. \n  3. mds no metrico (isomds, kruskal).  se usa cuando solo importa el  orden  de las distancias,\nno sus valores. tipico con datos de percepcion, similitud o votaciones. minimiza el estres sobre una\ntransformacion monotona de las distancias. \n salidas y diagnosticos \n \n  mds$points : las coordenadas nuevas (la matriz z). \n  mds$eig : los eigenvalores. eigenvalores negativos grandes indican que la matriz de distancias\n  no es euclidiana. la proporcion de los primeros d eigenvalores indica la calidad del mapa. \n en el no metrico, el  estres  mide el ajuste. menos de 5 por ciento es excelente, mas de 20 por\n  ciento es malo. \n \n ejemplo canonico \n  eurodist  contiene las distancias por carretera entre ciudades europeas. mds reconstruye el mapa de\neuropa a partir de esa tabla, sin conocer una sola coordenada geografica. el mapa sale rotado o\nreflejado (por eso el codigo escribe  y &lt;- -mds$points[,2] , para poner el norte arriba). esa\nambiguedad de rotacion y reflexion es inherente al metodo.  mds clasico, metrico y no metrico con sklearn import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.manifold import mds\nfrom sklearn.metrics import pairwise_distances\n\n# con datos: primero se calculan las distancias\nfrom sklearn.datasets import load_iris\nx = load_iris().data\nd = pairwise_distances(x, metric='euclidean')\n\n# mds metrico (usa los valores de las distancias)\nmds_metrico = mds(n_components=2, dissimilarity='precomputed',\n                  normalized_stress='auto', random_state=0)\nz = mds_metrico.fit_transform(d)\n\nprint(\"stress:\", mds_metrico.stress_)\n\nplt.scatter(z[:, 0], z[:, 1], c=load_iris().target)\nplt.title(\"mds metrico\")\nplt.show()\n\n# mds no metrico (solo usa el orden de las distancias)\nmds_no_metrico = mds(n_components=2, dissimilarity='precomputed',\n                     metric=false, normalized_stress='auto', random_state=0)\nz_nm = mds_no_metrico.fit_transform(d)\n\nplt.scatter(z_nm[:, 0], z_nm[:, 1], c=load_iris().target)\nplt.title(\"mds no metrico\")\nplt.show() mds clasico a mano (doble centrado) import numpy as np\n\ndef mds_clasico(d, d=2):\n    n = d.shape[0]\n\n    # doble centrado: b = -1/2 * j d^2 j\n    j = np.eye(n) - np.ones((n, n))/n\n    b = -0.5 * j @ (d**2) @ j\n\n    # descomposicion espectral de b\n    valores, vectores = np.linalg.eigh(b)\n    orden = np.argsort(valores)[::-1]\n    valores = valores[orden]\n    vectores = vectores[:, orden]\n\n    # coordenadas: z = v_d * sqrt(lambda_d)\n    l = np.diag(np.sqrt(np.maximum(valores[:d], 0)))\n    z = vectores[:, :d] @ l\n\n    return z, valores\n\nz, eigenvalores = mds_clasico(d, d=2)\n\nprint(\"primeros eigenvalores:\", eigenvalores[:5])\nprint(\"proporcion explicada:\", np.sum(np.abs(eigenvalores[:2]))/np.sum(np.abs(eigenvalores))) distancia de gower en python para mds con datos mixtos #!pip install gower   # quitar el # si falta instalar\nimport gower\nfrom sklearn.manifold import mds\nimport matplotlib.pyplot as plt\n\n# w puede tener variables continuas y categoricas mezcladas\nd_gower = gower.gower_matrix(w)\n\nmds = mds(n_components=2, dissimilarity='precomputed',\n          normalized_stress='auto', random_state=0)\nz = mds.fit_transform(d_gower)\n\nplt.scatter(z[:, 0], z[:, 1])\nplt.title(\"mds sobre distancia de gower\")\nplt.show() mds clasico, metrico y no metrico (codigo del curso) ##################################\n#mds\n\ndata=eurodist\n\nmds=cmdscale(data,k=2,eig=t)\nmds\n\nlibrary(graphics)\n\nx <- mds$points[, 1]\ny <- -mds$points[, 2] # reflect so north is at the top\n\nplot(x, y, type = \"n\", xlab = \"\", ylab = \"\", asp = 1, axes = false,\n     main = \"cmdscale(eurodist)\")\ntext(x, y, rownames(mds$points), cex = 0.6)\n\nmds$eig\n\n\n##################################\n#mds-metric\n\nlibrary(cluster)\n\n#datos sobre esponjas marinas\n  xx=read.table(\"sponge.txt\",header=t,sep=\",\")\n\n#calculo de distancias tipo gower\n  dis=daisy(xx,metric=\"gower\")\n\nmds=cmdscale(dis,k=2,eig=t)\nmds\n\nplot(mds$points)\n\n\n##################################\n#mds non-metric\n\nlibrary(hsaur2)\nlibrary(mass)\n\ndata=voting\n\nmds=isomds(voting)\nmds\n\nplot(mds$points)\nplot(mds$points, type = \"n\", xlab = \"\", ylab = \"\", asp = 1, axes = false,\n     main = \"mds votes\")\ntext(mds$points, rownames(mds$points), cex = 0.6) diagnostico de calidad del mds mds <- cmdscale(eurodist, k = 2, eig = true)\n\n# proporcion de informacion retenida por los dos primeros ejes\nsum(abs(mds$eig[1:2])) / sum(abs(mds$eig))\n\n# eigenvalores negativos grandes indican distancias no euclidianas\nmds$eig[mds$eig < 0]\n\n# comparar distancias originales contra distancias en el mapa (diagrama de shepard)\nd_original <- as.vector(eurodist)\nd_mapa <- as.vector(dist(mds$points))\n\nplot(d_original, d_mapa, pch = 16, cex = 0.5,\n     xlab = \"distancia original\", ylab = \"distancia en el mapa\")\nabline(0, 1, col = \"red\")\n\ncor(d_original, d_mapa)\n\n# en el no metrico, el estres esta en el objeto\nlibrary(mass)\nmds_nm <- isomds(eurodist, k = 2)\nmds_nm$stress   # en porcentaje. menos de 5 es excelente, mas de 20 es malo"}, {"num": "11", "slug": "analisis-factorial", "parte": "Reducción de dimensiones", "titulo": "Análisis factorial", "resumen": "Variables latentes, cargas, comunalidad, rotación varimax y promax, prueba chi.", "clases": "Clase 7, Clase 8, Clase 9", "teoria": "<h3>En qué se diferencia de PCA</h3>\n<p>PCA es una <strong>transformación algebraica</strong>: los componentes son combinaciones lineales de las\nvariables observadas. No hay modelo estadístico detrás.</p>\n<p>El análisis factorial es un <strong>modelo de variables latentes</strong>: se postula que existen factores no\nobservados que generan las variables observadas.</p>\n<pre><code>X = Lambda F + epsilon\n</code></pre>\n<ul>\n<li><code>F</code>: los factores comunes (las variables latentes), de dimensión d.</li>\n<li><code>Lambda</code>: la matriz de <strong>cargas</strong> (loadings), de dimensión p por d.</li>\n<li><code>epsilon</code>: las unicidades, la parte específica de cada variable que ningún factor explica.</li>\n</ul>\n<p>De ahí sale la descomposición de la covarianza:</p>\n<pre><code>S = Lambda Lambda^T + Psi\n</code></pre>\n<p>Para cada variable:</p>\n<pre><code>Var(X_j) = comunalidad_j + unicidad_j\n</code></pre>\n<p>La <strong>comunalidad</strong> es la proporción de varianza de la variable explicada por los factores comunes.\nLa <strong>unicidad</strong> (uniqueness) es lo que queda. En R, <code>factanal</code> reporta directamente las unicidades.</p>\n<h3>Ejemplos de variables latentes del curso</h3>\n<ol>\n<li>¿Cómo se mide la inteligencia de las personas? El factor es la habilidad, las variables son los\n   puntajes de varias pruebas.</li>\n<li>Unmixing, el problema de la fiesta de cóctel: separar voces a partir de micrófonos.</li>\n<li>En iris, el factor único se interpreta como el <strong>tamaño</strong> de la flor.</li>\n</ol>\n<h3>Número de factores</h3>\n<p><code>factanal</code> entrega una <strong>prueba chi cuadrado</strong> de bondad de ajuste. La hipótesis nula es que d\nfactores son suficientes.</p>\n<ul>\n<li><strong>p-value pequeño</strong>: se rechaza, hacen falta más factores.</li>\n<li><strong>p-value grande</strong>: d factores bastan.</li>\n</ul>\n<p>Se va subiendo d hasta que el p-value deje de ser significativo. En el ejemplo de Holzinger el\nresultado son <strong>tres factores</strong>.</p>\n<p>Con iris pasa algo instructivo: con un factor funciona, con dos el modelo <strong>no se puede estimar</strong>\nporque no hay suficientes grados de libertad (4 variables no alcanzan para 2 factores).</p>\n<h3>Rotación</h3>\n<p>Las cargas no son únicas: cualquier rotación ortogonal de Lambda da el mismo ajuste. La rotación se\nescoge para facilitar la <strong>interpretación</strong>, buscando que cada variable cargue fuerte en un solo\nfactor.</p>\n<ul>\n<li><strong>varimax</strong> (la de por defecto): rotación ortogonal, los factores quedan no correlacionados.</li>\n<li><strong>promax</strong>: rotación oblicua, permite que los factores estén correlacionados. Suele ser más\n  realista cuando las variables latentes tienen relación entre si.</li>\n</ul>\n<h3>Scores</h3>\n<p>Son los valores estimados de los factores para cada observación. Se piden con\n<code>scores = \"regression\"</code>. Son el análogo de <code>pca$scores</code>.</p>", "relacion": "<p>Todo el código del curso está en <strong>R</strong> y gira alrededor de una sola función: <code>factanal</code>.</p>\n<p>Firma básica: <code>factanal(datos, numero_de_factores)</code>.</p>\n<p>Puntos que el código demuestra a propósito:</p>\n<ol>\n<li>\n<p><strong>Se puede estimar solo con la matriz de covarianza o de correlación</strong>, sin los datos crudos:\n   <code>factanal(covmat = S, n.obs = 150, factors = 1)</code>. Esto es distinto a la mayoría de métodos y es\n   útil porque muchos estudios publican solo la matriz de correlaciones. El ejemplo de Holzinger\n   trabaja exactamente así, con <code>SS = Holzinger.9</code>.</p>\n</li>\n<li>\n<p><strong><code>fa3 = factanal(xx, 2)</code> falla a propósito.</strong> El comentario del profesor dice \"Pruebe que con\n   dos factores no se puede\". Con p = 4 variables no hay grados de libertad para 2 factores.</p>\n</li>\n<li>\n<p><strong>Los scores hay que pedirlos:</strong> <code>factanal(xx, 1, scores = \"regression\")</code> y luego <code>fa$scores</code>.\n   El código gráfica <code>plot(density(scor))</code> porque con un solo factor el diagrama de dispersión no\n   dice nada, la densidad sí.</p>\n</li>\n<li>\n<p><strong>Interpretación por grupos:</strong> se parte el vector de scores en los tres subconjuntos de 50 flores\n   (<code>s1 = scor[1:50]</code>, etc.) y se superponen las tres densidades. Ahí se ve que el factor separa las\n   especies aunque nunca se le dio esa información.</p>\n</li>\n<li>\n<p><strong>Comparación de rotaciones:</strong> se corre <code>factanal(factors=3, covmat=SS, n.obs=145)</code> con varimax\n   por defecto y luego con <code>rotation = \"promax\"</code>, y se comparan las interpretaciones.</p>\n</li>\n</ol>", "python": [{"titulo": "Análisis factorial con factor_analyzer", "origen": "Equivalente agregado. El código del curso está en R", "code": "#!pip install factor_analyzer   # quitar el # si falta instalar\nfrom factor_analyzer import FactorAnalyzer\nimport numpy as np\nfrom sklearn.datasets import load_iris\n\nX = load_iris().data\n\n# Un factor, rotación varimax\nfa = FactorAnalyzer(n_factors=1, rotation='varimax', method='ml')\nfa.fit(X)\n\nfa.loadings_              # cargas (Lambda), p x d\nfa.get_uniquenesses()     # unicidades\nfa.get_communalities()    # comunalidades\nfa.get_factor_variance()  # varianza explicada por factor\n\n# Scores de cada observación\nscores = fa.transform(X)\n\n# Rotación oblicua\nfa_promax = FactorAnalyzer(n_factors=3, rotation='promax', method='ml')\n\n# Decidir el número de factores: gráfico de eigenvalores\nfa_todos = FactorAnalyzer(n_factors=X.shape[1], rotation=None, method='ml')\nfa_todos.fit(X)\nev, v = fa_todos.get_eigenvalues()\n\nimport matplotlib.pyplot as plt\nplt.plot(range(1, len(ev)+1), ev, marker='o')\nplt.axhline(1, color='red', linestyle='--')\nplt.xlabel(\"Factor\")\nplt.ylabel(\"Eigenvalor\")\nplt.show()"}, {"titulo": "FactorAnalysis de sklearn", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.decomposition import FactorAnalysis\nimport numpy as np\n\nfa = FactorAnalysis(n_components=1, random_state=0)\nscores = fa.fit_transform(X)\n\nfa.components_    # cargas, una FILA por factor\nfa.noise_variance_   # unicidades (Psi)\n\n# Comunalidades\ncomunalidades = np.sum(fa.components_**2, axis=0)\nprint(comunalidades)\n\n# Visualizar la densidad del factor por especie de iris\nimport matplotlib.pyplot as plt\nfrom scipy.stats import gaussian_kde\n\ny = load_iris().target\nfor especie in [0, 1, 2]:\n    s = scores[y == especie, 0]\n    kde = gaussian_kde(s)\n    rejilla = np.linspace(scores.min(), scores.max(), 200)\n    plt.plot(rejilla, kde(rejilla), lw=2)\nplt.title(\"Densidad del factor por especie\")\nplt.show()"}], "r": [{"titulo": "factanal: iris y Holzinger (código del curso)", "origen": "Del curso, code4_class7_factorial.txt y code1_class9_factorial.txt", "code": "#########################################################################\n##Ejemplo Sencillo con un factor\n##Datos de las flores de Iris (en paquete datasets)\n\n##Carga de Paquetes\n  library(datasets)\n  library(MVA)\n\n##Carga de Datos\n  x=iris\n  xx=x[,1:4]  #Usando las primeras 4 columnas\n\n##Análisis factorial con datos iris\n##factanal es el procedimiento con argumentos (datos, número de factores)\n  fa=factanal(xx,1)\n  fa  ##Acá se ven los resultados del modelo estimado\n\n##Se puede hacer con solo la matriz de covarianza\n  S=var(xx)\n  fa2=factanal(covmat=S,n.obs=150,factors=1)\n\n  fa3=factanal(xx,2)  ##Pruebe que con dos factores no se puede\n\n##Análisis factorial calculando los scores (valores del factor por observación)\n  fa=factanal(xx,1,scores=\"regression\")\n  scor=fa$scores  ##Contiene el vector con el factor de cada flor (tamaño)\n\n##Visualizando los factores\n  plot(scor)  ##Dispersión del único factor (no muy interesante)\n  plot(density(scor))  ##Densidad del factor (distribución: más útil)\n\n##Visualizando los factores por familia de flores (las tres de iris)\n  s1=scor[1:50]\n  s2=scor[51:100]\n  s3=scor[101:150]\n\n  plot(density(s1),xlim=c(-1.5,2),lwd=2)\n  lines(density(s2),lwd=2,col=2)\n  lines(density(s3),lwd=2,col=3)\n\n\n#########################################################################\n##Real Example\n##Holzinger ability test data (9 measures)\n\n  library(psych)\n\n##Cargando datos (matriz de correlaciones)\n  SS=Holzinger.9\n  cor.plot(SS)  ##Para visualizar la matriz de correlaciones\n\n##Determinando el número de factores a usar\n  factanal(factors=1,covmat=SS,n.obs=145)  ##Mirar el p-value de la prueba chi\n  factanal(factors=2,covmat=SS,n.obs=145)\n  factanal(factors=3,covmat=SS,n.obs=145)  ##Este parece ser...\n\n##Análisis Factorial con tres factores\n  ff=factanal(factors=3,covmat=SS,n.obs=145)\n  ff  ##Interprete los factores obtenidos (con rotación varimax)\n\n##Cambiando la rotación de los factores (promax)\n  ff2=factanal(factors=3,covmat=SS,n.obs=145,rotation=\"promax\")\n  ff2  ##Interprete los factores obtenidos"}, {"titulo": "Lectura de la salida de factanal", "origen": "Equivalente agregado, no viene del material del curso", "code": "ff <- factanal(factors = 3, covmat = Holzinger.9, n.obs = 145)\n\nff$loadings      # cargas. Las que no se imprimen son menores a 0.1\nff$uniquenesses  # unicidad de cada variable\n1 - ff$uniquenesses   # comunalidad\n\nff$STATISTIC     # estadístico chi cuadrado\nff$dof           # grados de libertad\nff$PVAL          # p-value: si es grande, d factores son suficientes\n\n# Mostrar todas las cargas sin cortar\nprint(ff$loadings, cutoff = 0)\n\n# Suma de cuadrados de cargas por factor (varianza explicada)\ncolSums(ff$loadings^2)\n\n\n# Alternativa del paquete psych, más flexible en rotaciones y métodos\nlibrary(psych)\nfa_psych <- fa(r = Holzinger.9, nfactors = 3, n.obs = 145,\n               rotate = \"varimax\", fm = \"ml\")\nfa_psych\nfa.diagram(fa_psych)   # diagrama de qué variable carga en qué factor\n\n# Gráfico de sedimentación para decidir el número de factores\nscree(Holzinger.9)\nfa.parallel(Holzinger.9, n.obs = 145)"}], "busqueda": "11 analisis factorial variables latentes, cargas, comunalidad, rotacion varimax y promax, prueba chi. reduccion de dimensiones clase 7, clase 8, clase 9  en que se diferencia de pca \n pca es una  transformacion algebraica : los componentes son combinaciones lineales de las\nvariables observadas. no hay modelo estadistico detras. \n el analisis factorial es un  modelo de variables latentes : se postula que existen factores no\nobservados que generan las variables observadas. \n  x = lambda f + epsilon\n  \n \n  f : los factores comunes (las variables latentes), de dimension d. \n  lambda : la matriz de  cargas  (loadings), de dimension p por d. \n  epsilon : las unicidades, la parte especifica de cada variable que ningun factor explica. \n \n de ahi sale la descomposicion de la covarianza: \n  s = lambda lambda^t + psi\n  \n para cada variable: \n  var(x_j) = comunalidad_j + unicidad_j\n  \n la  comunalidad  es la proporcion de varianza de la variable explicada por los factores comunes.\nla  unicidad  (uniqueness) es lo que queda. en r,  factanal  reporta directamente las unicidades. \n ejemplos de variables latentes del curso \n \n ¿como se mide la inteligencia de las personas? el factor es la habilidad, las variables son los\n   puntajes de varias pruebas. \n unmixing, el problema de la fiesta de coctel: separar voces a partir de microfonos. \n en iris, el factor unico se interpreta como el  tamano  de la flor. \n \n numero de factores \n  factanal  entrega una  prueba chi cuadrado  de bondad de ajuste. la hipotesis nula es que d\nfactores son suficientes. \n \n  p-value pequeno : se rechaza, hacen falta mas factores. \n  p-value grande : d factores bastan. \n \n se va subiendo d hasta que el p-value deje de ser significativo. en el ejemplo de holzinger el\nresultado son  tres factores . \n con iris pasa algo instructivo: con un factor funciona, con dos el modelo  no se puede estimar \nporque no hay suficientes grados de libertad (4 variables no alcanzan para 2 factores). \n rotacion \n las cargas no son unicas: cualquier rotacion ortogonal de lambda da el mismo ajuste. la rotacion se\nescoge para facilitar la  interpretacion , buscando que cada variable cargue fuerte en un solo\nfactor. \n \n  varimax  (la de por defecto): rotacion ortogonal, los factores quedan no correlacionados. \n  promax : rotacion oblicua, permite que los factores esten correlacionados. suele ser mas\n  realista cuando las variables latentes tienen relacion entre si. \n \n scores \n son los valores estimados de los factores para cada observacion. se piden con\n scores = \"regression\" . son el analogo de  pca$scores .  analisis factorial con factor_analyzer #!pip install factor_analyzer   # quitar el # si falta instalar\nfrom factor_analyzer import factoranalyzer\nimport numpy as np\nfrom sklearn.datasets import load_iris\n\nx = load_iris().data\n\n# un factor, rotacion varimax\nfa = factoranalyzer(n_factors=1, rotation='varimax', method='ml')\nfa.fit(x)\n\nfa.loadings_              # cargas (lambda), p x d\nfa.get_uniquenesses()     # unicidades\nfa.get_communalities()    # comunalidades\nfa.get_factor_variance()  # varianza explicada por factor\n\n# scores de cada observacion\nscores = fa.transform(x)\n\n# rotacion oblicua\nfa_promax = factoranalyzer(n_factors=3, rotation='promax', method='ml')\n\n# decidir el numero de factores: grafico de eigenvalores\nfa_todos = factoranalyzer(n_factors=x.shape[1], rotation=none, method='ml')\nfa_todos.fit(x)\nev, v = fa_todos.get_eigenvalues()\n\nimport matplotlib.pyplot as plt\nplt.plot(range(1, len(ev)+1), ev, marker='o')\nplt.axhline(1, color='red', linestyle='--')\nplt.xlabel(\"factor\")\nplt.ylabel(\"eigenvalor\")\nplt.show() factoranalysis de sklearn from sklearn.decomposition import factoranalysis\nimport numpy as np\n\nfa = factoranalysis(n_components=1, random_state=0)\nscores = fa.fit_transform(x)\n\nfa.components_    # cargas, una fila por factor\nfa.noise_variance_   # unicidades (psi)\n\n# comunalidades\ncomunalidades = np.sum(fa.components_**2, axis=0)\nprint(comunalidades)\n\n# visualizar la densidad del factor por especie de iris\nimport matplotlib.pyplot as plt\nfrom scipy.stats import gaussian_kde\n\ny = load_iris().target\nfor especie in [0, 1, 2]:\n    s = scores[y == especie, 0]\n    kde = gaussian_kde(s)\n    rejilla = np.linspace(scores.min(), scores.max(), 200)\n    plt.plot(rejilla, kde(rejilla), lw=2)\nplt.title(\"densidad del factor por especie\")\nplt.show() factanal: iris y holzinger (codigo del curso) #########################################################################\n##ejemplo sencillo con un factor\n##datos de las flores de iris (en paquete datasets)\n\n##carga de paquetes\n  library(datasets)\n  library(mva)\n\n##carga de datos\n  x=iris\n  xx=x[,1:4]  #usando las primeras 4 columnas\n\n##analisis factorial con datos iris\n##factanal es el procedimiento con argumentos (datos, numero de factores)\n  fa=factanal(xx,1)\n  fa  ##aca se ven los resultados del modelo estimado\n\n##se puede hacer con solo la matriz de covarianza\n  s=var(xx)\n  fa2=factanal(covmat=s,n.obs=150,factors=1)\n\n  fa3=factanal(xx,2)  ##pruebe que con dos factores no se puede\n\n##analisis factorial calculando los scores (valores del factor por observacion)\n  fa=factanal(xx,1,scores=\"regression\")\n  scor=fa$scores  ##contiene el vector con el factor de cada flor (tamano)\n\n##visualizando los factores\n  plot(scor)  ##dispersion del unico factor (no muy interesante)\n  plot(density(scor))  ##densidad del factor (distribucion: mas util)\n\n##visualizando los factores por familia de flores (las tres de iris)\n  s1=scor[1:50]\n  s2=scor[51:100]\n  s3=scor[101:150]\n\n  plot(density(s1),xlim=c(-1.5,2),lwd=2)\n  lines(density(s2),lwd=2,col=2)\n  lines(density(s3),lwd=2,col=3)\n\n\n#########################################################################\n##real example\n##holzinger ability test data (9 measures)\n\n  library(psych)\n\n##cargando datos (matriz de correlaciones)\n  ss=holzinger.9\n  cor.plot(ss)  ##para visualizar la matriz de correlaciones\n\n##determinando el numero de factores a usar\n  factanal(factors=1,covmat=ss,n.obs=145)  ##mirar el p-value de la prueba chi\n  factanal(factors=2,covmat=ss,n.obs=145)\n  factanal(factors=3,covmat=ss,n.obs=145)  ##este parece ser...\n\n##analisis factorial con tres factores\n  ff=factanal(factors=3,covmat=ss,n.obs=145)\n  ff  ##interprete los factores obtenidos (con rotacion varimax)\n\n##cambiando la rotacion de los factores (promax)\n  ff2=factanal(factors=3,covmat=ss,n.obs=145,rotation=\"promax\")\n  ff2  ##interprete los factores obtenidos lectura de la salida de factanal ff <- factanal(factors = 3, covmat = holzinger.9, n.obs = 145)\n\nff$loadings      # cargas. las que no se imprimen son menores a 0.1\nff$uniquenesses  # unicidad de cada variable\n1 - ff$uniquenesses   # comunalidad\n\nff$statistic     # estadistico chi cuadrado\nff$dof           # grados de libertad\nff$pval          # p-value: si es grande, d factores son suficientes\n\n# mostrar todas las cargas sin cortar\nprint(ff$loadings, cutoff = 0)\n\n# suma de cuadrados de cargas por factor (varianza explicada)\ncolsums(ff$loadings^2)\n\n\n# alternativa del paquete psych, mas flexible en rotaciones y metodos\nlibrary(psych)\nfa_psych <- fa(r = holzinger.9, nfactors = 3, n.obs = 145,\n               rotate = \"varimax\", fm = \"ml\")\nfa_psych\nfa.diagram(fa_psych)   # diagrama de que variable carga en que factor\n\n# grafico de sedimentacion para decidir el numero de factores\nscree(holzinger.9)\nfa.parallel
