<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML IIND3118 - Repositorio de parcial</title>
<style>
:root{
  --papel:#e9edef;
  --hoja:#ffffff;
  --tinta:#12171c;
  --tinta-2:#4c5862;
  --tinta-3:#77838d;
  --linea:#ccd4d9;
  --linea-fuerte:#9aa7b0;
  --marca:#173b6b;
  --marca-suave:#e3eaf4;
  --py:#0b6152;
  --py-suave:#dcefe9;
  --r:#7c2760;
  --r-suave:#f3e2ee;
  --codigo-fondo:#f6f8f9;
  --kw:#7c2760;
  --st:#0b6152;
  --cm:#77838d;
  --nm:#8a4b10;
  --fn:#173b6b;
  --rail:280px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#11161a;
    --hoja:#181f25;
    --tinta:#e6ecf0;
    --tinta-2:#a8b5bf;
    --tinta-3:#7d8b96;
    --linea:#2b353d;
    --linea-fuerte:#465360;
    --marca:#8fb4e8;
    --marca-suave:#1d2c3f;
    --py:#6fd3b8;
    --py-suave:#152d28;
    --r:#e79bc9;
    --r-suave:#2e1a28;
    --codigo-fondo:#131a1f;
    --kw:#e79bc9;
    --st:#6fd3b8;
    --cm:#7d8b96;
    --nm:#e0a96d;
    --fn:#8fb4e8;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--papel);
  color:var(--tinta);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.6;
}
code,pre,kbd{font-family:"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}

/* ---------- encabezado ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:var(--hoja);
  border-bottom:1px solid var(--linea);
  padding:env(safe-area-inset-top,0px) 20px 0 20px;
}
.barra{
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:12px 0 11px 0;
}
.marca-titulo{
  font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0;
  color:var(--tinta);white-space:nowrap;
}
.marca-sub{font-size:13px;color:var(--tinta-3);margin:0}
.buscador{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  flex:1 1 240px;max-width:420px;min-width:180px;
}
.buscador input{
  width:100%;
  font:inherit;font-size:14px;
  padding:7px 11px;
  color:var(--tinta);
  background:var(--papel);
  border:1px solid var(--linea);
  border-radius:3px;
}
.buscador input:focus{outline:2px solid var(--marca);outline-offset:1px;border-color:var(--marca)}
.buscador input::placeholder{color:var(--tinta-3)}
.pista{font-size:12px;color:var(--tinta-3);white-space:nowrap}
kbd{
  font-size:11px;padding:1px 5px;border:1px solid var(--linea-fuerte);
  border-bottom-width:2px;border-radius:3px;color:var(--tinta-2);
}
.btn-menu{
  display:none;font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;
  background:var(--papel);color:var(--tinta);
  border:1px solid var(--linea);border-radius:3px;
}

/* ---------- cuerpo ---------- */
.cuerpo{display:flex;align-items:flex-start;gap:0;max-width:1500px;margin:0 auto}

nav.rail{
  width:var(--rail);flex:0 0 var(--rail);
  position:sticky;
  top:calc(58px + env(safe-area-inset-top,0px));
  height:calc(100vh - 58px - env(safe-area-inset-top,0px));
  overflow-y:auto;
  background:var(--hoja);
  border-right:1px solid var(--linea);
  padding:14px 0 40px 0;
}
.grupo-titulo{
  font-size:11px;font-weight:700;letter-spacing:.06em;
  color:var(--tinta-3);
  padding:16px 18px 6px 18px;
}
.grupo-titulo:first-child{padding-top:4px}
.rail a{
  display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:baseline;
  padding:7px 18px;text-decoration:none;color:var(--tinta-2);
  border-left:3px solid transparent;
}
.rail a:hover{background:var(--papel);color:var(--tinta)}
.rail a:focus-visible{outline:2px solid var(--marca);outline-offset:-2px}
.rail a .n{font-size:12px;color:var(--tinta-3);font-variant-numeric:tabular-nums}
.rail a .t{font-size:14px;line-height:1.35}
.rail a.activo{
  background:var(--marca-suave);border-left-color:var(--marca);
  color:var(--tinta);font-weight:600;
}
.rail a.activo .n{color:var(--marca)}
.rail a.oculto{display:none}
.sin-resultados{padding:14px 18px;font-size:13px;color:var(--tinta-3)}

main{flex:1 1 auto;min-width:0;padding:26px 30px 90px 30px}

/* ---------- cabecera del tema ---------- */
.cabeza{margin-bottom:20px}
.cabeza .eje{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  font-size:12.5px;color:var(--tinta-3);margin-bottom:6px;
}
.cabeza .eje .parte{color:var(--marca);font-weight:600}
h1{
  font-size:28px;line-height:1.2;letter-spacing:-.02em;font-weight:660;
  margin:0 0 8px 0;
}
h1 .num{color:var(--tinta-3);font-weight:400;font-variant-numeric:tabular-nums}
.cabeza p{margin:0;color:var(--tinta-2);max-width:68ch;font-size:15px}

/* ---------- pestanas ---------- */
.tabs{
  display:flex;gap:2px;
  border-bottom:1px solid var(--linea);
  margin:22px 0 0 0;
}
.tabs button{
  font:inherit;font-size:14px;font-weight:550;
  padding:9px 16px;cursor:pointer;
  background:transparent;color:var(--tinta-3);
  border:0;border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tabs button:hover{color:var(--tinta)}
.tabs button:focus-visible{outline:2px solid var(--marca);outline-offset:-3px}
.tabs button .cuenta{
  font-size:11px;margin-left:6px;padding:1px 6px;border-radius:9px;
  background:var(--papel);color:var(--tinta-3);
}
.tabs button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--marca)}
.tabs button[data-lang="py"][aria-selected="true"]{border-bottom-color:var(--py);color:var(--py)}
.tabs button[data-lang="py"][aria-selected="true"] .cuenta{background:var(--py-suave);color:var(--py)}
.tabs button[data-lang="r"][aria-selected="true"]{border-bottom-color:var(--r);color:var(--r)}
.tabs button[data-lang="r"][aria-selected="true"] .cuenta{background:var(--r-suave);color:var(--r)}

.panel{padding-top:22px}
.panel[hidden]{display:none}

/* ---------- prosa ---------- */
.prosa{max-width:74ch}
.prosa h3{font-size:17px;font-weight:650;letter-spacing:-.01em;margin:30px 0 8px 0}
.prosa h3:first-child{margin-top:0}
.prosa p{margin:0 0 12px 0}
.prosa ul,.prosa ol{margin:0 0 12px 0;padding-left:22px}
.prosa li{margin-bottom:5px}
.prosa strong{font-weight:650}
.prosa code{
  font-size:13px;background:var(--codigo-fondo);
  padding:1px 5px;border-radius:3px;border:1px solid var(--linea);
  color:var(--tinta);
}
.prosa pre{
  background:var(--codigo-fondo);
  border:1px solid var(--linea);
  border-left:3px solid var(--linea-fuerte);
  border-radius:3px;
  padding:12px 14px;margin:0 0 14px 0;
  overflow-x:auto;font-size:13px;line-height:1.55;
}
.prosa pre code{background:none;border:0;padding:0;font-size:inherit}
.prosa table{
  border-collapse:collapse;width:100%;margin:0 0 16px 0;font-size:14px;
  display:block;overflow-x:auto;
}
.prosa th,.prosa td{
  border:1px solid var(--linea);padding:6px 10px;text-align:left;vertical-align:top;
}
.prosa th{background:var(--papel);font-weight:650;font-size:13px}
.divisor{border:0;border-top:1px solid var(--linea);margin:34px 0}
.rotulo-seccion{
  font-size:11.5px;font-weight:700;letter-spacing:.05em;
  color:var(--tinta-3);margin-bottom:14px;
}

/* ---------- bloques de codigo ---------- */
.bloque{
  background:var(--hoja);
  border:1px solid var(--linea);
  border-radius:4px;
  margin-bottom:20px;
  overflow:hidden;
}
.bloque > header{
  position:static;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 13px;
  background:var(--hoja);
  border:0;border-bottom:1px solid var(--linea);
}
.bloque-titulo{font-size:14px;font-weight:600;margin:0;flex:1 1 auto;min-width:0}
.origen{
  font-size:11.5px;padding:2px 8px;border-radius:3px;white-space:nowrap;
}
.origen.curso{background:var(--py-suave);color:var(--py)}
.origen.agregado{background:var(--papel);color:var(--tinta-3);border:1px solid var(--linea)}
.copiar{
  font:inherit;font-size:12px;padding:4px 11px;cursor:pointer;
  background:var(--papel);color:var(--tinta-2);
  border:1px solid var(--linea);border-radius:3px;
  transition:background .12s ease,color .12s ease;
}
.copiar:hover{background:var(--marca-suave);color:var(--marca);border-color:var(--marca)}
.copiar:focus-visible{outline:2px solid var(--marca);outline-offset:1px}
.copiar.listo{background:var(--py-suave);color:var(--py);border-color:var(--py)}
.bloque pre{
  margin:0;padding:14px 16px;overflow-x:auto;
  background:var(--codigo-fondo);
  font-size:13px;line-height:1.58;
  tab-size:4;
}
.kw{color:var(--kw);font-weight:600}
.st{color:var(--st)}
.cm{color:var(--cm);font-style:italic}
.nm{color:var(--nm)}
.fn{color:var(--fn)}

.aviso{
  font-size:13.5px;color:var(--tinta-2);
  background:var(--papel);border:1px solid var(--linea);
  border-left:3px solid var(--linea-fuerte);
  border-radius:3px;padding:10px 13px;margin-bottom:20px;max-width:74ch;
}

@media (max-width:900px){
  .btn-menu{display:block}
  .cuerpo{display:block}
  nav.rail{
    display:none;width:auto;position:static;height:auto;
    border-right:0;border-bottom:1px solid var(--linea);
  }
  nav.rail.abierto{display:block}
  main{padding:20px 18px 70px 18px}
  h1{font-size:23px}
  .buscador{margin-left:0;max-width:none;order:3;flex-basis:100%}
  .pista{display:none}
}

@media print{
  header,nav.rail,.tabs,.copiar,.pista,.btn-menu{display:none !important}
  body{background:#fff;font-size:11pt}
  main{padding:0}
  .panel[hidden]{display:block !important}
  .bloque,.prosa pre{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>

<script id="datos" type="application/json">{"temas": [{"num": "01", "slug": "fundamentos", "parte": "Fundamentos", "titulo": "Axioma de los datos y tipos de aprendizaje", "resumen": "Supuesto iid, supervisado vs no supervisado, simulación de datos.", "clases": "Clase 1, Clase 10", "teoria": "<h3>Idea central</h3>\n<p>Todo algoritmo de Machine Learning se apoya en el mismo supuesto estadístico: los datos son\n<strong>realizaciones independientes e idénticamente distribuidas</strong> de un modelo de probabilidad\nmultivariado que describe el comportamiento poblacional que se quiere generalizar.</p>\n<p>La factorización básica que usa el profesor es:</p>\n<pre><code>P_XY(x, y) = P_X(x) * P_Y(y | x)\n</code></pre>\n<h3>Las dos ramas del curso</h3>\n<p><strong>Aprendizaje supervisado.</strong> Existe una variable de respuesta Y. El objetivo es encontrar una\nfunción f que, dado X, prediga Y lo mejor posible. La parte P_Y(y|x) es la que interesa.\nLa función óptima es f_optima(x) = E[Y | X = x].</p>\n<p><strong>Aprendizaje no supervisado.</strong> No hay Y. El objetivo es encontrar patrones en la distribución\nmultivariada de X en R^p. La parte P_X(x) es la que interesa. De aquí salen los dos grandes\nbloques del corte: clustering y reducción de dimensiones.</p>\n<h3>Caso de datos por grupos</h3>\n<p>Cuando los datos vienen de grupos, la densidad se vuelve una mezcla:</p>\n<pre><code>f(x) = p1 * f1(x | clase 1) + p2 * f2(x | clase 2) + ...\n</code></pre>\n<p>Esta es exactamente la estructura que los algoritmos de clustering intentan recuperar sin\nconocer las etiquetas. Es importante para el parcial: el clustering es un problema de estimar\nuna mezcla, no de clasificar.</p>\n<h3>Descomposición del error (aparece en la parte supervisada)</h3>\n<pre><code>Y = f_optima(X) + epsilon,   con E[epsilon] = 0 y Var(epsilon) = sigma^2\n</code></pre>\n<p>El término sigma^2 es el <strong>error irreducible</strong>. Ningún modelo puede bajar de ahí.</p>", "relacion": "<p>El código de esta clase no estima nada, <strong>simula</strong>. Sirve para entender de donde vienen los datos.</p>\n<ul>\n<li>La función <code>f(x)</code> del notebook es la <code>f_optima</code>, es decir, la media condicional E[Y|X=x].\n  Es la curva roja que se dibuja en todos los gráficos de la parte supervisada.</li>\n<li><code>np.random.normal(0, sd, n)</code> genera el error irreducible epsilon. El parámetro <code>sd</code> controla\n  sigma, que es el piso del MSE.</li>\n<li>El bloque que mezcla <code>m1</code> y <code>m2</code> con probabilidades <code>p1</code> y <code>p2</code> construye a mano la mezcla de\n  densidades por grupos. Esos son los datos que después se le pasan a K-Means.</li>\n<li>Generar dos muestras pequeñas (<code>x1, y1</code> y <code>x2, y2</code>) y graficarlas lado a lado muestra la\n  varianza del estimador: con n pequeño, dos muestras de la misma población se ven muy distintas.</li>\n</ul>", "python": [{"titulo": "Simulación supervisada: f_optima más ruido", "origen": "Del curso, class10_book1_intro.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nimport random\nimport math\n\n# Parámetros para generar la función de media (los puede cambiar)\na = 0.3\nb = 0.2\n\n# Definición de la función f_optima\ndef f(x):\n    z = 2 + x**(a) * math.cos(x/b)\n    return(z)\n\n# Visualización de la función f_optima\npoints = np.arange(1.0, 5.0, 0.01)\nf_mean = np.frompyfunc(f, 1, 1)\nplt.plot(points, f_mean(points))\n\n# Generación de datos de entrenamiento\nn = 400                              # Tamaño de muestra\nx = np.random.uniform(1.0, 5.0, n)   # Generación de X\nsd = 1.2                             # Desviación estándar del error irreducible\ny = f_mean(x) + np.random.normal(0, sd, n)\n\nplt.plot(x, y, 'o')"}, {"titulo": "Efecto del tamaño de muestra en la varianza", "origen": "Del curso, class10_book1_intro.ipynb", "code": "n = 10   # Muestra pequeña\n\nx1 = np.random.uniform(1.0, 5.0, n)\nx2 = np.random.uniform(1.0, 5.0, n)\n\nsd = 1.2\ny1 = f_mean(x1) + np.random.normal(0, sd, n)\ny2 = f_mean(x2) + np.random.normal(0, sd, n)\n\nfig, axs = plt.subplots(1, 2, figsize=(10, 8))\naxs[0].plot(x1, y1, 'o')\naxs[0].set_title('Muestra 1')\naxs[1].plot(x2, y2, 'o', color=\"red\")\naxs[1].set_title('Muestra 2')\nplt.tight_layout()\nplt.show()"}, {"titulo": "Simulación no supervisada: normal multivariada y mezcla por grupos", "origen": "Del curso, class1_book1_intro.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nimport random\n\n# Vector de medias y matriz de covarianza\nmean = np.array([0.0, 0.0])\ncov = np.array([[1.0, 0.5],\n                [0.5, 1.0]])\n\nrng = np.random.default_rng(seed=42)\nn = 100\n\ndata = rng.multivariate_normal(mean, cov, size=n)\nplt.scatter(data[:, 0], data[:, 1], color='blue', marker='o')\n\n# Ahora los datos forman grupos (mezcla de densidades)\np1 = 0.6\np2 = 0.4\n\nm1 = np.array([0.0, 1.0])\nm2 = np.array([4.5, 6.0])\n\ndata2 = np.zeros((n, 2))\n\nfor i in range(n):\n    u = random.random()\n    if u < p1:\n        data2[i, :] = rng.multivariate_normal(m1, cov, size=1)\n    else:\n        data2[i, :] = rng.multivariate_normal(m2, cov, size=1)\n\nplt.scatter(data2[:, 0], data2[:, 1], color='blue', marker='o')"}], "r": [{"titulo": "Equivalente en R de la simulación", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Simulación supervisada\na <- 0.3\nb <- 0.2\nf <- function(x) 2 + x^a * cos(x/b)\n\nn <- 400\nx <- runif(n, 1, 5)\nsd_err <- 1.2\ny <- f(x) + rnorm(n, 0, sd_err)\n\nplot(x, y, pch = 16, cex = 0.6)\ncurve(f, from = 1, to = 5, col = \"red\", lwd = 2, add = TRUE)\n\n\n# Simulación no supervisada: mezcla de dos normales bivariadas\nlibrary(MASS)\n\nmu1 <- c(0, 1)\nmu2 <- c(4.5, 6)\nSigma <- matrix(c(1, 0.5, 0.5, 1), nrow = 2)\n\nn <- 100\np1 <- 0.6\ngrupo <- ifelse(runif(n) < p1, 1, 2)\n\ndatos <- matrix(0, nrow = n, ncol = 2)\nfor (i in 1:n) {\n  if (grupo[i] == 1) {\n    datos[i, ] <- mvrnorm(1, mu1, Sigma)\n  } else {\n    datos[i, ] <- mvrnorm(1, mu2, Sigma)\n  }\n}\n\nplot(datos, col = grupo, pch = 16)"}], "busqueda": "01 axioma de los datos y tipos de aprendizaje supuesto iid, supervisado vs no supervisado, simulacion de datos. fundamentos clase 1, clase 10  idea central \n todo algoritmo de machine learning se apoya en el mismo supuesto estadistico: los datos son\n realizaciones independientes e identicamente distribuidas  de un modelo de probabilidad\nmultivariado que describe el comportamiento poblacional que se quiere generalizar. \n la factorizacion basica que usa el profesor es: \n  p_xy(x, y) = p_x(x) * p_y(y | x)\n  \n las dos ramas del curso \n  aprendizaje supervisado.  existe una variable de respuesta y. el objetivo es encontrar una\nfuncion f que, dado x, prediga y lo mejor posible. la parte p_y(y|x) es la que interesa.\nla funcion optima es f_optima(x) = e[y | x = x]. \n  aprendizaje no supervisado.  no hay y. el objetivo es encontrar patrones en la distribucion\nmultivariada de x en r^p. la parte p_x(x) es la que interesa. de aqui salen los dos grandes\nbloques del corte: clustering y reduccion de dimensiones. \n caso de datos por grupos \n cuando los datos vienen de grupos, la densidad se vuelve una mezcla: \n  f(x) = p1 * f1(x | clase 1) + p2 * f2(x | clase 2) + ...\n  \n esta es exactamente la estructura que los algoritmos de clustering intentan recuperar sin\nconocer las etiquetas. es importante para el parcial: el clustering es un problema de estimar\nuna mezcla, no de clasificar. \n descomposicion del error (aparece en la parte supervisada) \n  y = f_optima(x) + epsilon,   con e[epsilon] = 0 y var(epsilon) = sigma^2\n  \n el termino sigma^2 es el  error irreducible . ningun modelo puede bajar de ahi.  simulacion supervisada: f_optima mas ruido import numpy as np\nimport matplotlib.pyplot as plt\nimport random\nimport math\n\n# parametros para generar la funcion de media (los puede cambiar)\na = 0.3\nb = 0.2\n\n# definicion de la funcion f_optima\ndef f(x):\n    z = 2 + x**(a) * math.cos(x/b)\n    return(z)\n\n# visualizacion de la funcion f_optima\npoints = np.arange(1.0, 5.0, 0.01)\nf_mean = np.frompyfunc(f, 1, 1)\nplt.plot(points, f_mean(points))\n\n# generacion de datos de entrenamiento\nn = 400                              # tamano de muestra\nx = np.random.uniform(1.0, 5.0, n)   # generacion de x\nsd = 1.2                             # desviacion estandar del error irreducible\ny = f_mean(x) + np.random.normal(0, sd, n)\n\nplt.plot(x, y, 'o') efecto del tamano de muestra en la varianza n = 10   # muestra pequena\n\nx1 = np.random.uniform(1.0, 5.0, n)\nx2 = np.random.uniform(1.0, 5.0, n)\n\nsd = 1.2\ny1 = f_mean(x1) + np.random.normal(0, sd, n)\ny2 = f_mean(x2) + np.random.normal(0, sd, n)\n\nfig, axs = plt.subplots(1, 2, figsize=(10, 8))\naxs[0].plot(x1, y1, 'o')\naxs[0].set_title('muestra 1')\naxs[1].plot(x2, y2, 'o', color=\"red\")\naxs[1].set_title('muestra 2')\nplt.tight_layout()\nplt.show() simulacion no supervisada: normal multivariada y mezcla por grupos import numpy as np\nimport matplotlib.pyplot as plt\nimport random\n\n# vector de medias y matriz de covarianza\nmean = np.array([0.0, 0.0])\ncov = np.array([[1.0, 0.5],\n                [0.5, 1.0]])\n\nrng = np.random.default_rng(seed=42)\nn = 100\n\ndata = rng.multivariate_normal(mean, cov, size=n)\nplt.scatter(data[:, 0], data[:, 1], color='blue', marker='o')\n\n# ahora los datos forman grupos (mezcla de densidades)\np1 = 0.6\np2 = 0.4\n\nm1 = np.array([0.0, 1.0])\nm2 = np.array([4.5, 6.0])\n\ndata2 = np.zeros((n, 2))\n\nfor i in range(n):\n    u = random.random()\n    if u < p1:\n        data2[i, :] = rng.multivariate_normal(m1, cov, size=1)\n    else:\n        data2[i, :] = rng.multivariate_normal(m2, cov, size=1)\n\nplt.scatter(data2[:, 0], data2[:, 1], color='blue', marker='o') equivalente en r de la simulacion # simulacion supervisada\na <- 0.3\nb <- 0.2\nf <- function(x) 2 + x^a * cos(x/b)\n\nn <- 400\nx <- runif(n, 1, 5)\nsd_err <- 1.2\ny <- f(x) + rnorm(n, 0, sd_err)\n\nplot(x, y, pch = 16, cex = 0.6)\ncurve(f, from = 1, to = 5, col = \"red\", lwd = 2, add = true)\n\n\n# simulacion no supervisada: mezcla de dos normales bivariadas\nlibrary(mass)\n\nmu1 <- c(0, 1)\nmu2 <- c(4.5, 6)\nsigma <- matrix(c(1, 0.5, 0.5, 1), nrow = 2)\n\nn <- 100\np1 <- 0.6\ngrupo <- ifelse(runif(n) < p1, 1, 2)\n\ndatos <- matrix(0, nrow = n, ncol = 2)\nfor (i in 1:n) {\n  if (grupo[i] == 1) {\n    datos[i, ] <- mvrnorm(1, mu1, sigma)\n  } else {\n    datos[i, ] <- mvrnorm(1, mu2, sigma)\n  }\n}\n\nplot(datos, col = grupo, pch = 16)"}, {"num": "02", "slug": "kmeans", "parte": "Clustering", "titulo": "K-Means", "resumen": "Centroides, algoritmo greedy, SSE, escalamiento, método del codo.", "clases": "Clase 2, Clase 3", "teoria": "<h3>Qué resuelve</h3>\n<p>Se fija un número de clusters K y se busca asignar cada punto a un grupo de forma que se minimice\nla suma de distancias de los puntos al centro de su grupo (máxima coherencia interna):</p>\n<pre><code>min  sum_{k=1}^{K}  sum_{x_i en cluster k}  || x_i - c_k ||^2\n</code></pre>\n<p>El centroide es el promedio muestral del grupo:</p>\n<pre><code>c_k = (1 / n_k) * sum_{x_i en cluster k} x_i = xbar_k\n</code></pre>\n<h3>Dos equivalencias que suele preguntar</h3>\n<p><strong>1. Distancias al centro igual a distancias por pares.</strong> Al usar el promedio como centroide:</p>\n<pre><code>sum_{x en cluster k} ||x - xbar_k||^2  =  (1 / 2 n_k) * sum_{x,y en cluster k} ||x - y||^2\n</code></pre>\n<p><strong>2. Descomposición ANOVA.</strong> La suma total de cuadrados se parte en dos:</p>\n<pre><code>SST = BSS + WSS\nsum_i ||x_i - Xbar||^2 = sum_k n_k ||xbar_k - Xbar||^2 + sum_k sum_{x en k} ||x - xbar_k||^2\n</code></pre>\n<p>SST no depende de la partición. Entonces <strong>minimizar WSS es equivalente a maximizar BSS</strong>.\nEso conecta coherencia interna con separación entre grupos en un solo criterio.</p>\n<h3>Complejidad</h3>\n<p>El problema exacto es <strong>NP-Hard</strong> cuando p &gt; 2 y no escala en n. Por eso se usa una heurística\n<strong>greedy</strong>: se alternan dos pasos hasta que el SSE deje de cambiar.</p>\n<ol>\n<li>Dado el conjunto de centros, asignar cada punto al centro más cercano.</li>\n<li>Dada la asignación, recalcular los centros como promedio.</li>\n</ol>\n<p>Como puede caer en mínimos locales, se repite con varias inicializaciones aleatorias y se escoge\nla mejor. En sklearn eso es <code>n_init</code>.</p>\n<h3>Problemas del método</h3>\n<ol>\n<li>La separación se mide por la distancia entre centros, pero hay riesgo de traslape en las\n   fronteras internas.</li>\n<li>Los clusters tienden a tener forma regular (bolas en p dimensiones). Con formas irregulares\n   falla.</li>\n<li><strong>No es robusto</strong> a datos atípicos, porque el promedio se corre con un solo outlier.</li>\n<li><strong>Depende de la escala</strong>. Si las variables están en unidades distintas, la variable con mayor\n   rango domina la distancia. Por eso se estandariza antes de correr el algoritmo.</li>\n</ol>\n<h3>Selección de K</h3>\n<ol>\n<li><strong>Método del codo</strong>: se gráfica el SSE (o la inercia) contra K y se busca el punto donde la\n   ganancia marginal se aplana.</li>\n<li><strong>Métricas externas al algoritmo</strong>: Silhouette, Calinski-Harabasz, Davies-Bouldin. Ver tema 03.</li>\n</ol>", "relacion": "<p>El notebook implementa el algoritmo <strong>dos veces</strong>: a mano y con sklearn. Vale la pena tener las dos,\nporque un parcial puede pedir el paso intermedio.</p>\n<p>Mapa entre teoría y código de la versión manual:</p>\n<table>\n<thead>\n<tr>\n<th>Concepto</th>\n<th>Objeto en el código</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Asignación z_ik</td>\n<td><code>assign_matrix</code>, matriz n por K de ceros y unos</td>\n</tr>\n<tr>\n<td>n_k</td>\n<td><code>n_group = sum(assign_matrix)</code></td>\n</tr>\n<tr>\n<td>Centroides c_k</td>\n<td><code>means = np.matmul(X.T, assign_matrix) / n_group</code>, matriz p por K</td>\n</tr>\n<tr>\n<td>Distancias al centro</td>\n<td><code>dista</code>, matriz n por K</td>\n</tr>\n<tr>\n<td>WSS o SSE</td>\n<td><code>np.sum(np.diag(np.matmul(dista.T, assign_matrix)))</code></td>\n</tr>\n<tr>\n<td>Paso de asignación</td>\n<td><code>assign_matrix[i, np.argmin(dista[i,:])] = 1</code></td>\n</tr>\n<tr>\n<td>Criterio de parada</td>\n<td><code>change = sse_hist[-2] - sse</code> comparado contra <code>tol</code></td>\n</tr>\n</tbody>\n</table>\n<p>Detalle útil: <code>np.diag(dista.T @ assign_matrix)</code> toma, para cada punto, solo la distancia al grupo\nal que quedó asignado. Sumar esa diagonal es exactamente el WSS.</p>\n<p>En la versión con sklearn, <code>kmeans.cluster_centers_</code> son los centroides (una fila por grupo, o sea\nla transpuesta de <code>means</code>) y <code>kmeans.labels_</code> son las etiquetas. El escalamiento se hace con\n<code>scale()</code> de <code>sklearn.preprocessing</code> antes de ajustar.</p>", "python": [{"titulo": "K-Means paso a paso (implementación manual)", "origen": "Del curso, class2_book1_kmeans.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\nfrom scipy.stats import multinomial\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\n# Datos a trabajar: IRIS\niris = load_iris()\nX = iris.data\n\nn = np.shape(X)[0]   # tamaño de muestra\np = np.shape(X)[1]   # número de variables\nK = 3                # número de clusters\n\n# Asignación aleatoria inicial de cada observación a un grupo\nprobabilities = [1/K]*K\nassign_matrix = multinomial.rvs(n=1, p=probabilities, size=n, random_state=42)\n\n# Tamaños de grupo y matriz de medias inicial (p x K)\nn_group = sum(assign_matrix)\nmeans = np.matmul(X.T, assign_matrix)/n_group\n\n# Matriz de distancias de cada punto a cada centro (n x K)\ndista = np.zeros((n, K))\nfor i in range(K):\n    dista[:, i] = np.sum((X-means[:, i])*(X-means[:, i]), axis=1)\n\n# Loop principal del algoritmo\ntol = 0.00001\nsse_hist = [np.sum(np.diag(np.matmul(dista.T, assign_matrix)))]\nchange = 10000\n\nwhile change > tol:\n    n_group = sum(assign_matrix)\n    means = np.matmul(X.T, assign_matrix)/n_group\n\n    dista = np.zeros((n, K))\n    for i in range(K):\n        dista[:, i] = np.sum((X-means[:, i])*(X-means[:, i]), axis=1)\n\n    assign_matrix = np.zeros((n, K))\n    for i in range(n):\n        assign_matrix[i, np.argmin(dista[i, :])] = 1\n\n    sse = np.sum(np.diag(np.matmul(dista.T, assign_matrix)))\n    sse_hist.append(sse)\n    change = sse_hist[-2] - sse\n\n# Convergencia del SSE\nplt.plot(sse_hist)\nplt.xlabel(\"Iteración\")\nplt.ylabel(\"SSE\")\n\n# Grupos encontrados\ncol = np.matmul(assign_matrix, [1, 5, 8])\nplt.scatter(X[:, 2], X[:, 3], c=col, alpha=0.7)"}, {"titulo": "K-Means con scikit-learn y escalamiento", "origen": "Del curso, class2_book1_kmeans.ipynb", "code": "from sklearn.cluster import KMeans\nfrom sklearn.preprocessing import scale\n\n# Sin escalar\nkmeans = KMeans(n_clusters=K, random_state=0)\nkmeans.fit(X)\n\nassign = kmeans.fit_predict(X)\ncentroids = kmeans.cluster_centers_   # cada FILA es la media de un grupo\ny_kmeans = kmeans.labels_\n\nplt.scatter(X[:, 2], X[:, 3], c=y_kmeans, alpha=0.7)\n\n# Escalando las variables (importante si están en unidades distintas)\nXs = scale(datasets.load_iris().data)\n\nkmeans_s = KMeans(n_clusters=K, random_state=0)\nkmeans_s.fit(Xs)\n\nassign_s = kmeans_s.fit_predict(Xs)\ncentroids_s = kmeans_s.cluster_centers_\ny_kmeans_s = kmeans_s.labels_\n\nplt.scatter(Xs[:, 2], Xs[:, 3], c=y_kmeans_s, alpha=0.7)"}, {"titulo": "Método del codo para escoger K", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.cluster import KMeans\nimport matplotlib.pyplot as plt\n\nsse_por_k = []\nrango_k = range(1, 11)\n\nfor k in rango_k:\n    modelo = KMeans(n_clusters=k, n_init=10, random_state=0)\n    modelo.fit(Xs)\n    sse_por_k.append(modelo.inertia_)   # inertia_ es el WSS\n\nplt.plot(list(rango_k), sse_por_k, marker='o')\nplt.xlabel(\"Número de clusters K\")\nplt.ylabel(\"SSE (within)\")\nplt.title(\"Método del codo\")\nplt.show()"}], "r": [{"titulo": "K-Means en R con escalamiento y codo", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Datos\nX <- iris[, 1:4]\n\n# Escalar es fundamental si las unidades difieren\nXs <- scale(X)\n\n# K-Means con 3 grupos y 25 inicializaciones aleatorias\nset.seed(0)\nkm <- kmeans(Xs, centers = 3, nstart = 25)\n\nkm$centers        # centroides (una fila por grupo)\nkm$cluster        # etiquetas de cada observación\nkm$tot.withinss   # WSS total = SSE\nkm$betweenss      # BSS\nkm$totss          # SST = BSS + WSS\n\nplot(Xs[, 3], Xs[, 4], col = km$cluster, pch = 16)\npoints(km$centers[, 3], km$centers[, 4], col = 1:3, pch = 8, cex = 2)\n\n\n# Método del codo\nsse <- rep(0, 10)\nfor (k in 1:10) {\n  sse[k] <- kmeans(Xs, centers = k, nstart = 25)$tot.withinss\n}\nplot(1:10, sse, type = \"b\", xlab = \"K\", ylab = \"SSE (within)\")"}], "busqueda": "02 k-means centroides, algoritmo greedy, sse, escalamiento, metodo del codo. clustering clase 2, clase 3  que resuelve \n se fija un numero de clusters k y se busca asignar cada punto a un grupo de forma que se minimice\nla suma de distancias de los puntos al centro de su grupo (maxima coherencia interna): \n  min  sum_{k=1}^{k}  sum_{x_i en cluster k}  || x_i - c_k ||^2\n  \n el centroide es el promedio muestral del grupo: \n  c_k = (1 / n_k) * sum_{x_i en cluster k} x_i = xbar_k\n  \n dos equivalencias que suele preguntar \n  1. distancias al centro igual a distancias por pares.  al usar el promedio como centroide: \n  sum_{x en cluster k} ||x - xbar_k||^2  =  (1 / 2 n_k) * sum_{x,y en cluster k} ||x - y||^2\n  \n  2. descomposicion anova.  la suma total de cuadrados se parte en dos: \n  sst = bss + wss\nsum_i ||x_i - xbar||^2 = sum_k n_k ||xbar_k - xbar||^2 + sum_k sum_{x en k} ||x - xbar_k||^2\n  \n sst no depende de la particion. entonces  minimizar wss es equivalente a maximizar bss .\neso conecta coherencia interna con separacion entre grupos en un solo criterio. \n complejidad \n el problema exacto es  np-hard  cuando p &gt; 2 y no escala en n. por eso se usa una heuristica\n greedy : se alternan dos pasos hasta que el sse deje de cambiar. \n \n dado el conjunto de centros, asignar cada punto al centro mas cercano. \n dada la asignacion, recalcular los centros como promedio. \n \n como puede caer en minimos locales, se repite con varias inicializaciones aleatorias y se escoge\nla mejor. en sklearn eso es  n_init . \n problemas del metodo \n \n la separacion se mide por la distancia entre centros, pero hay riesgo de traslape en las\n   fronteras internas. \n los clusters tienden a tener forma regular (bolas en p dimensiones). con formas irregulares\n   falla. \n  no es robusto  a datos atipicos, porque el promedio se corre con un solo outlier. \n  depende de la escala . si las variables estan en unidades distintas, la variable con mayor\n   rango domina la distancia. por eso se estandariza antes de correr el algoritmo. \n \n seleccion de k \n \n  metodo del codo : se grafica el sse (o la inercia) contra k y se busca el punto donde la\n   ganancia marginal se aplana. \n  metricas externas al algoritmo : silhouette, calinski-harabasz, davies-bouldin. ver tema 03. \n  k-means paso a paso (implementacion manual) import numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\nfrom scipy.stats import multinomial\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\n# datos a trabajar: iris\niris = load_iris()\nx = iris.data\n\nn = np.shape(x)[0]   # tamano de muestra\np = np.shape(x)[1]   # numero de variables\nk = 3                # numero de clusters\n\n# asignacion aleatoria inicial de cada observacion a un grupo\nprobabilities = [1/k]*k\nassign_matrix = multinomial.rvs(n=1, p=probabilities, size=n, random_state=42)\n\n# tamanos de grupo y matriz de medias inicial (p x k)\nn_group = sum(assign_matrix)\nmeans = np.matmul(x.t, assign_matrix)/n_group\n\n# matriz de distancias de cada punto a cada centro (n x k)\ndista = np.zeros((n, k))\nfor i in range(k):\n    dista[:, i] = np.sum((x-means[:, i])*(x-means[:, i]), axis=1)\n\n# loop principal del algoritmo\ntol = 0.00001\nsse_hist = [np.sum(np.diag(np.matmul(dista.t, assign_matrix)))]\nchange = 10000\n\nwhile change > tol:\n    n_group = sum(assign_matrix)\n    means = np.matmul(x.t, assign_matrix)/n_group\n\n    dista = np.zeros((n, k))\n    for i in range(k):\n        dista[:, i] = np.sum((x-means[:, i])*(x-means[:, i]), axis=1)\n\n    assign_matrix = np.zeros((n, k))\n    for i in range(n):\n        assign_matrix[i, np.argmin(dista[i, :])] = 1\n\n    sse = np.sum(np.diag(np.matmul(dista.t, assign_matrix)))\n    sse_hist.append(sse)\n    change = sse_hist[-2] - sse\n\n# convergencia del sse\nplt.plot(sse_hist)\nplt.xlabel(\"iteracion\")\nplt.ylabel(\"sse\")\n\n# grupos encontrados\ncol = np.matmul(assign_matrix, [1, 5, 8])\nplt.scatter(x[:, 2], x[:, 3], c=col, alpha=0.7) k-means con scikit-learn y escalamiento from sklearn.cluster import kmeans\nfrom sklearn.preprocessing import scale\n\n# sin escalar\nkmeans = kmeans(n_clusters=k, random_state=0)\nkmeans.fit(x)\n\nassign = kmeans.fit_predict(x)\ncentroids = kmeans.cluster_centers_   # cada fila es la media de un grupo\ny_kmeans = kmeans.labels_\n\nplt.scatter(x[:, 2], x[:, 3], c=y_kmeans, alpha=0.7)\n\n# escalando las variables (importante si estan en unidades distintas)\nxs = scale(datasets.load_iris().data)\n\nkmeans_s = kmeans(n_clusters=k, random_state=0)\nkmeans_s.fit(xs)\n\nassign_s = kmeans_s.fit_predict(xs)\ncentroids_s = kmeans_s.cluster_centers_\ny_kmeans_s = kmeans_s.labels_\n\nplt.scatter(xs[:, 2], xs[:, 3], c=y_kmeans_s, alpha=0.7) metodo del codo para escoger k from sklearn.cluster import kmeans\nimport matplotlib.pyplot as plt\n\nsse_por_k = []\nrango_k = range(1, 11)\n\nfor k in rango_k:\n    modelo = kmeans(n_clusters=k, n_init=10, random_state=0)\n    modelo.fit(xs)\n    sse_por_k.append(modelo.inertia_)   # inertia_ es el wss\n\nplt.plot(list(rango_k), sse_por_k, marker='o')\nplt.xlabel(\"numero de clusters k\")\nplt.ylabel(\"sse (within)\")\nplt.title(\"metodo del codo\")\nplt.show() k-means en r con escalamiento y codo # datos\nx <- iris[, 1:4]\n\n# escalar es fundamental si las unidades difieren\nxs <- scale(x)\n\n# k-means con 3 grupos y 25 inicializaciones aleatorias\nset.seed(0)\nkm <- kmeans(xs, centers = 3, nstart = 25)\n\nkm$centers        # centroides (una fila por grupo)\nkm$cluster        # etiquetas de cada observacion\nkm$tot.withinss   # wss total = sse\nkm$betweenss      # bss\nkm$totss          # sst = bss + wss\n\nplot(xs[, 3], xs[, 4], col = km$cluster, pch = 16)\npoints(km$centers[, 3], km$centers[, 4], col = 1:3, pch = 8, cex = 2)\n\n\n# metodo del codo\nsse <- rep(0, 10)\nfor (k in 1:10) {\n  sse[k] <- kmeans(xs, centers = k, nstart = 25)$tot.withinss\n}\nplot(1:10, sse, type = \"b\", xlab = \"k\", ylab = \"sse (within)\")"}, {"num": "03", "slug": "silhouette", "parte": "Clustering", "titulo": "Silhouette y métricas de ajuste", "resumen": "s(i), Calinski-Harabasz, Davies-Bouldin, elección de K.", "clases": "Clase 3, Clase 4", "teoria": "<h3>Para qué sirve</h3>\n<p>El algoritmo de clustering optimiza su propio criterio interno, así que el SSE no sirve para\ncomparar K distintos (siempre baja cuando K sube). Las métricas de ajuste son <strong>externas al\nalgoritmo</strong> y permiten comparar soluciones con distinto número de grupos o con distintos métodos.</p>\n<h3>Silhouette</h3>\n<p>Se calcula <strong>para cada observación</strong> x_i:</p>\n<pre><code>a(i) = distancia promedio de x_i a los demás puntos de SU cluster  C_I\nb(i) = distancia promedio de x_i a los puntos del cluster más cercano distinto  C_k\n\n              b(i) - a(i)\ns(i) = ---------------------\n          max{ a(i) , b(i) }\n</code></pre>\n<p>Propiedades:</p>\n<ul>\n<li>Siempre se cumple <strong>-1 &lt;= s(i) &lt;= 1</strong>.</li>\n<li>s(i) cerca de 1: el punto está mucho más cerca de su grupo que del vecino. Buena asignación.</li>\n<li>s(i) cerca de 0: el punto está en la frontera entre dos grupos.</li>\n<li>s(i) negativo: el punto está <strong>más cerca de otro grupo</strong> que del propio. Mala asignación.</li>\n</ul>\n<p>El Silhouette global es el promedio de los s(i). Para escoger K se corre el algoritmo con varios\nvalores y se toma el K con mayor Silhouette promedio.</p>\n<p>El gráfico de Silhouette ordena los s(i) dentro de cada cluster. Un cluster con barras cortas o\nnegativas es un cluster mal formado.</p>\n<h3>Otras métricas</h3>\n<p><strong>Calinski-Harabasz.</strong> Razón entre dispersión entre grupos y dispersión dentro de grupos,\najustada por grados de libertad. Es una idea tipo F de ANOVA.</p>\n<pre><code>CH = [ BSS / (K-1) ] / [ WSS / (n-K) ]\n</code></pre>\n<p>Se busca el <strong>máximo</strong>.</p>\n<p><strong>Davies-Bouldin.</strong> Para cada par de clusters compara la dispersión interna contra la separación\nde centros, y promedia el peor caso de cada cluster. Se busca el <strong>mínimo</strong>.</p>\n<h3>Regla práctica para el parcial</h3>\n<table>\n<thead>\n<tr>\n<th>Métrica</th>\n<th>Dirección buena</th>\n<th>Rango</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Silhouette</td>\n<td>máximo</td>\n<td>-1 a 1</td>\n</tr>\n<tr>\n<td>Calinski-Harabasz</td>\n<td>máximo</td>\n<td>0 a infinito</td>\n</tr>\n<tr>\n<td>Davies-Bouldin</td>\n<td>mínimo</td>\n<td>0 a infinito</td>\n</tr>\n</tbody>\n</table>", "relacion": "<p>Las tres métricas se calculan sobre <strong>los mismos dos argumentos</strong>: la matriz de datos y el vector\nde etiquetas. No necesitan el objeto del modelo.</p>\n<pre><code>silhouette_score(Xs, y_kmeans_s)\n</code></pre>\n<p>Importante: se pasan los datos <strong>en la misma escala en la que se corrió el algoritmo</strong>. Si\nagrupaste sobre <code>Xs</code> escalado, la métrica va sobre <code>Xs</code>, no sobre <code>X</code>.</p>\n<p>Para el gráfico se usa <code>SilhouetteVisualizer</code> de yellowbrick, que sí recibe el objeto del modelo\nporque necesita reajustarlo. Si yellowbrick no está disponible, <code>silhouette_samples</code> de sklearn\ndevuelve el vector de s(i) individuales y el gráfico se arma a mano.</p>", "python": [{"titulo": "Las tres métricas en una línea cada una", "origen": "Del curso, class2_book1_kmeans.ipynb", "code": "from sklearn.metrics import silhouette_score, calinski_harabasz_score, davies_bouldin_score\n\nsil = silhouette_score(Xs, y_kmeans_s)\nch = calinski_harabasz_score(Xs, y_kmeans_s)\ndb = davies_bouldin_score(Xs, y_kmeans_s)\n\nprint(f\"Clusters: {K} | Silhouette: {sil:.3f} | Calinski-Harabasz: {ch:.1f} | Davies-Bouldin: {db:.3f}\")"}, {"titulo": "Gráfico de Silhouette con yellowbrick", "origen": "Del curso, class2_book1_kmeans.ipynb", "code": "from sklearn.datasets import make_blobs\nfrom yellowbrick.cluster import SilhouetteVisualizer\n\nvisualizer = SilhouetteVisualizer(kmeans_s, colors='yellowbrick')\nvisualizer.fit(Xs)\nvisualizer.show()"}, {"titulo": "Escoger K comparando Silhouette (sin yellowbrick)", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.cluster import KMeans\nfrom sklearn.metrics import silhouette_score, silhouette_samples\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nresultados = []\nfor k in range(2, 11):\n    modelo = KMeans(n_clusters=k, n_init=10, random_state=0)\n    etiquetas = modelo.fit_predict(Xs)\n    resultados.append((k, silhouette_score(Xs, etiquetas)))\n    print(k, round(silhouette_score(Xs, etiquetas), 3))\n\nks = [r[0] for r in resultados]\nsils = [r[1] for r in resultados]\nplt.plot(ks, sils, marker='o')\nplt.xlabel(\"K\")\nplt.ylabel(\"Silhouette promedio\")\nplt.show()\n\n# Silhouette individual de cada observación (los s(i))\nmodelo = KMeans(n_clusters=3, n_init=10, random_state=0)\netiquetas = modelo.fit_predict(Xs)\ns_i = silhouette_samples(Xs, etiquetas)\n\n# Cuántos puntos quedaron mal asignados (s(i) negativo)\nprint(\"Puntos con s(i) < 0:\", np.sum(s_i < 0))"}], "r": [{"titulo": "Silhouette en R con el paquete cluster", "origen": "Equivalente agregado, no viene del material del curso", "code": "library(cluster)\n\nXs <- scale(iris[, 1:4])\ndis <- dist(Xs)            # matriz de distancias euclidianas\n\nset.seed(0)\nkm <- kmeans(Xs, centers = 3, nstart = 25)\n\nsil <- silhouette(km$cluster, dis)\nsummary(sil)               # promedio global y por cluster\nplot(sil, col = 1:3)       # gráfico de silhouette\n\nmean(sil[, 3])             # silhouette promedio\n\n\n# Escoger K comparando el silhouette promedio\npromedios <- rep(0, 10)\nfor (k in 2:10) {\n  kmk <- kmeans(Xs, centers = k, nstart = 25)\n  sk <- silhouette(kmk$cluster, dis)\n  promedios[k] <- mean(sk[, 3])\n}\nplot(2:10, promedios[2:10], type = \"b\", xlab = \"K\", ylab = \"Silhouette promedio\")\n\n\n# Calinski-Harabasz y Davies-Bouldin\nlibrary(fpc)\nest <- cluster.stats(dis, km$cluster)\nest$ch     # Calinski-Harabasz (se busca el máximo)\n\nlibrary(clusterSim)\nindex.DB(Xs, km$cluster)$DB   # Davies-Bouldin (se busca el mínimo)"}], "busqueda": "03 silhouette y metricas de ajuste s(i), calinski-harabasz, davies-bouldin, eleccion de k. clustering clase 3, clase 4  para que sirve \n el algoritmo de clustering optimiza su propio criterio interno, asi que el sse no sirve para\ncomparar k distintos (siempre baja cuando k sube). las metricas de ajuste son  externas al\nalgoritmo  y permiten comparar soluciones con distinto numero de grupos o con distintos metodos. \n silhouette \n se calcula  para cada observacion  x_i: \n  a(i) = distancia promedio de x_i a los demas puntos de su cluster  c_i\nb(i) = distancia promedio de x_i a los puntos del cluster mas cercano distinto  c_k\n\n              b(i) - a(i)\ns(i) = ---------------------\n          max{ a(i) , b(i) }\n  \n propiedades: \n \n siempre se cumple  -1 &lt;= s(i) &lt;= 1 . \n s(i) cerca de 1: el punto esta mucho mas cerca de su grupo que del vecino. buena asignacion. \n s(i) cerca de 0: el punto esta en la frontera entre dos grupos. \n s(i) negativo: el punto esta  mas cerca de otro grupo  que del propio. mala asignacion. \n \n el silhouette global es el promedio de los s(i). para escoger k se corre el algoritmo con varios\nvalores y se toma el k con mayor silhouette promedio. \n el grafico de silhouette ordena los s(i) dentro de cada cluster. un cluster con barras cortas o\nnegativas es un cluster mal formado. \n otras metricas \n  calinski-harabasz.  razon entre dispersion entre grupos y dispersion dentro de grupos,\najustada por grados de libertad. es una idea tipo f de anova. \n  ch = [ bss / (k-1) ] / [ wss / (n-k) ]\n  \n se busca el  maximo . \n  davies-bouldin.  para cada par de clusters compara la dispersion interna contra la separacion\nde centros, y promedia el peor caso de cada cluster. se busca el  minimo . \n regla practica para el parcial \n \n \n \n metrica \n direccion buena \n rango \n \n \n \n \n silhouette \n maximo \n -1 a 1 \n \n \n calinski-harabasz \n maximo \n 0 a infinito \n \n \n davies-bouldin \n minimo \n 0 a infinito \n \n \n  las tres metricas en una linea cada una from sklearn.metrics import silhouette_score, calinski_harabasz_score, davies_bouldin_score\n\nsil = silhouette_score(xs, y_kmeans_s)\nch = calinski_harabasz_score(xs, y_kmeans_s)\ndb = davies_bouldin_score(xs, y_kmeans_s)\n\nprint(f\"clusters: {k} | silhouette: {sil:.3f} | calinski-harabasz: {ch:.1f} | davies-bouldin: {db:.3f}\") grafico de silhouette con yellowbrick from sklearn.datasets import make_blobs\nfrom yellowbrick.cluster import silhouettevisualizer\n\nvisualizer = silhouettevisualizer(kmeans_s, colors='yellowbrick')\nvisualizer.fit(xs)\nvisualizer.show() escoger k comparando silhouette (sin yellowbrick) from sklearn.cluster import kmeans\nfrom sklearn.metrics import silhouette_score, silhouette_samples\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nresultados = []\nfor k in range(2, 11):\n    modelo = kmeans(n_clusters=k, n_init=10, random_state=0)\n    etiquetas = modelo.fit_predict(xs)\n    resultados.append((k, silhouette_score(xs, etiquetas)))\n    print(k, round(silhouette_score(xs, etiquetas), 3))\n\nks = [r[0] for r in resultados]\nsils = [r[1] for r in resultados]\nplt.plot(ks, sils, marker='o')\nplt.xlabel(\"k\")\nplt.ylabel(\"silhouette promedio\")\nplt.show()\n\n# silhouette individual de cada observacion (los s(i))\nmodelo = kmeans(n_clusters=3, n_init=10, random_state=0)\netiquetas = modelo.fit_predict(xs)\ns_i = silhouette_samples(xs, etiquetas)\n\n# cuantos puntos quedaron mal asignados (s(i) negativo)\nprint(\"puntos con s(i) < 0:\", np.sum(s_i < 0)) silhouette en r con el paquete cluster library(cluster)\n\nxs <- scale(iris[, 1:4])\ndis <- dist(xs)            # matriz de distancias euclidianas\n\nset.seed(0)\nkm <- kmeans(xs, centers = 3, nstart = 25)\n\nsil <- silhouette(km$cluster, dis)\nsummary(sil)               # promedio global y por cluster\nplot(sil, col = 1:3)       # grafico de silhouette\n\nmean(sil[, 3])             # silhouette promedio\n\n\n# escoger k comparando el silhouette promedio\npromedios <- rep(0, 10)\nfor (k in 2:10) {\n  kmk <- kmeans(xs, centers = k, nstart = 25)\n  sk <- silhouette(kmk$cluster, dis)\n  promedios[k] <- mean(sk[, 3])\n}\nplot(2:10, promedios[2:10], type = \"b\", xlab = \"k\", ylab = \"silhouette promedio\")\n\n\n# calinski-harabasz y davies-bouldin\nlibrary(fpc)\nest <- cluster.stats(dis, km$cluster)\nest$ch     # calinski-harabasz (se busca el maximo)\n\nlibrary(clustersim)\nindex.db(xs, km$cluster)$db   # davies-bouldin (se busca el minimo)"}, {"num": "04", "slug": "kmedoids", "parte": "Clustering", "titulo": "K-Medoides", "resumen": "Medoide en lugar de media, robustez, distancias no euclidianas, Gower.", "clases": "Clase 3", "teoria": "<h3>Qué cambia respecto a K-Means</h3>\n<p>Se reemplaza el promedio del grupo por el <strong>medoide</strong>: la observación de la muestra que es más\ncentral dentro del grupo. El centro deja de ser un punto artificial y pasa a ser un dato real.</p>\n<pre><code>medoide_k = argmin_{x_j en cluster k}  sum_{x_i en cluster k} d(x_i, x_j)\n</code></pre>\n<h3>Los dos efectos que gana</h3>\n<ol>\n<li>\n<p><strong>Robustez.</strong> Como el centro es una observación y no un promedio, un outlier ya no arrastra el\n   centro del grupo. K-Medoides es notablemente más resistente a datos atípicos que K-Means.</p>\n</li>\n<li>\n<p><strong>Generalización a coordenadas no euclidianas.</strong> El algoritmo solo necesita la <strong>matriz de\n   distancias</strong> entre pares, no las coordenadas. Eso permite usarlo con variables categóricas,\n   mixtas o con distancias no métricas. K-Means no puede hacer esto porque necesita calcular un\n   promedio, y el promedio de categorías no existe.</p>\n</li>\n</ol>\n<h3>Distancia de Gower</h3>\n<p>Es la distancia estándar para datos mixtos (continuos, ordinales, binarios, nominales). Normaliza\ncada variable a su rango y promedia las contribuciones. Es lo que habilita usar K-Medoides sobre\nbases con variables categóricas.</p>\n<h3>Costo</h3>\n<p>El algoritmo exacto (PAM) es más costoso que K-Means porque evalúa intercambios de medoides.\n<code>fasterpam</code> es una implementación eficiente de PAM.</p>", "relacion": "<p>El punto clave del código: <strong>la entrada no es X, es la matriz de distancias</strong>.</p>\n<pre><code>dista_s = distance_matrix(Xs, Xs)     # matriz n x n\nc = kmedoids.fasterpam(dista_s, 3)    # recibe distancias, no datos\n</code></pre>\n<p>Esto es lo que hace que el método se pueda generalizar. Cambiando la forma de calcular la matriz\nde distancias, se cambia el tipo de datos que el algoritmo acepta, sin tocar el algoritmo:</p>\n<ul>\n<li>Datos continuos: <code>distance_matrix(Xs, Xs)</code> (euclidiana).</li>\n<li>Datos mixtos o categóricos: <code>gower.gower_matrix(W)</code>.</li>\n</ul>\n<p>Salidas del objeto <code>c</code>:</p>\n<ul>\n<li><code>c.loss</code>: valor de la función objetivo, o sea la suma de distancias a los medoides.</li>\n<li><code>c.labels</code>: etiqueta de grupo de cada observación.</li>\n<li><code>c.medoids</code>: <strong>índices</strong> de las observaciones que quedaron como medoides. Son posiciones dentro\n  de la muestra original, no coordenadas.</li>\n</ul>", "python": [{"titulo": "K-Medoides con distancia euclidiana", "origen": "Del curso, class3_book1_kmedoids.ipynb", "code": "from scipy.spatial import distance_matrix, distance\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# La entrada del algoritmo es la matriz de distancias n x n\ndista_s = distance_matrix(Xs, Xs)\nnp.shape(dista_s)\n\n#%pip install kmedoids   # quitar el # si falta instalar\nimport kmedoids\n\nc = kmedoids.fasterpam(dista_s, 3)\nprint(\"Loss is:\", c.loss)\n\nlabels = c.labels      # etiquetas de grupo\nmedoids = c.medoids    # ÍNDICES de las observaciones medoide\n\nplt.scatter(Xs[:, 2], Xs[:, 3], c=labels, cmap='viridis', alpha=0.6)\nplt.title(\"K-Medoids Clustering\")\nplt.show()"}, {"titulo": "K-Medoides con distancia de Gower (datos no euclidianos)", "origen": "Del curso, class3_book1_kmedoids.ipynb", "code": "#!pip install gower   # quitar el # si falta instalar\nimport gower\n\nfrom sklearn.datasets import load_wine\nwine = load_wine()\nW = wine.data\n\n# Matriz de distancias tipo Gower: sirve para variables mixtas o categóricas\ndist_g = gower.gower_matrix(W)\nnp.shape(dist_g)\n\nmed_w = kmedoids.fasterpam(dist_g, 3)\n\nlabels = med_w.labels\nmedoids = med_w.medoids\n\nprint(medoids)   # índices de los medoides\nprint(labels)"}, {"titulo": "Alternativa con sklearn_extra", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Si kmedoids no está disponible\nfrom sklearn_extra.cluster import KMedoids\n\nmodelo = KMedoids(n_clusters=3, metric='euclidean', method='pam', random_state=0)\netiquetas = modelo.fit_predict(Xs)\n\nmodelo.medoid_indices_    # índices de los medoides\nmodelo.cluster_centers_   # coordenadas de los medoides\nmodelo.inertia_           # suma de distancias a los medoides\n\n# Con una matriz de distancias precalculada\nmodelo_pre = KMedoids(n_clusters=3, metric='precomputed', method='pam', random_state=0)\netiquetas_pre = modelo_pre.fit_predict(dista_s)"}], "r": [{"titulo": "PAM y distancia de Gower en R", "origen": "Equivalente agregado, no viene del material del curso. La función daisy con metric gower si aparece en el código de MDS del curso", "code": "library(cluster)\n\n# Caso euclidiano\nXs <- scale(iris[, 1:4])\npam_res <- pam(Xs, k = 3)\n\npam_res$medoids     # coordenadas de los medoides\npam_res$id.med      # índices de los medoides dentro de la muestra\npam_res$clustering  # etiquetas\npam_res$objective   # valor de la función objetivo\n\nplot(Xs[, 3], Xs[, 4], col = pam_res$clustering, pch = 16)\npoints(pam_res$medoids[, 3], pam_res$medoids[, 4], pch = 8, cex = 2)\n\n# Silhouette de la solución\nplot(silhouette(pam_res))\n\n\n# Caso no euclidiano: datos mixtos con distancia de Gower\nxx <- read.table(\"sponge.txt\", header = TRUE, sep = \",\")\ndis_gower <- daisy(xx, metric = \"gower\")\n\npam_gower <- pam(dis_gower, k = 3, diss = TRUE)\npam_gower$id.med\npam_gower$clustering\n\n\n# CLARA: versión de PAM para muestras grandes\nclara_res <- clara(Xs, k = 3, samples = 50)\nclara_res$medoids"}], "busqueda": "04 k-medoides medoide en lugar de media, robustez, distancias no euclidianas, gower. clustering clase 3  que cambia respecto a k-means \n se reemplaza el promedio del grupo por el  medoide : la observacion de la muestra que es mas\ncentral dentro del grupo. el centro deja de ser un punto artificial y pasa a ser un dato real. \n  medoide_k = argmin_{x_j en cluster k}  sum_{x_i en cluster k} d(x_i, x_j)\n  \n los dos efectos que gana \n \n \n  robustez.  como el centro es una observacion y no un promedio, un outlier ya no arrastra el\n   centro del grupo. k-medoides es notablemente mas resistente a datos atipicos que k-means. \n \n \n  generalizacion a coordenadas no euclidianas.  el algoritmo solo necesita la  matriz de\n   distancias  entre pares, no las coordenadas. eso permite usarlo con variables categoricas,\n   mixtas o con distancias no metricas. k-means no puede hacer esto porque necesita calcular un\n   promedio, y el promedio de categorias no existe. \n \n \n distancia de gower \n es la distancia estandar para datos mixtos (continuos, ordinales, binarios, nominales). normaliza\ncada variable a su rango y promedia las contribuciones. es lo que habilita usar k-medoides sobre\nbases con variables categoricas. \n costo \n el algoritmo exacto (pam) es mas costoso que k-means porque evalua intercambios de medoides.\n fasterpam  es una implementacion eficiente de pam.  k-medoides con distancia euclidiana from scipy.spatial import distance_matrix, distance\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# la entrada del algoritmo es la matriz de distancias n x n\ndista_s = distance_matrix(xs, xs)\nnp.shape(dista_s)\n\n#%pip install kmedoids   # quitar el # si falta instalar\nimport kmedoids\n\nc = kmedoids.fasterpam(dista_s, 3)\nprint(\"loss is:\", c.loss)\n\nlabels = c.labels      # etiquetas de grupo\nmedoids = c.medoids    # indices de las observaciones medoide\n\nplt.scatter(xs[:, 2], xs[:, 3], c=labels, cmap='viridis', alpha=0.6)\nplt.title(\"k-medoids clustering\")\nplt.show() k-medoides con distancia de gower (datos no euclidianos) #!pip install gower   # quitar el # si falta instalar\nimport gower\n\nfrom sklearn.datasets import load_wine\nwine = load_wine()\nw = wine.data\n\n# matriz de distancias tipo gower: sirve para variables mixtas o categoricas\ndist_g = gower.gower_matrix(w)\nnp.shape(dist_g)\n\nmed_w = kmedoids.fasterpam(dist_g, 3)\n\nlabels = med_w.labels\nmedoids = med_w.medoids\n\nprint(medoids)   # indices de los medoides\nprint(labels) alternativa con sklearn_extra # si kmedoids no esta disponible\nfrom sklearn_extra.cluster import kmedoids\n\nmodelo = kmedoids(n_clusters=3, metric='euclidean', method='pam', random_state=0)\netiquetas = modelo.fit_predict(xs)\n\nmodelo.medoid_indices_    # indices de los medoides\nmodelo.cluster_centers_   # coordenadas de los medoides\nmodelo.inertia_           # suma de distancias a los medoides\n\n# con una matriz de distancias precalculada\nmodelo_pre = kmedoids(n_clusters=3, metric='precomputed', method='pam', random_state=0)\netiquetas_pre = modelo_pre.fit_predict(dista_s) pam y distancia de gower en r library(cluster)\n\n# caso euclidiano\nxs <- scale(iris[, 1:4])\npam_res <- pam(xs, k = 3)\n\npam_res$medoids     # coordenadas de los medoides\npam_res$id.med      # indices de los medoides dentro de la muestra\npam_res$clustering  # etiquetas\npam_res$objective   # valor de la funcion objetivo\n\nplot(xs[, 3], xs[, 4], col = pam_res$clustering, pch = 16)\npoints(pam_res$medoids[, 3], pam_res$medoids[, 4], pch = 8, cex = 2)\n\n# silhouette de la solucion\nplot(silhouette(pam_res))\n\n\n# caso no euclidiano: datos mixtos con distancia de gower\nxx <- read.table(\"sponge.txt\", header = true, sep = \",\")\ndis_gower <- daisy(xx, metric = \"gower\")\n\npam_gower <- pam(dis_gower, k = 3, diss = true)\npam_gower$id.med\npam_gower$clustering\n\n\n# clara: version de pam para muestras grandes\nclara_res <- clara(xs, k = 3, samples = 50)\nclara_res$medoids"}, {"num": "05", "slug": "jerarquico", "parte": "Clustering", "titulo": "Clustering jerárquico", "resumen": "Aglomerativo, linkage single complete average Ward, dendrograma.", "clases": "Clase 3, Clase 4", "teoria": "<h3>Qué hace distinto</h3>\n<p>Los métodos jerárquicos no buscan tanto una partición final en K grupos, sino <strong>mostrar el proceso</strong>\npor el cual las observaciones se van agregando (aglomerativo) o separando (divisivo). El resultado\nes un árbol, no una asignación única.</p>\n<p>En el caso aglomerativo: cada punto empieza como su propio cluster, y en cada paso se unen los dos\nclusters más cercanos, hasta que queda uno solo.</p>\n<h3>Distancia entre clusters (linkage)</h3>\n<p>Es el concepto central. Se necesita una distancia entre <strong>grupos</strong>, no entre puntos:</p>\n<table>\n<thead>\n<tr>\n<th>Linkage</th>\n<th>Definición</th>\n<th>Comportamiento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>single</code> (simple)</td>\n<td>distancia <strong>mínima</strong> entre puntos de los dos clusters</td>\n<td>encadena, detecta formas alargadas, sensible a ruido</td>\n</tr>\n<tr>\n<td><code>complete</code> (completa)</td>\n<td>distancia <strong>máxima</strong> entre puntos de los dos clusters</td>\n<td>grupos compactos y de tamaño parecido</td>\n</tr>\n<tr>\n<td><code>average</code> (promedio)</td>\n<td>distancia <strong>promedio</strong> entre todos los pares</td>\n<td>intermedio entre los dos anteriores</td>\n</tr>\n<tr>\n<td><code>ward</code></td>\n<td>minimiza el incremento del WSS al unir</td>\n<td>grupos de varianza parecida, se acerca a K-Means</td>\n</tr>\n</tbody>\n</table>\n<h3>Características importantes</h3>\n<ol>\n<li>El resultado <strong>depende de la escala</strong>, igual que K-Means.</li>\n<li>Es muy rápido de implementar.</li>\n<li>Da información adicional: crea una relación de familias entre los puntos, muy útil para la\n   representación visual.</li>\n<li>Es <strong>más robusto que K-Means</strong> a los datos atípicos.</li>\n</ol>\n<h3>Problemas</h3>\n<ul>\n<li><strong>Problema 1</strong>: el resultado depende mucho de la distancia (linkage) seleccionada.</li>\n<li><strong>Problema 2</strong>: el método de estimación puede dar resultados no muy buenos en términos de\n  coherencia o separación entre clusters, porque es un método greedy que nunca deshace una unión.</li>\n</ul>\n<h3>Dendrograma</h3>\n<p>El eje vertical es la distancia a la que se unieron dos grupos. Cortar el dendrograma a una altura\nh da una partición. Un salto grande de altura entre dos uniones sugiere un buen número de clusters.</p>", "relacion": "<p>El código usa <strong>dos librerías distintas para dos cosas distintas</strong>, y conviene no confundirlas:</p>\n<ol>\n<li>\n<p><code>AgglomerativeClustering</code> de sklearn: <strong>produce las etiquetas</strong> cuando ya decidiste cuántos\n   grupos quieres. Parámetros: <code>n_clusters</code> y <code>linkage</code>.</p>\n</li>\n<li>\n<p><code>linkage</code> y <code>dendrogram</code> de scipy: <strong>producen el árbol</strong> y lo dibujan. <code>linkage(X, method=...,\n   metric=...)</code> devuelve la matriz de fusiones, y <code>dendrogram()</code> la gráfica.</p>\n</li>\n</ol>\n<p>El parámetro <code>method</code> de scipy es el mismo concepto que <code>linkage</code> de sklearn. Cambiar entre\n<code>'single'</code>, <code>'complete'</code>, <code>'average'</code> y <code>'ward'</code> es el ejercicio típico del parcial: con <code>single</code>\nsobre iris los grupos quedan muy desbalanceados por el encadenamiento.</p>\n<p>Nota: con <code>method='ward'</code> la métrica debe ser euclidiana.</p>", "python": [{"titulo": "Aglomerativo y dendrograma", "origen": "Del curso, class4_book1_hierarquical.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\niris = load_iris()\nX = iris.data\nn = np.shape(X)[0]\np = np.shape(X)[1]\nK = 3\n\nfrom sklearn.cluster import AgglomerativeClustering\nfrom scipy.cluster.hierarchy import dendrogram, linkage\n\n# Etiquetas: linkage puede ser 'single', 'complete', 'average' o 'ward'\nhierarchical_cluster = AgglomerativeClustering(n_clusters=3, linkage='single')\nlabels = hierarchical_cluster.fit_predict(X)\n\nplt.scatter(X[:, 2], X[:, 3], c=labels)\nplt.show()\n\n# Dendrograma\nlinkage_data = linkage(X, method='single', metric='euclidean')\ndendrogram(linkage_data)\nplt.show()"}, {"titulo": "Comparar los cuatro linkages y cortar el árbol", "origen": "Equivalente agregado, no viene del material del curso", "code": "from scipy.cluster.hierarchy import dendrogram, linkage, fcluster\nfrom sklearn.preprocessing import scale\nimport matplotlib.pyplot as plt\n\nXs = scale(X)\n\nmetodos = ['single', 'complete', 'average', 'ward']\n\nfig, axs = plt.subplots(2, 2, figsize=(12, 8))\nfor ax, metodo in zip(axs.flat, metodos):\n    arbol = linkage(Xs, method=metodo, metric='euclidean')\n    dendrogram(arbol, ax=ax, no_labels=True)\n    ax.set_title(metodo)\nplt.tight_layout()\nplt.show()\n\n# Cortar el dendrograma para obtener K grupos\narbol = linkage(Xs, method='ward', metric='euclidean')\n\netiquetas_k = fcluster(arbol, t=3, criterion='maxclust')     # cortar en 3 grupos\netiquetas_h = fcluster(arbol, t=10, criterion='distance')    # cortar a altura 10\n\nprint(etiquetas_k)"}], "r": [{"titulo": "hclust, dendrograma y corte del árbol", "origen": "Equivalente agregado, no viene del material del curso", "code": "Xs <- scale(iris[, 1:4])\ndis <- dist(Xs, method = \"euclidean\")\n\n# Los cuatro linkages\nhc_single   <- hclust(dis, method = \"single\")\nhc_complete <- hclust(dis, method = \"complete\")\nhc_average  <- hclust(dis, method = \"average\")\nhc_ward     <- hclust(dis, method = \"ward.D2\")\n\npar(mfrow = c(2, 2))\nplot(hc_single,   main = \"Single\",   labels = FALSE)\nplot(hc_complete, main = \"Complete\", labels = FALSE)\nplot(hc_average,  main = \"Average\",  labels = FALSE)\nplot(hc_ward,     main = \"Ward\",     labels = FALSE)\npar(mfrow = c(1, 1))\n\n# Cortar el árbol en K grupos\ngrupos <- cutree(hc_ward, k = 3)\ntable(grupos)\ntable(grupos, iris$Species)\n\n# Dibujar los rectangulos del corte sobre el dendrograma\nplot(hc_ward, labels = FALSE)\nrect.hclust(hc_ward, k = 3, border = 2:4)\n\n# Versión del paquete cluster (aglomerativo y divisivo)\nlibrary(cluster)\nag <- agnes(Xs, method = \"ward\")   # aglomerativo\ndi <- diana(Xs)                    # divisivo\nplot(ag)"}], "busqueda": "05 clustering jerarquico aglomerativo, linkage single complete average ward, dendrograma. clustering clase 3, clase 4  que hace distinto \n los metodos jerarquicos no buscan tanto una particion final en k grupos, sino  mostrar el proceso \npor el cual las observaciones se van agregando (aglomerativo) o separando (divisivo). el resultado\nes un arbol, no una asignacion unica. \n en el caso aglomerativo: cada punto empieza como su propio cluster, y en cada paso se unen los dos\nclusters mas cercanos, hasta que queda uno solo. \n distancia entre clusters (linkage) \n es el concepto central. se necesita una distancia entre  grupos , no entre puntos: \n \n \n \n linkage \n definicion \n comportamiento \n \n \n \n \n  single  (simple) \n distancia  minima  entre puntos de los dos clusters \n encadena, detecta formas alargadas, sensible a ruido \n \n \n  complete  (completa) \n distancia  maxima  entre puntos de los dos clusters \n grupos compactos y de tamano parecido \n \n \n  average  (promedio) \n distancia  promedio  entre todos los pares \n intermedio entre los dos anteriores \n \n \n  ward  \n minimiza el incremento del wss al unir \n grupos de varianza parecida, se acerca a k-means \n \n \n \n caracteristicas importantes \n \n el resultado  depende de la escala , igual que k-means. \n es muy rapido de implementar. \n da informacion adicional: crea una relacion de familias entre los puntos, muy util para la\n   representacion visual. \n es  mas robusto que k-means  a los datos atipicos. \n \n problemas \n \n  problema 1 : el resultado depende mucho de la distancia (linkage) seleccionada. \n  problema 2 : el metodo de estimacion puede dar resultados no muy buenos en terminos de\n  coherencia o separacion entre clusters, porque es un metodo greedy que nunca deshace una union. \n \n dendrograma \n el eje vertical es la distancia a la que se unieron dos grupos. cortar el dendrograma a una altura\nh da una particion. un salto grande de altura entre dos uniones sugiere un buen numero de clusters.  aglomerativo y dendrograma import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\niris = load_iris()\nx = iris.data\nn = np.shape(x)[0]\np = np.shape(x)[1]\nk = 3\n\nfrom sklearn.cluster import agglomerativeclustering\nfrom scipy.cluster.hierarchy import dendrogram, linkage\n\n# etiquetas: linkage puede ser 'single', 'complete', 'average' o 'ward'\nhierarchical_cluster = agglomerativeclustering(n_clusters=3, linkage='single')\nlabels = hierarchical_cluster.fit_predict(x)\n\nplt.scatter(x[:, 2], x[:, 3], c=labels)\nplt.show()\n\n# dendrograma\nlinkage_data = linkage(x, method='single', metric='euclidean')\ndendrogram(linkage_data)\nplt.show() comparar los cuatro linkages y cortar el arbol from scipy.cluster.hierarchy import dendrogram, linkage, fcluster\nfrom sklearn.preprocessing import scale\nimport matplotlib.pyplot as plt\n\nxs = scale(x)\n\nmetodos = ['single', 'complete', 'average', 'ward']\n\nfig, axs = plt.subplots(2, 2, figsize=(12, 8))\nfor ax, metodo in zip(axs.flat, metodos):\n    arbol = linkage(xs, method=metodo, metric='euclidean')\n    dendrogram(arbol, ax=ax, no_labels=true)\n    ax.set_title(metodo)\nplt.tight_layout()\nplt.show()\n\n# cortar el dendrograma para obtener k grupos\narbol = linkage(xs, method='ward', metric='euclidean')\n\netiquetas_k = fcluster(arbol, t=3, criterion='maxclust')     # cortar en 3 grupos\netiquetas_h = fcluster(arbol, t=10, criterion='distance')    # cortar a altura 10\n\nprint(etiquetas_k) hclust, dendrograma y corte del arbol xs <- scale(iris[, 1:4])\ndis <- dist(xs, method = \"euclidean\")\n\n# los cuatro linkages\nhc_single   <- hclust(dis, method = \"single\")\nhc_complete <- hclust(dis, method = \"complete\")\nhc_average  <- hclust(dis, method = \"average\")\nhc_ward     <- hclust(dis, method = \"ward.d2\")\n\npar(mfrow = c(2, 2))\nplot(hc_single,   main = \"single\",   labels = false)\nplot(hc_complete, main = \"complete\", labels = false)\nplot(hc_average,  main = \"average\",  labels = false)\nplot(hc_ward,     main = \"ward\",     labels = false)\npar(mfrow = c(1, 1))\n\n# cortar el arbol en k grupos\ngrupos <- cutree(hc_ward, k = 3)\ntable(grupos)\ntable(grupos, iris$species)\n\n# dibujar los rectangulos del corte sobre el dendrograma\nplot(hc_ward, labels = false)\nrect.hclust(hc_ward, k = 3, border = 2:4)\n\n# version del paquete cluster (aglomerativo y divisivo)\nlibrary(cluster)\nag <- agnes(xs, method = \"ward\")   # aglomerativo\ndi <- diana(xs)                    # divisivo\nplot(ag)"}, {"num": "06", "slug": "dbscan", "parte": "Clustering", "titulo": "DBSCAN", "resumen": "Densidades, eps y MinPts, puntos core border y noise, gráfico de k-distancias.", "clases": "Clase 4", "teoria": "<h3>Idea central</h3>\n<p>Los métodos basados en densidades usan como criterio la <strong>densidad local de puntos por volumen</strong>.\nUn cluster es una aglomeración de puntos densamente conectados, <strong>sin necesidad de que todos los\npuntos del grupo estén cercanos entre si</strong>. Por eso detecta formas irregulares (círculos\nconcentricos, líneas, espirales) que K-Means no puede.</p>\n<p>DBSCAN significa Density-Based Spatial Clustering of Applications with Noise. Además de encontrar\nlos clusters, <strong>reconoce los puntos atípicos</strong> que no pertenecen a ningún grupo.</p>\n<h3>Los dos parámetros</h3>\n<p>Se construye una bola (vecindad) alrededor de cada punto:</p>\n<ol>\n<li><strong>eps (epsilon)</strong>: el radio de la bola donde se buscan vecinos.</li>\n<li><strong>MinPts (<code>min_samples</code>)</strong>: el mínimo número de puntos dentro de la vecindad para considerar\n   que el punto está dentro de un grupo.</li>\n</ol>\n<h3>Clasificación de los puntos</h3>\n<table>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Condición</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Core</strong> (interno)</td>\n<td>su vecindad de radio eps tiene al menos MinPts vecinos</td>\n</tr>\n<tr>\n<td><strong>Border</strong> (borde)</td>\n<td>tiene vecinos que son core, pero su propio número de vecinos es menor a MinPts</td>\n</tr>\n<tr>\n<td><strong>Noise</strong> (ruido, outlier)</td>\n<td>no es core ni border</td>\n</tr>\n</tbody>\n</table>\n<p>En sklearn, los puntos de ruido reciben la etiqueta <strong>-1</strong>.</p>\n<h3>Ventajas y desventajas</h3>\n<p><strong>Ventajas.</strong> Detecta formas irregulares. No hay que fijar K de antemano. Identifica outliers de\nforma explícita. Es robusto al ruido.</p>\n<p><strong>Desventajas.</strong> Los parámetros son difíciles de calibrar. Falla cuando los clusters tienen\ndensidades muy distintas, porque un solo par (eps, MinPts) no sirve para todos. Se degrada en\ndimensiones altas porque las distancias se vuelven parecidas entre si.</p>\n<h3>Cómo escoger eps</h3>\n<p>Procedimiento del curso: para un k dado, se calcula la distancia de cada punto a su k-ésimo vecino\nmás cercano, se ordenan esas distancias de menor a mayor y se grafican. El codo de esa curva sugiere\nun eps razonable. La respuesta depende de <strong>qué proporción de puntos outliers se permite</strong>: si se\ncorta bajo, más puntos quedan como ruido.</p>", "relacion": "<p>La función <code>distancia_kveci(X, k)</code> del notebook es la herramienta de calibración, no parte del\nalgoritmo. Lo que hace:</p>\n<ul>\n<li><code>NearestNeighbors(n_neighbors=k).fit(X)</code> y luego <code>kneighbors(X)</code> devuelve, para cada punto, las\n  distancias a sus k vecinos más cercanos.</li>\n<li><code>distances[:, 1:]</code> descarta la primera columna porque <strong>el vecino más cercano de un punto es el\n  punto mismo, a distancia cero</strong>. Ese detalle es fácil de olvidar.</li>\n<li><code>.reshape(-1)</code> aplana todo en un solo vector.</li>\n</ul>\n<p>Luego <code>plt.plot(sorted(distancia_kveci(X, 5)))</code> gráfica las distancias ordenadas. El codo de esa\ncurva es el candidato a eps.</p>\n<p>Después se ajusta el modelo: <code>DBSCAN(eps=0.6, min_samples=6).fit(X)</code> y <code>dbsca.labels_</code> da las\netiquetas, donde -1 marca ruido.</p>\n<p>El segundo bloque del notebook simula dos círculos concentricos más ruido uniforme. Es el ejemplo\ncanónico de por qué DBSCAN gana: K-Means partiría los círculos por la mitad, DBSCAN los separa\ncomo dos anillos y manda el ruido a la clase -1.</p>", "python": [{"titulo": "Calibración de eps y ajuste de DBSCAN", "origen": "Del curso, class4_book2_DBSCAN.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\nimport math as math\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\nfrom sklearn.cluster import DBSCAN\nfrom sklearn.neighbors import NearestNeighbors\n\n# Función para escanear la distancia al k-ésimo vecino\ndef distancia_kveci(X, k=3):\n    kveci = NearestNeighbors(n_neighbors=k)\n    veci = kveci.fit(X)\n    distances, indices = veci.kneighbors(X)\n    return distances[:, 1:].reshape(-1)   # se quita la columna 0 (el punto mismo)\n\niris = load_iris()\nX = iris.data\n\ndistancia_kveci(X, 2)\n\n# Distancias ordenadas: el codo sugiere el radio eps\nplt.plot(sorted(distancia_kveci(X, 5)))\n\n# Ajuste del modelo\ndbsca = DBSCAN(eps=0.6, min_samples=6).fit(X)\n\nlabel = dbsca.labels_   # la clase -1 corresponde a los puntos de ruido (noise)\nlabel\n\nplt.scatter(X[:, 2], X[:, 3], c=label)\nplt.show()"}, {"titulo": "Datos con formas irregulares (círculos concentricos más ruido)", "origen": "Del curso, class4_book2_DBSCAN.ipynb", "code": "np.random.seed(42)\n\n# Círculos concentricos\ntheta = np.linspace(0, 2 * np.pi, 300)\nr1 = 2 + np.random.normal(0, 0.4, 300)\ncircle1_x, circle1_y = r1 * np.cos(theta), r1 * np.sin(theta)\n\nr2 = 5 + np.random.normal(0, 0.4, 300)\ncircle2_x, circle2_y = r2 * np.cos(theta), r2 * np.sin(theta)\n\n# Ruido / outliers\nnoise_x = np.random.uniform(-8, 8, 100)\nnoise_y = np.random.uniform(-8, 8, 100)\n\nX = np.vstack(\n    [\n        np.column_stack((circle1_x, circle1_y)),\n        np.column_stack((circle2_x, circle2_y)),\n        np.column_stack((noise_x, noise_y)),\n    ]\n)\n\nplt.scatter(X[:, 0], X[:, 1], s=10, c=\"purple\")\nplt.title(\"Synthetic Multishapes Dataset\")\nplt.show()\n\n# Calibrar y ajustar\nplt.plot(sorted(distancia_kveci(X, 8)))\n\ndbsca = DBSCAN(eps=0.7, min_samples=8).fit(X)\nlabel = dbsca.labels_\nprint(label)\n\nplt.scatter(X[:, 0], X[:, 1], c=label)\nplt.show()"}, {"titulo": "Resumen de la solución: número de clusters y de outliers", "origen": "Equivalente agregado, no viene del material del curso", "code": "import numpy as np\n\nlabel = dbsca.labels_\n\nn_clusters = len(set(label)) - (1 if -1 in label else 0)\nn_ruido = list(label).count(-1)\n\nprint(\"Número de clusters:\", n_clusters)\nprint(\"Número de puntos de ruido:\", n_ruido)\nprint(\"Proporción de ruido:\", round(n_ruido/len(label), 3))\n\n# Tamaño de cada grupo\nvalores, conteos = np.unique(label, return_counts=True)\nfor v, c in zip(valores, conteos):\n    nombre = \"ruido\" if v == -1 else f\"cluster {v}\"\n    print(nombre, c)"}], "r": [{"titulo": "DBSCAN en R con dbscan y kNNdistplot", "origen": "Equivalente agregado, no viene del material del curso", "code": "library(dbscan)\n\nX <- as.matrix(iris[, 1:4])\n\n# Calibración de eps: gráfico de distancias al k-ésimo vecino\nkNNdistplot(X, k = 5)\nabline(h = 0.6, col = \"red\", lty = 2)\n\n# Ajuste del modelo\ndb <- dbscan(X, eps = 0.6, minPts = 6)\ndb\n\ndb$cluster       # etiquetas, el 0 corresponde al ruido (en R es 0, no -1)\ntable(db$cluster)\n\nplot(X[, 3], X[, 4], col = db$cluster + 1L, pch = 16)\n\n\n# Datos con formas irregulares\nset.seed(42)\ntheta <- seq(0, 2*pi, length.out = 300)\nr1 <- 2 + rnorm(300, 0, 0.4)\nr2 <- 5 + rnorm(300, 0, 0.4)\n\ncirc1 <- cbind(r1*cos(theta), r1*sin(theta))\ncirc2 <- cbind(r2*cos(theta), r2*sin(theta))\nruido <- cbind(runif(100, -8, 8), runif(100, -8, 8))\n\nXirr <- rbind(circ1, circ2, ruido)\nplot(Xirr, pch = 16, cex = 0.5)\n\nkNNdistplot(Xirr, k = 8)\ndb2 <- dbscan(Xirr, eps = 0.7, minPts = 8)\nplot(Xirr, col = db2$cluster + 1L, pch = 16, cex = 0.6)\n\n\n# OPTICS, la versión que maneja densidades variables\nop <- optics(Xirr, eps = 2, minPts = 8)\nplot(op)"}], "busqueda": "06 dbscan densidades, eps y minpts, puntos core border y noise, grafico de k-distancias. clustering clase 4  idea central \n los metodos basados en densidades usan como criterio la  densidad local de puntos por volumen .\nun cluster es una aglomeracion de puntos densamente conectados,  sin necesidad de que todos los\npuntos del grupo esten cercanos entre si . por eso detecta formas irregulares (circulos\nconcentricos, lineas, espirales) que k-means no puede. \n dbscan significa density-based spatial clustering of applications with noise. ademas de encontrar\nlos clusters,  reconoce los puntos atipicos  que no pertenecen a ningun grupo. \n los dos parametros \n se construye una bola (vecindad) alrededor de cada punto: \n \n  eps (epsilon) : el radio de la bola donde se buscan vecinos. \n  minpts ( min_samples ) : el minimo numero de puntos dentro de la vecindad para considerar\n   que el punto esta dentro de un grupo. \n \n clasificacion de los puntos \n \n \n \n tipo \n condicion \n \n \n \n \n  core  (interno) \n su vecindad de radio eps tiene al menos minpts vecinos \n \n \n  border  (borde) \n tiene vecinos que son core, pero su propio numero de vecinos es menor a minpts \n \n \n  noise  (ruido, outlier) \n no es core ni border \n \n \n \n en sklearn, los puntos de ruido reciben la etiqueta  -1 . \n ventajas y desventajas \n  ventajas.  detecta formas irregulares. no hay que fijar k de antemano. identifica outliers de\nforma explicita. es robusto al ruido. \n  desventajas.  los parametros son dificiles de calibrar. falla cuando los clusters tienen\ndensidades muy distintas, porque un solo par (eps, minpts) no sirve para todos. se degrada en\ndimensiones altas porque las distancias se vuelven parecidas entre si. \n como escoger eps \n procedimiento del curso: para un k dado, se calcula la distancia de cada punto a su k-esimo vecino\nmas cercano, se ordenan esas distancias de menor a mayor y se grafican. el codo de esa curva sugiere\nun eps razonable. la respuesta depende de  que proporcion de puntos outliers se permite : si se\ncorta bajo, mas puntos quedan como ruido.  calibracion de eps y ajuste de dbscan import numpy as np\nimport matplotlib.pyplot as plt\nimport pandas as pd\nimport math as math\nfrom sklearn import datasets\nfrom sklearn.datasets import load_iris\n\nfrom sklearn.cluster import dbscan\nfrom sklearn.neighbors import nearestneighbors\n\n# funcion para escanear la distancia al k-esimo vecino\ndef distancia_kveci(x, k=3):\n    kveci = nearestneighbors(n_neighbors=k)\n    veci = kveci.fit(x)\n    distances, indices = veci.kneighbors(x)\n    return distances[:, 1:].reshape(-1)   # se quita la columna 0 (el punto mismo)\n\niris = load_iris()\nx = iris.data\n\ndistancia_kveci(x, 2)\n\n# distancias ordenadas: el codo sugiere el radio eps\nplt.plot(sorted(distancia_kveci(x, 5)))\n\n# ajuste del modelo\ndbsca = dbscan(eps=0.6, min_samples=6).fit(x)\n\nlabel = dbsca.labels_   # la clase -1 corresponde a los puntos de ruido (noise)\nlabel\n\nplt.scatter(x[:, 2], x[:, 3], c=label)\nplt.show() datos con formas irregulares (circulos concentricos mas ruido) np.random.seed(42)\n\n# circulos concentricos\ntheta = np.linspace(0, 2 * np.pi, 300)\nr1 = 2 + np.random.normal(0, 0.4, 300)\ncircle1_x, circle1_y = r1 * np.cos(theta), r1 * np.sin(theta)\n\nr2 = 5 + np.random.normal(0, 0.4, 300)\ncircle2_x, circle2_y = r2 * np.cos(theta), r2 * np.sin(theta)\n\n# ruido / outliers\nnoise_x = np.random.uniform(-8, 8, 100)\nnoise_y = np.random.uniform(-8, 8, 100)\n\nx = np.vstack(\n    [\n        np.column_stack((circle1_x, circle1_y)),\n        np.column_stack((circle2_x, circle2_y)),\n        np.column_stack((noise_x, noise_y)),\n    ]\n)\n\nplt.scatter(x[:, 0], x[:, 1], s=10, c=\"purple\")\nplt.title(\"synthetic multishapes dataset\")\nplt.show()\n\n# calibrar y ajustar\nplt.plot(sorted(distancia_kveci(x, 8)))\n\ndbsca = dbscan(eps=0.7, min_samples=8).fit(x)\nlabel = dbsca.labels_\nprint(label)\n\nplt.scatter(x[:, 0], x[:, 1], c=label)\nplt.show() resumen de la solucion: numero de clusters y de outliers import numpy as np\n\nlabel = dbsca.labels_\n\nn_clusters = len(set(label)) - (1 if -1 in label else 0)\nn_ruido = list(label).count(-1)\n\nprint(\"numero de clusters:\", n_clusters)\nprint(\"numero de puntos de ruido:\", n_ruido)\nprint(\"proporcion de ruido:\", round(n_ruido/len(label), 3))\n\n# tamano de cada grupo\nvalores, conteos = np.unique(label, return_counts=true)\nfor v, c in zip(valores, conteos):\n    nombre = \"ruido\" if v == -1 else f\"cluster {v}\"\n    print(nombre, c) dbscan en r con dbscan y knndistplot library(dbscan)\n\nx <- as.matrix(iris[, 1:4])\n\n# calibracion de eps: grafico de distancias al k-esimo vecino\nknndistplot(x, k = 5)\nabline(h = 0.6, col = \"red\", lty = 2)\n\n# ajuste del modelo\ndb <- dbscan(x, eps = 0.6, minpts = 6)\ndb\n\ndb$cluster       # etiquetas, el 0 corresponde al ruido (en r es 0, no -1)\ntable(db$cluster)\n\nplot(x[, 3], x[, 4], col = db$cluster + 1l, pch = 16)\n\n\n# datos con formas irregulares\nset.seed(42)\ntheta <- seq(0, 2*pi, length.out = 300)\nr1 <- 2 + rnorm(300, 0, 0.4)\nr2 <- 5 + rnorm(300, 0, 0.4)\n\ncirc1 <- cbind(r1*cos(theta), r1*sin(theta))\ncirc2 <- cbind(r2*cos(theta), r2*sin(theta))\nruido <- cbind(runif(100, -8, 8), runif(100, -8, 8))\n\nxirr <- rbind(circ1, circ2, ruido)\nplot(xirr, pch = 16, cex = 0.5)\n\nknndistplot(xirr, k = 8)\ndb2 <- dbscan(xirr, eps = 0.7, minpts = 8)\nplot(xirr, col = db2$cluster + 1l, pch = 16, cex = 0.6)\n\n\n# optics, la version que maneja densidades variables\nop <- optics(xirr, eps = 2, minpts = 8)\nplot(op)"}, {"num": "07", "slug": "outliers-estadisticos", "parte": "Outliers", "titulo": "Outliers: Z-Score y Mahalanobis", "resumen": "Métodos estadísticos, una variable y el caso multivariado.", "clases": "Clase 5", "teoria": "<h3>Cuándo sirven</h3>\n<p>L
