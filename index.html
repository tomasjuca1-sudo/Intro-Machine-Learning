(holzinger.9, n.obs = 145)"}, {"num": "12", "slug": "kernel-pca", "parte": "Reducción de dimensiones", "titulo": "Kernel PCA", "resumen": "PCA en un espacio de mayor dimensión, truco del kernel, rbfdot y sigma.", "clases": "Clase 9", "teoria": "<h3>El problema que resuelve</h3>\n<p>PCA es <strong>lineal</strong>: solo puede encontrar direcciones que sean combinaciones lineales de las variables\noriginales. Si la estructura de los datos es curva (dos esferas concentricas, una espiral, dos\nanillos), PCA no la separa por más componentes que se usen.</p>\n<h3>La idea</h3>\n<p>Se lleva cada observación a un espacio de mayor dimensión mediante una función phi, y se hace PCA\n<strong>allí</strong>:</p>\n<pre><code>x  -&gt;  phi(x)   -&gt;  PCA en el espacio transformado\n</code></pre>\n<p>En el espacio transformado la estructura puede volverse lineal y por lo tanto separable.</p>\n<h3>El truco del kernel</h3>\n<p>Calcular phi(x) explícitamente sería carísimo o imposible (el espacio puede ser infinito\ndimensional). El truco: PCA solo necesita <strong>productos punto</strong>, y un kernel los calcula sin construir\nphi:</p>\n<pre><code>K(x, y) = &lt; phi(x) , phi(y) &gt;\n</code></pre>\n<p>Se construye la matriz de kernel K de n por n, se centra, y se hace descomposición espectral sobre\nella. Las componentes salen de los eigenvectores de K.</p>\n<h3>Kernels comunes</h3>\n<table>\n<thead>\n<tr>\n<th>Kernel</th>\n<th>Fórmula</th>\n<th>Parámetro</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Gaussiano o RBF (<code>rbfdot</code>)</td>\n<td>exp(-sigma *</td>\n<td></td>\n</tr>\n<tr>\n<td>Polinomial (<code>polydot</code>)</td>\n<td>(escala * <x,y> + offset)^grado</td>\n<td>grado</td>\n</tr>\n<tr>\n<td>Lineal (<code>vanilladot</code>)</td>\n<td><x, y></td>\n<td>ninguno, equivale a PCA normal</td>\n</tr>\n<tr>\n<td>Tangente hiperbólica (<code>tanhdot</code>)</td>\n<td>tanh(escala * <x,y> + offset)</td>\n<td>escala</td>\n</tr>\n</tbody>\n</table>\n<p>El <strong>sigma</strong> del kernel gaussiano es el parámetro crítico. Sigma grande hace el kernel muy local\n(cada punto se vuelve su propio grupo), sigma pequeño se acerca al caso lineal. En el código del\ncurso se usan valores distintos según los datos: 0.2 para iris, 1.1 para los datos circulares y 0.1\npara measure.</p>\n<h3>Limitación importante</h3>\n<p>KPCA <strong>no tiene reconstrucción directa</strong> al espacio original. Se puede proyectar hacia adelante pero\nvolver de Z a X es un problema aparte (pre-image problem). PCA clásico sí reconstruye. Esto importa\nsi el objetivo es comprimir y luego descomprimir.</p>", "relacion": "<p>La función del curso es <code>kpca</code> del paquete <strong>kernlab</strong> en R.</p>\n<pre><code>kpc &lt;- kpca(~., data = iris[-test, -5], kernel = &quot;rbfdot&quot;,\n            kpar = list(sigma = 0.2), features = 2, eta = 0.001, maxiter = 65)\n</code></pre>\n<p>Argumentos:</p>\n<ul>\n<li><code>~.</code> es la fórmula: usar todas las columnas del data frame.</li>\n<li><code>kernel = \"rbfdot\"</code> escoge el kernel gaussiano.</li>\n<li><code>kpar = list(sigma = 0.2)</code> fija su parámetro.</li>\n<li><code>features = 2</code> es el número de componentes (el d de la teoría).</li>\n<li><code>eta</code> y <code>maxiter</code> controlan la convergencia numérica.</li>\n</ul>\n<p>Salidas:</p>\n<ul>\n<li><code>pcv(kpc)</code>: los vectores de componentes principales en el espacio del kernel.</li>\n<li><code>predict(kpc, datos_nuevos)</code>: <strong>proyecta datos nuevos</strong> sobre las componentes. Esto es lo que\n  permite el ejercicio del notebook de ajustar con una parte de iris y luego embeber los puntos\n  restantes (<code>emb &lt;- predict(kpc, iris[test, -5])</code>).</li>\n</ul>\n<p>El ejemplo más didáctico del código es el de los <strong>datos circulares</strong>: se generan dos casquetes\nesféricos concentricos en 3D (<code>z = sqrt(7 - x^2 - y^2)</code> y <code>z = sqrt(3 - x^2 - y^2)</code>), se proyectan\nprimero con <code>princomp</code> (PCA lineal) y luego con <code>kpca</code>. Con PCA los dos grupos quedan mezclados,\ncon KPCA quedan separados. Ese contraste es el punto de la clase.</p>", "python": [{"titulo": "KernelPCA con sklearn", "origen": "Equivalente agregado. El código del curso está en R", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import KernelPCA, PCA\nfrom sklearn.datasets import make_circles\n\n# Datos no separables linealmente\nX, y = make_circles(n_samples=400, factor=0.3, noise=0.05, random_state=0)\n\nplt.scatter(X[:, 0], X[:, 1], c=y)\nplt.title(\"Datos originales\")\nplt.show()\n\n# PCA lineal: no separa\npca = PCA(n_components=2)\nZ_pca = pca.fit_transform(X)\nplt.scatter(Z_pca[:, 0], Z_pca[:, 1], c=y)\nplt.title(\"PCA lineal\")\nplt.show()\n\n# Kernel PCA con kernel gaussiano\n# gamma de sklearn cumple el papel de sigma de kernlab\nkpca = KernelPCA(n_components=2, kernel='rbf', gamma=10, random_state=0)\nZ_kpca = kpca.fit_transform(X)\n\nplt.scatter(Z_kpca[:, 0], Z_kpca[:, 1], c=y)\nplt.title(\"Kernel PCA (rbf)\")\nplt.show()\n\n# Proyectar datos nuevos\nX_nuevo, _ = make_circles(n_samples=50, factor=0.3, noise=0.05, random_state=1)\nZ_nuevo = kpca.transform(X_nuevo)"}, {"titulo": "Comparar kernels y calibrar gamma", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.decomposition import KernelPCA\nimport matplotlib.pyplot as plt\n\nkernels = ['linear', 'poly', 'rbf', 'cosine']\n\nfig, axs = plt.subplots(1, 4, figsize=(16, 4))\nfor ax, k in zip(axs, kernels):\n    modelo = KernelPCA(n_components=2, kernel=k, gamma=10, degree=3, random_state=0)\n    Z = modelo.fit_transform(X)\n    ax.scatter(Z[:, 0], Z[:, 1], c=y, s=10)\n    ax.set_title(k)\nplt.tight_layout()\nplt.show()\n\n# Efecto de gamma en el kernel rbf\nfor g in [0.1, 1, 10, 100]:\n    modelo = KernelPCA(n_components=2, kernel='rbf', gamma=g, random_state=0)\n    Z = modelo.fit_transform(X)\n    plt.figure(figsize=(3, 3))\n    plt.scatter(Z[:, 0], Z[:, 1], c=y, s=8)\n    plt.title(f\"gamma = {g}\")\n    plt.show()\n\n# Con reconstrucción aproximada (pre-image)\nkpca_inv = KernelPCA(n_components=2, kernel='rbf', gamma=10,\n                     fit_inverse_transform=True, alpha=0.1, random_state=0)\nZ = kpca_inv.fit_transform(X)\nX_recon = kpca_inv.inverse_transform(Z)"}], "r": [{"titulo": "kpca con kernlab (código del curso)", "origen": "Del curso, code2_class9_KPCA.txt", "code": "library(kernlab)\n# another example using the iris\n\n  data(iris)\n  test <- sample(1:150,70)\n  kpc <- kpca(~.,data=iris[-test,-5],kernel=\"rbfdot\",\n              kpar=list(sigma=0.2),features=2, eta=0.001, maxiter=65)\n#print the principal component vectors\n  pcv(kpc)\n#plot the data projection on the components\n  plot(predict(kpc,iris[,-5]),col=as.integer(iris[,5]),\n       xlab=\"1st Principal Component\",ylab=\"2nd Principal Component\")\n\n#embed remaining points\n  emb <- predict(kpc,iris[test,-5])\n  points(emb,col=as.integer(iris[test,5]))\n\n\n#################################\n#circular data for KPCA\nlibrary(plotly)\npackageVersion('plotly')\n\n  y1=runif(80,-1.5,1.5)\n  x1=runif(80,-1.5,1.5)\n  z1=sqrt(rep(7,80)-(y1*y1+rnorm(80,0,.01))-(x1*x1+rnorm(80,0,.01)))\n\n  y2=runif(80,-0.6,1)\n  x2=runif(80,-.6,1)\n  z2=sqrt(rep(3,80)-(y2*y2+rnorm(80,0,.01))-(x2*x2+rnorm(80,0,.01)))\n\n  dat1=as.data.frame(cbind(x1,y1,z1))\n  dat1$clas=rep(1,80)\n  dat1$clas=as.factor(dat1$clas)\n  plot_ly(dat1,x=~x1,y=~y1,z=~sqrt(z1))\n\n  dat2=as.data.frame(cbind(x2,y2,z2))\n  dat2$clas=rep(2,80)\n  dat2$clas=as.factor(dat2$clas)\n  plot_ly(dat2,x=~x2,y=~y2,z=~sqrt(z2))\n\n  colnames(dat1)=c(\"x\",\"y\",\"z\",\"clas\")\n  colnames(dat2)=c(\"x\",\"y\",\"z\",\"clas\")\n  dat=as.data.frame(rbind(dat1,dat2))\n\n  plot_ly(dat,x=~x,y=~y,z=~sqrt(z),color=~clas, colors = c('#BF382A', '#0C4B8E'))\n\n\n##################################\n#Projection on PCA\n  kk=princomp(dat[,1:3],scores=T)\n  plot(kk$scores[,1:2],col=dat$clas)\n\n\n##################################\n#Projection on KPCA\nkpc <- kpca(~.,data=dat[,1:3],kernel=\"rbfdot\",\n       kpar=list(sigma=1.1),features=2, eta=0.001, maxiter=65)\n  plot(pcv(kpc),col=dat$clas)\n\nplot(predict(kpc,dat),col=as.integer(dat$clas),\nxlab=\"1st Principal Component\",ylab=\"2nd Principal Component\")\n\n\n########################################################################\n#Unos datos conocidos\n data=read.table(\"measure.txt\")\n head(data)\n  X=data[,1:3]\n  pca=princomp(X,scores=T)\n  pca$scores\n  par(mfrow=c(1,2))\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4)[data[,4]])\n\n#Ahora con kernel\n  kpc= kpca(~.,X,kernel=\"rbfdot\",\n         kpar=list(sigma=0.1),features=2, eta=0.001, maxiter=65)\npcv(kpc)\nplot(predict(kpc,X),col=c(2,4)[data[,4]],\nxlab=\"1st Principal Component\",ylab=\"2nd Principal Component\")"}], "busqueda": "12 kernel pca pca en un espacio de mayor dimension, truco del kernel, rbfdot y sigma. reduccion de dimensiones clase 9  el problema que resuelve \n pca es  lineal : solo puede encontrar direcciones que sean combinaciones lineales de las variables\noriginales. si la estructura de los datos es curva (dos esferas concentricas, una espiral, dos\nanillos), pca no la separa por mas componentes que se usen. \n la idea \n se lleva cada observacion a un espacio de mayor dimension mediante una funcion phi, y se hace pca\n alli : \n  x  -&gt;  phi(x)   -&gt;  pca en el espacio transformado\n  \n en el espacio transformado la estructura puede volverse lineal y por lo tanto separable. \n el truco del kernel \n calcular phi(x) explicitamente seria carisimo o imposible (el espacio puede ser infinito\ndimensional). el truco: pca solo necesita  productos punto , y un kernel los calcula sin construir\nphi: \n  k(x, y) = &lt; phi(x) , phi(y) &gt;\n  \n se construye la matriz de kernel k de n por n, se centra, y se hace descomposicion espectral sobre\nella. las componentes salen de los eigenvectores de k. \n kernels comunes \n \n \n \n kernel \n formula \n parametro \n \n \n \n \n gaussiano o rbf ( rbfdot ) \n exp(-sigma * \n  \n \n \n polinomial ( polydot ) \n (escala *   + offset)^grado \n grado \n \n \n lineal ( vanilladot ) \n   \n ninguno, equivale a pca normal \n \n \n tangente hiperbolica ( tanhdot ) \n tanh(escala *   + offset) \n escala \n \n \n \n el  sigma  del kernel gaussiano es el parametro critico. sigma grande hace el kernel muy local\n(cada punto se vuelve su propio grupo), sigma pequeno se acerca al caso lineal. en el codigo del\ncurso se usan valores distintos segun los datos: 0.2 para iris, 1.1 para los datos circulares y 0.1\npara measure. \n limitacion importante \n kpca  no tiene reconstruccion directa  al espacio original. se puede proyectar hacia adelante pero\nvolver de z a x es un problema aparte (pre-image problem). pca clasico si reconstruye. esto importa\nsi el objetivo es comprimir y luego descomprimir.  kernelpca con sklearn import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.decomposition import kernelpca, pca\nfrom sklearn.datasets import make_circles\n\n# datos no separables linealmente\nx, y = make_circles(n_samples=400, factor=0.3, noise=0.05, random_state=0)\n\nplt.scatter(x[:, 0], x[:, 1], c=y)\nplt.title(\"datos originales\")\nplt.show()\n\n# pca lineal: no separa\npca = pca(n_components=2)\nz_pca = pca.fit_transform(x)\nplt.scatter(z_pca[:, 0], z_pca[:, 1], c=y)\nplt.title(\"pca lineal\")\nplt.show()\n\n# kernel pca con kernel gaussiano\n# gamma de sklearn cumple el papel de sigma de kernlab\nkpca = kernelpca(n_components=2, kernel='rbf', gamma=10, random_state=0)\nz_kpca = kpca.fit_transform(x)\n\nplt.scatter(z_kpca[:, 0], z_kpca[:, 1], c=y)\nplt.title(\"kernel pca (rbf)\")\nplt.show()\n\n# proyectar datos nuevos\nx_nuevo, _ = make_circles(n_samples=50, factor=0.3, noise=0.05, random_state=1)\nz_nuevo = kpca.transform(x_nuevo) comparar kernels y calibrar gamma from sklearn.decomposition import kernelpca\nimport matplotlib.pyplot as plt\n\nkernels = ['linear', 'poly', 'rbf', 'cosine']\n\nfig, axs = plt.subplots(1, 4, figsize=(16, 4))\nfor ax, k in zip(axs, kernels):\n    modelo = kernelpca(n_components=2, kernel=k, gamma=10, degree=3, random_state=0)\n    z = modelo.fit_transform(x)\n    ax.scatter(z[:, 0], z[:, 1], c=y, s=10)\n    ax.set_title(k)\nplt.tight_layout()\nplt.show()\n\n# efecto de gamma en el kernel rbf\nfor g in [0.1, 1, 10, 100]:\n    modelo = kernelpca(n_components=2, kernel='rbf', gamma=g, random_state=0)\n    z = modelo.fit_transform(x)\n    plt.figure(figsize=(3, 3))\n    plt.scatter(z[:, 0], z[:, 1], c=y, s=8)\n    plt.title(f\"gamma = {g}\")\n    plt.show()\n\n# con reconstruccion aproximada (pre-image)\nkpca_inv = kernelpca(n_components=2, kernel='rbf', gamma=10,\n                     fit_inverse_transform=true, alpha=0.1, random_state=0)\nz = kpca_inv.fit_transform(x)\nx_recon = kpca_inv.inverse_transform(z) kpca con kernlab (codigo del curso) library(kernlab)\n# another example using the iris\n\n  data(iris)\n  test <- sample(1:150,70)\n  kpc <- kpca(~.,data=iris[-test,-5],kernel=\"rbfdot\",\n              kpar=list(sigma=0.2),features=2, eta=0.001, maxiter=65)\n#print the principal component vectors\n  pcv(kpc)\n#plot the data projection on the components\n  plot(predict(kpc,iris[,-5]),col=as.integer(iris[,5]),\n       xlab=\"1st principal component\",ylab=\"2nd principal component\")\n\n#embed remaining points\n  emb <- predict(kpc,iris[test,-5])\n  points(emb,col=as.integer(iris[test,5]))\n\n\n#################################\n#circular data for kpca\nlibrary(plotly)\npackageversion('plotly')\n\n  y1=runif(80,-1.5,1.5)\n  x1=runif(80,-1.5,1.5)\n  z1=sqrt(rep(7,80)-(y1*y1+rnorm(80,0,.01))-(x1*x1+rnorm(80,0,.01)))\n\n  y2=runif(80,-0.6,1)\n  x2=runif(80,-.6,1)\n  z2=sqrt(rep(3,80)-(y2*y2+rnorm(80,0,.01))-(x2*x2+rnorm(80,0,.01)))\n\n  dat1=as.data.frame(cbind(x1,y1,z1))\n  dat1$clas=rep(1,80)\n  dat1$clas=as.factor(dat1$clas)\n  plot_ly(dat1,x=~x1,y=~y1,z=~sqrt(z1))\n\n  dat2=as.data.frame(cbind(x2,y2,z2))\n  dat2$clas=rep(2,80)\n  dat2$clas=as.factor(dat2$clas)\n  plot_ly(dat2,x=~x2,y=~y2,z=~sqrt(z2))\n\n  colnames(dat1)=c(\"x\",\"y\",\"z\",\"clas\")\n  colnames(dat2)=c(\"x\",\"y\",\"z\",\"clas\")\n  dat=as.data.frame(rbind(dat1,dat2))\n\n  plot_ly(dat,x=~x,y=~y,z=~sqrt(z),color=~clas, colors = c('#bf382a', '#0c4b8e'))\n\n\n##################################\n#projection on pca\n  kk=princomp(dat[,1:3],scores=t)\n  plot(kk$scores[,1:2],col=dat$clas)\n\n\n##################################\n#projection on kpca\nkpc <- kpca(~.,data=dat[,1:3],kernel=\"rbfdot\",\n       kpar=list(sigma=1.1),features=2, eta=0.001, maxiter=65)\n  plot(pcv(kpc),col=dat$clas)\n\nplot(predict(kpc,dat),col=as.integer(dat$clas),\nxlab=\"1st principal component\",ylab=\"2nd principal component\")\n\n\n########################################################################\n#unos datos conocidos\n data=read.table(\"measure.txt\")\n head(data)\n  x=data[,1:3]\n  pca=princomp(x,scores=t)\n  pca$scores\n  par(mfrow=c(1,2))\n  plot(pca$scores[,1],pca$scores[,2],col=c(2,4)[data[,4]])\n\n#ahora con kernel\n  kpc= kpca(~.,x,kernel=\"rbfdot\",\n         kpar=list(sigma=0.1),features=2, eta=0.001, maxiter=65)\npcv(kpc)\nplot(predict(kpc,x),col=c(2,4)[data[,4]],\nxlab=\"1st principal component\",ylab=\"2nd principal component\")"}, {"num": "13", "slug": "svd", "parte": "Reducción de dimensiones", "titulo": "SVD (descomposición en valores singulares)", "resumen": "Low rank approximation, matriz término documento, information retrieval, coseno.", "clases": "Clase 9", "teoria": "<h3>La descomposición</h3>\n<p>Cualquier matriz X de n por p se puede escribir como:</p>\n<pre><code>X = U Lambda V^t\n</code></pre>\n<ul>\n<li><code>U</code>: matriz n por n de vectores singulares izquierdos (ortonormales).</li>\n<li><code>Lambda</code>: matriz diagonal con los <strong>valores singulares</strong>, ordenados de mayor a menor.</li>\n<li><code>V</code>: matriz p por p de vectores singulares derechos (ortonormales).</li>\n</ul>\n<h3>Low Rank Approximation</h3>\n<p>La fórmula central de la clase:</p>\n<pre><code>X = U Lambda V^t  aprox  U_r Lambda_r V_r^t\n</code></pre>\n<p>Quedarse con los primeros r valores singulares da la <strong>mejor aproximación de rango r</strong> de la matriz,\nen el sentido de la norma de Frobenius (teorema de Eckart-Young). Es la versión matricial de lo que\nPCA hace con los datos.</p>\n<p>Relación con PCA: si X está centrada, los vectores singulares derechos V son exactamente los\neigenvectores de la matriz de covarianza, y los valores singulares al cuadrado son proporcionales a\nlos eigenvalores. Por eso <code>prcomp</code> en R usa SVD internamente.</p>\n<h3>Aplicación: information retrieval</h3>\n<p>Es el ejemplo del curso. Se construye la <strong>matriz término documento</strong>: filas son términos, columnas\nson documentos, y la entrada (i, j) es la frecuencia del término i en el documento j.</p>\n<p>Problemas de esa matriz: es enorme, es muy dispersa (casi todo ceros) y sufre de sinonimia\n(palabras distintas con el mismo significado) y polisemia (una palabra con varios significados).</p>\n<p>Al aplicar SVD y quedarse con rango r se obtiene <strong>Latent Semantic Indexing</strong>: los documentos y las\nconsultas se representan en un espacio de conceptos latentes de dimensión r, donde sinónimos quedan\ncerca.</p>\n<h3>Búsqueda por similitud de coseno</h3>\n<p>Una consulta q se proyecta al espacio reducido y se compara con cada documento usando el coseno del\nángulo:</p>\n<pre><code>                 &lt; v_j , q_proyectado &gt;\ncos(v_j, q) = ------------------------------\n                ||v_j|| * ||q_proyectado||\n</code></pre>\n<p>El coseno va de -1 a 1 (de 0 a 1 con frecuencias no negativas). Se usa el coseno en vez de la\ndistancia euclidiana porque <strong>no depende de la longitud del documento</strong>, solo de la dirección, es\ndecir, de la composición temática.</p>", "relacion": "<p>Código del curso, en R, con el paquete <code>tm</code> para minería de texto.</p>\n<p><strong>Paso 1, construir la matriz.</strong></p>\n<pre><code>tdm &lt;- TermDocumentMatrix(crude, control = list(removePunctuation = TRUE, stopwords = TRUE))\ntt = as.matrix(tdm)\n</code></pre>\n<p><code>crude</code> son 20 artículos sobre petróleo. <code>removePunctuation</code> y <code>stopwords</code> son limpieza estándar de\ntexto. El resultado <code>tt</code> es la matriz término documento.</p>\n<p><strong>Paso 2, descomponer.</strong></p>\n<pre><code>ss = svd(tt)\nss$d   # valores singulares\nss$u   # vectores izquierdos\nss$v   # vectores derechos\n</code></pre>\n<p>La línea <code>tt - ss$u %*% diag(ss$d) %*% t(ss$v)</code> es una <strong>verificación</strong>: debe dar prácticamente cero.\nComprueba que la descomposición reconstruye la matriz original.</p>\n<p><strong>Paso 3, aproximación de rango bajo.</strong> El código lo hace de dos formas equivalentes y luego las\nresta para mostrar que coinciden:</p>\n<ul>\n<li>Truncando las matrices: <code>ttk = ss$u[,1:10] %*% diag(ss$d[1:10]) %*% t(ss$v)[1:10,]</code></li>\n<li>Poniendo ceros en los valores singulares sobrantes:\n  <code>ttk3 = ss$u %*% diag(c(ss$d[1:10], rep(0,10))) %*% t(ss$v)</code></li>\n</ul>\n<p><code>ttk - ttk3</code> da cero. Esa equivalencia es la misma idea del truco de los ceros en la reconstrucción\nde PCA (tema 09).</p>\n<p><strong>Paso 4, consulta.</strong> Se simula una consulta binaria <code>q</code> (que términos aparecen), se proyecta al\nespacio reducido con <code>qq = diag(dd) %*% t(uu) %*% q</code> y se calculan los cosenos contra cada documento\ncon la fórmula vectorizada del final.</p>", "python": [{"titulo": "SVD y aproximación de rango bajo con numpy", "origen": "Equivalente agregado. El código del curso está en R", "code": "import numpy as np\n\n# X es la matriz a descomponer\nU, d, Vt = np.linalg.svd(X, full_matrices=False)\n\nprint(\"Valores singulares:\", d)\n\n# Verificación: reconstruye la matriz original\nreconstruida = U @ np.diag(d) @ Vt\nprint(\"Error de reconstrucción completo:\", np.max(np.abs(X - reconstruida)))\n\n# Aproximación de rango r\nr = 10\nX_r = U[:, :r] @ np.diag(d[:r]) @ Vt[:r, :]\n\nprint(\"Error con rango\", r, \":\", np.linalg.norm(X - X_r, 'fro'))\n\n# Proporción de información retenida\nprint(\"Retenido:\", np.sum(d[:r]**2)/np.sum(d**2))\n\n# Gráfico de valores singulares (decide r)\nimport matplotlib.pyplot as plt\nplt.plot(d, marker='o')\nplt.xlabel(\"Índice\")\nplt.ylabel(\"Valor singular\")\nplt.show()"}, {"titulo": "Matriz término documento, LSI y búsqueda por coseno", "origen": "Equivalente agregado. Replica el ejemplo de information retrieval del curso", "code": "import numpy as np\nfrom sklearn.feature_extraction.text import CountVectorizer\nfrom sklearn.decomposition import TruncatedSVD\nfrom sklearn.metrics.pairwise import cosine_similarity\n\ndocumentos = [\n    \"oil prices rise in the crude market\",\n    \"crude oil production falls sharply\",\n    \"stock market rallies after the report\",\n    \"prices of oil and gas increase\",\n]\n\n# Matriz documento término (sklearn la arma al revés que R)\nvectorizador = CountVectorizer(stop_words='english')\nDT = vectorizador.fit_transform(documentos).toarray()\n\nprint(vectorizador.get_feature_names_out())\nprint(DT.shape)\n\n# SVD truncado: Latent Semantic Indexing\nr = 2\nsvd = TruncatedSVD(n_components=r, random_state=0)\ndocumentos_reducidos = svd.fit_transform(DT)\n\nprint(\"Varianza explicada:\", svd.explained_variance_ratio_.sum())\n\n# Consulta: se proyecta al mismo espacio\nconsulta = vectorizador.transform([\"crude oil prices\"]).toarray()\nconsulta_reducida = svd.transform(consulta)\n\n# Similitud de coseno contra cada documento\nsimilitudes = cosine_similarity(consulta_reducida, documentos_reducidos)[0]\n\nfor i, s in enumerate(similitudes):\n    print(f\"Documento {i}: coseno = {s:.3f}\")\n\nranking = np.argsort(similitudes)[::-1]\nprint(\"Ranking de relevancia:\", ranking)"}], "r": [{"titulo": "SVD e information retrieval (código del curso)", "origen": "Del curso, code3_cass9_SVD.txt", "code": "##########################################################################\n#Spectral Value Decomposition\n#Information Retrieval Application\n\n#Library for text mining\n  library(tm)\n\n#data or 20 articles about crude oil\n  data(\"crude\")\n\n#create the term-document frequency matrix\n  tdm <- TermDocumentMatrix(crude, control = list(removePunctuation = TRUE,\n                          stopwords = TRUE))\n\n#Spectral value decomposition\n  tt=as.matrix(tdm)\n  dim(tt)\n\n  ss=svd(tt)\n\n  ss$d #check for u and v\n\n  #check the decomposition\n  tt-ss$u%*%diag(ss$d)%*%t(ss$v)\n\n#Aproximation to lower dimensión (k=10)\n  ttk=ss$u[,1:10]%*%diag(ss$d[1:10])%*%t(ss$v)[1:10,]\n\n  ttk3=ss$u%*%diag(c(ss$d[1:10],rep(0,10)))%*%t(ss$v)\n\n  ttk-ttk3\n\n#Matrices in reduced rank\n  k=20\n\n  uu=ss$u[,1:k]\n  dd=ss$d[1:k]\n  v=ss$v[,1:k]\n\n#Search - query\n  set.seed(2189)\n  q=runif(1000,0,1)\n  q=ifelse(q>=0.5,1,0)\n\n  qq=diag(dd)%*%t(uu)%*%q\n\n#Cosine calculations:\n  cos=v%*%qq/sqrt(diag(t(v)%*%v)*rep(t(qq)%*%qq,k))"}, {"titulo": "SVD básico y relación con PCA", "origen": "Equivalente agregado, no viene del material del curso", "code": "X <- as.matrix(iris[, 1:4])\n\n# SVD sobre datos centrados\nXc <- scale(X, center = TRUE, scale = FALSE)\nss <- svd(Xc)\n\nss$d        # valores singulares\nss$u        # vectores izquierdos\nss$v        # vectores derechos\n\n# Relación con PCA: v son las cargas y u %*% diag(d) son los scores\npr <- prcomp(X, center = TRUE, scale. = FALSE)\n\nround(abs(ss$v) - abs(pr$rotation), 10)          # iguales salvo signo\nround(abs(ss$u %*% diag(ss$d)) - abs(pr$x), 10)  # iguales salvo signo\n\n# Eigenvalores a partir de valores singulares\nn <- nrow(X)\nss$d^2/(n-1)\npr$sdev^2\n\n# Aproximación de rango r\nr <- 2\nXr <- ss$u[, 1:r] %*% diag(ss$d[1:r]) %*% t(ss$v[, 1:r])\n\nnorm(Xc - Xr, type = \"F\")    # error de Frob abs(pr$x), 10)  # iguales salvo signo\n\n# eigenvalores a partir de valores singulares\nn <- nrow(x)\nss$d^2/(n-1)\npr$sdev^2\n\n# aproximacion de rango r\nr <- 2\nxr <- ss$u[, 1:r] %*% diag(ss$d[1:r]) %*% t(ss$v[, 1:r])\n\nnorm(xc - xr, type = \"f\")    # error de frobenius\nsum(ss$d[1:r]^2)/sum(ss$d^2) # proporcion retenida"}, {"num": "14", "slug": "manifold", "parte": "Reducción de dimensiones", "titulo": "Manifold learning: Isomap, t-SNE, LLE", "resumen": "Reducción no lineal, distancias geodésicas, vecindades, S-curve.", "clases": "Clase 8, Clase 9", "teoria": "<h3>Qué es un manifold</h3>\n<p>Un manifold es una superficie de dimensión baja embebida en un espacio de dimensión alta. El ejemplo\ndel curso es la <strong>S-curve</strong>: una lámina de 2 dimensiones doblada dentro de R^3. Los datos viven en\n3D, pero su estructura real es 2D.</p>\n<p>PCA falla aquí porque solo aplana linealmente: dos puntos en extremos opuestos del doblez quedan\ncerca en la proyección, aunque sobre la superficie estén lejísimos.</p>\n<h3>ISOMAP</h3>\n<p>Se puede entender como una <strong>extensión de MDS</strong>. La idea es definir las distancias como la <strong>ruta\nmás corta</strong> entre dos puntos, siempre y cuando la ruta se haga a través del manifold. Es decir, para\nllegar de un punto a otro hay que pasar por vecindades pobladas, un concepto parecido al de\ndensidades en DBSCAN.</p>\n<p>Son dos pasos:</p>\n<ol>\n<li><strong>Ruta más corta</strong>: se construye un grafo conectando cada punto con sus k vecinos más cercanos y\n   se calculan las distancias geodésicas con el <strong>algoritmo de Dijkstra</strong>.</li>\n<li><strong>MDS</strong>: con esas nuevas distancias se construyen coordenadas nuevas usando MDS.</li>\n</ol>\n<p>Parámetro clave: <code>n_neighbors</code>. Si es muy grande, el grafo hace atajos por fuera del manifold\n(short-circuit) y se pierde la estructura. Si es muy pequeño, el grafo se desconecta.</p>\n<h3>t-SNE (T-distributed Stochastic Neighbor Embedding)</h3>\n<p>Convierte distancias en <strong>probabilidades de vecindad</strong>: la probabilidad de que i escoja a j como\nvecino. Luego busca coordenadas en 2D cuyas probabilidades se parezcan, minimizando la divergencia\nde Kullback-Leibler. Usa una distribución t de Student en el espacio destino, lo que da colas\npesadas y evita que todo se apiñe en el centro.</p>\n<p>Parámetro clave: <strong>perplexity</strong>, que es aproximadamente el número efectivo de vecinos. Valores\ntípicos entre 5 y 50.</p>\n<p>Advertencias importantes para el parcial: t-SNE preserva bien la <strong>estructura local</strong> pero <strong>no la\nglobal</strong>. Las distancias entre clusters en un gráfico de t-SNE no son interpretables, y los tamaños\nde los clusters tampoco. Además no es determinístico y no proyecta datos nuevos.</p>\n<h3>LLE (Local Linear Embedding)</h3>\n<p>Supone que cada punto se puede escribir como <strong>combinación lineal de sus vecinos</strong>. Estima esos\npesos W_ij en el espacio original y luego busca coordenadas de dimensión baja que conserven esos\nmismos pesos. La idea es que localmente el manifold es plano.</p>\n<p>Variantes que aparecen en el código:</p>\n<table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Idea</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>standard</code></td>\n<td>LLE clásico</td>\n</tr>\n<tr>\n<td><code>ltsa</code></td>\n<td>Local Tangent Space Alignment, alinea espacios tangentes locales</td>\n</tr>\n<tr>\n<td><code>hessian</code></td>\n<td>Hessian eigenmap, usa la curvatura, requiere más vecinos</td>\n</tr>\n<tr>\n<td><code>modified</code></td>\n<td>Modified LLE, usa varios vectores de pesos para estabilizar</td>\n</tr>\n</tbody>\n</table>\n<h3>Comparación rápida</h3>\n<table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Preserva</th>\n<th>Datos nuevos</th>\n<th>Determinístico</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>PCA</td>\n<td>varianza global</td>\n<td>sí</td>\n<td>sí</td>\n</tr>\n<tr>\n<td>Isomap</td>\n<td>distancias geodésicas globales</td>\n<td>sí</td>\n<td>sí</td>\n</tr>\n<tr>\n<td>LLE</td>\n<td>geometría local lineal</td>\n<td>sí</td>\n<td>depende</td>\n</tr>\n<tr>\n<td>t-SNE</td>\n<td>vecindades locales</td>\n<td>no</td>\n<td>no</td>\n</tr>\n</tbody>\n</table>", "relacion": "<p>Todo sale del módulo <code>manifold</code> de sklearn, y los tres métodos comparten la misma interfaz:\n<code>fit_transform(S_points)</code>.</p>\n<p><strong>Datos.</strong> <code>datasets.make_s_curve(n_samples, random_state=0)</code> devuelve dos cosas: <code>S_points</code>, que son\nlas coordenadas en 3D, y <code>S_color</code>, que es la posición de cada punto <strong>a lo largo de la curva</strong>. Ese\ncolor es el criterio de evaluación: si el embedding es bueno, el degradado de color queda continuo y\nordenado en 2D. Si el color se mezcla, el método rompió el manifold.</p>\n<p><strong>Las funciones de graficación</strong> (<code>plot_3d</code>, <code>plot_2d</code>, <code>add_2d_scatter</code>) son utilitarias del\nnotebook, no parte del método. Vale la pena tenerlas a mano porque el parcial puede pedir el gráfico.</p>\n<p><strong>Isomap:</strong> <code>manifold.Isomap(n_neighbors=10, n_components=2, p=1)</code>. El <code>p=1</code> fija la métrica de\nMinkowski en distancia Manhattan.</p>\n<p><strong>t-SNE:</strong> <code>manifold.TSNE(n_components=2, perplexity=10, init=\"random\", max_iter=250,\nrandom_state=0)</code>. Con <code>max_iter=250</code> el algoritmo apenas converge, es un valor bajo para que corra\nrápido en clase.</p>\n<p><strong>LLE:</strong> el notebook usa un truco útil. Define un diccionario <code>params</code> con los argumentos comunes y\nlo desempaqueta con <code>**params</code> en las cuatro variantes:</p>\n<pre><code>params = {&quot;n_neighbors&quot;: n_neighbors, &quot;n_components&quot;: n_components,\n          &quot;eigen_solver&quot;: &quot;auto&quot;, &quot;random_state&quot;: 0}\nlle_standard = manifold.LocallyLinearEmbedding(method=&quot;standard&quot;, **params)\n</code></pre>\n<p>Así solo cambia el argumento <code>method</code> entre <code>standard</code>, <code>ltsa</code>, <code>hessian</code> y <code>modified</code>.</p>", "python": [{"titulo": "Datos S-curve y funciones de graficación", "origen": "Del curso, class9_book1_manifold.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nimport mpl_toolkits.mplot3d  # noqa: F401\nfrom matplotlib import ticker\nfrom sklearn import datasets, manifold\n\nn_samples = 1500\nS_points, S_color = datasets.make_s_curve(n_samples, random_state=0)\n\ndef plot_3d(points, points_color, title):\n    x, y, z = points.T\n    fig, ax = plt.subplots(\n        figsize=(6, 6), facecolor=\"white\", tight_layout=True,\n        subplot_kw={\"projection\": \"3d\"},\n    )\n    fig.suptitle(title, size=16)\n    col = ax.scatter(x, y, z, c=points_color, s=50, alpha=0.8)\n    ax.view_init(azim=-60, elev=9)\n    ax.xaxis.set_major_locator(ticker.MultipleLocator(1))\n    ax.yaxis.set_major_locator(ticker.MultipleLocator(1))\n    ax.zaxis.set_major_locator(ticker.MultipleLocator(1))\n    fig.colorbar(col, ax=ax, orientation=\"horizontal\", shrink=0.6, aspect=60, pad=0.01)\n    plt.show()\n\ndef plot_2d(points, points_color, title):\n    fig, ax = plt.subplots(figsize=(3, 3), facecolor=\"white\", constrained_layout=True)\n    fig.suptitle(title, size=16)\n    add_2d_scatter(ax, points, points_color)\n    plt.show()\n\ndef add_2d_scatter(ax, points, points_color, title=None):\n    x, y = points.T\n    ax.scatter(x, y, c=points_color, s=50, alpha=0.8)\n    ax.set_title(title)\n    ax.xaxis.set_major_formatter(ticker.NullFormatter())\n    ax.yaxis.set_major_formatter(ticker.NullFormatter())\n\nplot_3d(S_points, S_color, \"Original S-curve samples\")"}, {"titulo": "Isomap y t-SNE", "origen": "Del curso, class9_book1_manifold.ipynb", "code": "n_neighbors = 10\nn_components = 2\n\n# ISOMAP\nisomap = manifold.Isomap(n_neighbors=n_neighbors, n_components=n_components, p=1)\nS_isomap = isomap.fit_transform(S_points)\n\nplot_2d(S_isomap, S_color, \"Isomap Embedding\")\n\n\n# T-distributed Stochastic Neighbor Embedding\nt_sne = manifold.TSNE(\n    n_components=n_components,\n    perplexity=10,\n    init=\"random\",\n    max_iter=250,\n    random_state=0,\n)\nS_t_sne = t_sne.fit_transform(S_points)\n\nplot_2d(S_t_sne, S_color, \"T-distributed Stochastic  \\n Neighbor Embedding\")"}, {"titulo": "Las cuatro variantes de LLE", "origen": "Del curso, class9_book1_manifold.ipynb", "code": "params = {\n    \"n_neighbors\": n_neighbors,\n    \"n_components\": n_components,\n    \"eigen_solver\": \"auto\",\n    \"random_state\": 0,\n}\n\nlle_standard = manifold.LocallyLinearEmbedding(method=\"standard\", **params)\nS_standard = lle_standard.fit_transform(S_points)\n\nlle_ltsa = manifold.LocallyLinearEmbedding(method=\"ltsa\", **params)\nS_ltsa = lle_ltsa.fit_transform(S_points)\n\nlle_hessian = manifold.LocallyLinearEmbedding(method=\"hessian\", **params)\nS_hessian = lle_hessian.fit_transform(S_points)\n\nlle_mod = manifold.LocallyLinearEmbedding(method=\"modified\", **params)\nS_mod = lle_mod.fit_transform(S_points)\n\n\nfig, axs = plt.subplots(\n    nrows=2, ncols=2, figsize=(7, 7), facecolor=\"white\", constrained_layout=True\n)\nfig.suptitle(\"Locally Linear Embeddings\", size=16)\n\nlle_methods = [\n    (\"Standard locally linear embedding\", S_standard),\n    (\"Local tangent space alignment\", S_ltsa),\n    (\"Hessian eigenmap\", S_hessian),\n    (\"Modified locally linear embedding\", S_mod),\n]\nfor ax, method in zip(axs.flat, lle_methods):\n    name, points = method\n    add_2d_scatter(ax, points, S_color, name)\n\nplt.show()"}], "r": [{"titulo": "Isomap, LLE y t-SNE en R", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Datos tipo S-curve o swiss roll\nlibrary(dimRed)\nlibrary(vegan)\nlibrary(lle)\nlibrary(Rtsne)\n\n# Generar un swiss roll (análogo a la S-curve)\nset.seed(0)\nn <- 1000\nt <- (3*pi/2) * (1 + 2*runif(n))\nh <- 21 * runif(n)\nX <- cbind(t*cos(t), h, t*sin(t))\ncolor <- t\n\nlibrary(scatterplot3d)\nscatterplot3d(X, color = rainbow(n)[rank(color)], pch = 16)\n\n\n# ISOMAP (paquete vegan)\ndis <- dist(X)\niso <- isomap(dis, k = 10, ndim = 2)\nplot(iso$points, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"Isomap\")\n\n\n# LLE (paquete lle)\n# calc_k ayuda a escoger el número de vecinos\n# k_opt <- calc_k(X, m = 2, kmin = 5, kmax = 20)\nres_lle <- lle(X, m = 2, k = 10)\nplot(res_lle$Y, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"LLE\")\n\n\n# t-SNE (paquete Rtsne)\nres_tsne <- Rtsne(X, dims = 2, perplexity = 30, max_iter = 500, check_duplicates = FALSE)\nplot(res_tsne$Y, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"t-SNE\")\n\n\n# Comparación con PCA lineal\npr <- prcomp(X)\nplot(pr$x[, 1:2], col = rainbow(n)[rank(color)], pch = 16,\n     main = \"PCA (no logra desenrollar)\")"}], "busqueda": "14 manifold learning: isomap, t-sne, lle reduccion no lineal, distancias geodesicas, vecindades, s-curve. reduccion de dimensiones clase 8, clase 9  que es un manifold \n un manifold es una superficie de dimension baja embebida en un espacio de dimension alta. el ejemplo\ndel curso es la  s-curve : una lamina de 2 dimensiones doblada dentro de r^3. los datos viven en\n3d, pero su estructura real es 2d. \n pca falla aqui porque solo aplana linealmente: dos puntos en extremos opuestos del doblez quedan\ncerca en la proyeccion, aunque sobre la superficie esten lejisimos. \n isomap \n se puede entender como una  extension de mds . la idea es definir las distancias como la  ruta\nmas corta  entre dos puntos, siempre y cuando la ruta se haga a traves del manifold. es decir, para\nllegar de un punto a otro hay que pasar por vecindades pobladas, un concepto parecido al de\ndensidades en dbscan. \n son dos pasos: \n \n  ruta mas corta : se construye un grafo conectando cada punto con sus k vecinos mas cercanos y\n   se calculan las distancias geodesicas con el  algoritmo de dijkstra . \n  mds : con esas nuevas distancias se construyen coordenadas nuevas usando mds. \n \n parametro clave:  n_neighbors . si es muy grande, el grafo hace atajos por fuera del manifold\n(short-circuit) y se pierde la estructura. si es muy pequeno, el grafo se desconecta. \n t-sne (t-distributed stochastic neighbor embedding) \n convierte distancias en  probabilidades de vecindad : la probabilidad de que i escoja a j como\nvecino. luego busca coordenadas en 2d cuyas probabilidades se parezcan, minimizando la divergencia\nde kullback-leibler. usa una distribucion t de student en el espacio destino, lo que da colas\npesadas y evita que todo se apine en el centro. \n parametro clave:  perplexity , que es aproximadamente el numero efectivo de vecinos. valores\ntipicos entre 5 y 50. \n advertencias importantes para el parcial: t-sne preserva bien la  estructura local  pero  no la\nglobal . las distancias entre clusters en un grafico de t-sne no son interpretables, y los tamanos\nde los clusters tampoco. ademas no es deterministico y no proyecta datos nuevos. \n lle (local linear embedding) \n supone que cada punto se puede escribir como  combinacion lineal de sus vecinos . estima esos\npesos w_ij en el espacio original y luego busca coordenadas de dimension baja que conserven esos\nmismos pesos. la idea es que localmente el manifold es plano. \n variantes que aparecen en el codigo: \n \n \n \n metodo \n idea \n \n \n \n \n  standard  \n lle clasico \n \n \n  ltsa  \n local tangent space alignment, alinea espacios tangentes locales \n \n \n  hessian  \n hessian eigenmap, usa la curvatura, requiere mas vecinos \n \n \n  modified  \n modified lle, usa varios vectores de pesos para estabilizar \n \n \n \n comparacion rapida \n \n \n \n metodo \n preserva \n datos nuevos \n deterministico \n \n \n \n \n pca \n varianza global \n si \n si \n \n \n isomap \n distancias geodesicas globales \n si \n si \n \n \n lle \n geometria local lineal \n si \n depende \n \n \n t-sne \n vecindades locales \n no \n no \n \n \n  datos s-curve y funciones de graficacion import numpy as np\nimport matplotlib.pyplot as plt\nimport mpl_toolkits.mplot3d  # noqa: f401\nfrom matplotlib import ticker\nfrom sklearn import datasets, manifold\n\nn_samples = 1500\ns_points, s_color = datasets.make_s_curve(n_samples, random_state=0)\n\ndef plot_3d(points, points_color, title):\n    x, y, z = points.t\n    fig, ax = plt.subplots(\n        figsize=(6, 6), facecolor=\"white\", tight_layout=true,\n        subplot_kw={\"projection\": \"3d\"},\n    )\n    fig.suptitle(title, size=16)\n    col = ax.scatter(x, y, z, c=points_color, s=50, alpha=0.8)\n    ax.view_init(azim=-60, elev=9)\n    ax.xaxis.set_major_locator(ticker.multiplelocator(1))\n    ax.yaxis.set_major_locator(ticker.multiplelocator(1))\n    ax.zaxis.set_major_locator(ticker.multiplelocator(1))\n    fig.colorbar(col, ax=ax, orientation=\"horizontal\", shrink=0.6, aspect=60, pad=0.01)\n    plt.show()\n\ndef plot_2d(points, points_color, title):\n    fig, ax = plt.subplots(figsize=(3, 3), facecolor=\"white\", constrained_layout=true)\n    fig.suptitle(title, size=16)\n    add_2d_scatter(ax, points, points_color)\n    plt.show()\n\ndef add_2d_scatter(ax, points, points_color, title=none):\n    x, y = points.t\n    ax.scatter(x, y, c=points_color, s=50, alpha=0.8)\n    ax.set_title(title)\n    ax.xaxis.set_major_formatter(ticker.nullformatter())\n    ax.yaxis.set_major_formatter(ticker.nullformatter())\n\nplot_3d(s_points, s_color, \"original s-curve samples\") isomap y t-sne n_neighbors = 10\nn_components = 2\n\n# isomap\nisomap = manifold.isomap(n_neighbors=n_neighbors, n_components=n_components, p=1)\ns_isomap = isomap.fit_transform(s_points)\n\nplot_2d(s_isomap, s_color, \"isomap embedding\")\n\n\n# t-distributed stochastic neighbor embedding\nt_sne = manifold.tsne(\n    n_components=n_components,\n    perplexity=10,\n    init=\"random\",\n    max_iter=250,\n    random_state=0,\n)\ns_t_sne = t_sne.fit_transform(s_points)\n\nplot_2d(s_t_sne, s_color, \"t-distributed stochastic  \\n neighbor embedding\") las cuatro variantes de lle params = {\n    \"n_neighbors\": n_neighbors,\n    \"n_components\": n_components,\n    \"eigen_solver\": \"auto\",\n    \"random_state\": 0,\n}\n\nlle_standard = manifold.locallylinearembedding(method=\"standard\", **params)\ns_standard = lle_standard.fit_transform(s_points)\n\nlle_ltsa = manifold.locallylinearembedding(method=\"ltsa\", **params)\ns_ltsa = lle_ltsa.fit_transform(s_points)\n\nlle_hessian = manifold.locallylinearembedding(method=\"hessian\", **params)\ns_hessian = lle_hessian.fit_transform(s_points)\n\nlle_mod = manifold.locallylinearembedding(method=\"modified\", **params)\ns_mod = lle_mod.fit_transform(s_points)\n\n\nfig, axs = plt.subplots(\n    nrows=2, ncols=2, figsize=(7, 7), facecolor=\"white\", constrained_layout=true\n)\nfig.suptitle(\"locally linear embeddings\", size=16)\n\nlle_methods = [\n    (\"standard locally linear embedding\", s_standard),\n    (\"local tangent space alignment\", s_ltsa),\n    (\"hessian eigenmap\", s_hessian),\n    (\"modified locally linear embedding\", s_mod),\n]\nfor ax, method in zip(axs.flat, lle_methods):\n    name, points = method\n    add_2d_scatter(ax, points, s_color, name)\n\nplt.show() isomap, lle y t-sne en r # datos tipo s-curve o swiss roll\nlibrary(dimred)\nlibrary(vegan)\nlibrary(lle)\nlibrary(rtsne)\n\n# generar un swiss roll (analogo a la s-curve)\nset.seed(0)\nn <- 1000\nt <- (3*pi/2) * (1 + 2*runif(n))\nh <- 21 * runif(n)\nx <- cbind(t*cos(t), h, t*sin(t))\ncolor <- t\n\nlibrary(scatterplot3d)\nscatterplot3d(x, color = rainbow(n)[rank(color)], pch = 16)\n\n\n# isomap (paquete vegan)\ndis <- dist(x)\niso <- isomap(dis, k = 10, ndim = 2)\nplot(iso$points, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"isomap\")\n\n\n# lle (paquete lle)\n# calc_k ayuda a escoger el numero de vecinos\n# k_opt <- calc_k(x, m = 2, kmin = 5, kmax = 20)\nres_lle <- lle(x, m = 2, k = 10)\nplot(res_lle$y, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"lle\")\n\n\n# t-sne (paquete rtsne)\nres_tsne <- rtsne(x, dims = 2, perplexity = 30, max_iter = 500, check_duplicates = false)\nplot(res_tsne$y, col = rainbow(n)[rank(color)], pch = 16,\n     main = \"t-sne\")\n\n\n# comparacion con pca lineal\npr <- prcomp(x)\nplot(pr$x[, 1:2], col = rainbow(n)[rank(color)], pch = 16,\n     main = \"pca (no logra desenrollar)\")"}, {"num": "15", "slug": "sesgo-varianza", "parte": "Supervisado", "titulo": "EPE, MSE y el balance sesgo varianza", "resumen": "Error irreducible, flexibilidad, curva en U del MSE de test.", "clases": "Clase 10, Clase 11", "teoria": "<h3>El objetivo</h3>\n<p>Encontrar una función f que, dado X, prediga Y lo mejor posible. La función óptima bajo error\ncuadrático es la media condicional:</p>\n<pre><code>f_optima(x) = E[ Y | X = x ]\n</code></pre>\n<p>Los datos se generan como:</p>\n<pre><code>Y = f_optima(X) + epsilon,   E[epsilon] = 0,  Var(epsilon) = sigma^2\n</code></pre>\n<h3>EPE (Expected Prediction Error)</h3>\n<p>Para un punto nuevo x0:</p>\n<pre><code>EPE(x0) = E[ (Y - fhat(x0))^2 ]\n        = sigma^2  +  [ Sesgo(fhat(x0)) ]^2  +  Var( fhat(x0) )\n</code></pre>\n<p>Los tres términos:</p>\n<ol>\n<li><strong>sigma^2</strong>, error irreducible. No depende del modelo. Es el piso.</li>\n<li><strong>Sesgo al cuadrado</strong>, cuánto se aleja en promedio el modelo de la función real. Baja cuando sube\n   la flexibilidad.</li>\n<li><strong>Varianza</strong>, cuánto cambia el modelo estimado si se cambia la muestra de entrenamiento. Sube\n   cuando sube la flexibilidad.</li>\n</ol>\n<p>El balance entre 2 y 3 produce la <strong>curva en U</strong> del error de test.</p>\n<h3>MSE como estimador del EPE</h3>\n<pre><code>                1\nMSE = ---------------- * sum_i ( yhat_i - y_i )^2\n          n_muestra\n</code></pre>\n<p>Regla central del curso, y la que más se pregunta:</p>\n<ul>\n<li><strong>MSE en train siempre baja</strong> cuando el modelo se vuelve más flexible. Con flexibilidad máxima\n  llega a cero. Por eso <strong>no sirve para calibrar</strong>.</li>\n<li><strong>MSE en test tiene forma de U</strong>. El mínimo de esa curva es el nivel de flexibilidad calibrado.</li>\n</ul>\n<h3>Flexibilidad</h3>\n<p>Cada modelo tiene su parámetro de flexibilidad:</p>\n<table>\n<thead>\n<tr>\n<th>Modelo</th>\n<th>Parámetro</th>\n<th>Más flexible cuando</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>k vecinos</td>\n<td>k</td>\n<td>k pequeño</td>\n</tr>\n<tr>\n<td>Kernel regression</td>\n<td>h (ventana)</td>\n<td>h pequeño</td>\n</tr>\n<tr>\n<td>Regresión lineal</td>\n<td>número de variables</td>\n<td>más variables</td>\n</tr>\n<tr>\n<td>Ridge, LASSO, Elastic Net</td>\n<td>lambda</td>\n<td>lambda pequeño</td>\n</tr>\n</tbody>\n</table>\n<p>Ojo con la dirección: en k vecinos y en kernel regression el parámetro es <strong>inversamente</strong>\nproporcional a la flexibilidad.</p>\n<h3>Por qué importa el tamaño de muestra</h3>\n<p>Con n pequeño, dos muestras de la misma población producen modelos muy distintos. Esa es la varianza\ndel estimador, y es la razón por la cual no se puede evaluar un modelo en los mismos datos con que\nse entrenó.</p>", "relacion": "<p>El notebook <code>class10_book1_intro</code> construye todo el escenario controlado:</p>\n<ul>\n<li><code>f(x)</code> es la <code>f_optima</code>. Conocerla es un lujo que solo existe en simulación, y es lo que permite\n  comparar la estimación contra la verdad.</li>\n<li><code>sd = 1.2</code> es sigma, el error irreducible. Ese valor es el piso del MSE que ningún modelo baja.</li>\n<li>Generar <code>x1, y1</code> y <code>x2, y2</code> con <code>n = 10</code> y graficarlas lado a lado es la demostración visual de la\n  varianza.</li>\n</ul>\n<p>El notebook <code>class10_book2_kernel</code> es donde aparece la curva en U. El código compara al tiempo:</p>\n<ul>\n<li><code>mse_train[i]</code>: calculado prediciendo sobre <code>x_train</code> con el modelo entrenado en <code>x_train</code>.</li>\n<li><code>mse_test[i]</code>: calculado prediciendo sobre <code>x_test</code> con el modelo entrenado en <code>x_train</code>.</li>\n</ul>\n<p>Al graficar ambas contra <code>hh</code>, la roja (train) es monótona y la azul (test) es convexa. El código\nextrae el óptimo con <code>h_opt = hh[np.argmin(mse_test)]</code>.</p>\n<p>Nota sobre la dirección del eje: como h grande significa menos flexibilidad, la curva se lee al\nrevés de la gráfica típica de flexibilidad. El comentario del propio código lo advierte.</p>", "python": [{"titulo": "Escenario controlado: f_optima, sigma y muestras", "origen": "Del curso, class10_book1_intro.ipynb", "code": "import math\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport random\n\na = 0.3\nb = 0.2\n\ndef f(x):\n    z = 2 + x**(a) * math.cos(x/b)\n    return(z)\n\npoints = np.arange(1.0, 5.0, 0.01)\nf_mean = np.frompyfunc(f, 1, 1)\nplt.plot(points, f_mean(points))\n\nn = 400\nx = np.random.uniform(1.0, 5.0, n)\nsd = 1.2                              # sigma: error irreducible\ny = f_mean(x) + np.random.normal(0, sd, n)\n\nplt.plot(x, y, 'o')"}, {"titulo": "Partición train y test manual", "origen": "Del curso, class10_book2_kernel.ipynb", "code": "prop_train = 0.75\nn_train = int(n*prop_train)\ntrain_index = random.sample(range(len(x)), n_train)\n\nx_train = x[train_index]\ny_train = y[train_index]\n\nx_test = np.delete(x, train_index)\ny_test = np.delete(y, train_index)\n\n# Sin semilla la partición cambia en cada corrida.\n# La alternativa es train_test_split de sklearn.model_selection"}, {"titulo": "Curva en U: MSE de train contra MSE de test", "origen": "Del curso, class10_book2_kernel.ipynb", "code": "hh = np.arange(0.01, 1, 0.002)   # secuencia de niveles de flexibilidad\n\nmse_train = np.repeat(0.0, len(hh))\nmse_test = np.repeat(0.0, len(hh))\n\nfor i in range(len(hh)):\n    fhat_train = kernelreg(x_train, x_train, y_train, hh[i])\n    fhat_test = kernelreg(x_test, x_train, y_train, hh[i])\n    mse_train[i] = (sum((fhat_train-y_train)**2)/n_train)\n    mse_test[i] = sum((fhat_test-y_test)**2)/(n-n_train)\n\n# Rojo: MSE de train. Cuando h va a cero, el MSE va a cero\n# Azul: MSE de test. Función convexa\nplt.plot(hh, mse_train, \"r\", linewidth='3')\nplt.plot(hh, mse_test, \"b\", linewidth='3')\n\n# Punto calibrado\nh_opt = hh[np.argmin(mse_test)]\nmse_opt = min(mse_test)\n\nprint(\"h óptimo:\", h_opt)\nprint(\"MSE mínimo en test:\", mse_opt)"}], "r": [{"titulo": "Curva en U en R con k vecinos", "origen": "Equivalente agregado, no viene del material del curso", "code": "library(FNN)\n\n# Escenario controlado\nset.seed(1)\na <- 0.3\nb <- 0.2\nf <- function(x) 2 + x^a * cos(x/b)\n\nn <- 400\nx <- runif(n, 1, 5)\nsd_err <- 1.2\ny <- f(x) + rnorm(n, 0, sd_err)\n\n# Partición\nprop_train <- 0.75\nn_train <- floor(n*prop_train)\nidx <- sample(1:n, n_train)\n\nx_train <- x[idx] ; y_train <- y[idx]\nx_test  <- x[-idx] ; y_test  <- y[-idx]\n\n# Curva de MSE variando k\nks <- 1:60\nmse_train <- rep(0, length(ks))\nmse_test  <- rep(0, length(ks))\n\nfor (i in seq_along(ks)) {\n  k <- ks[i]\n  pred_tr <- knn.reg(train = matrix(x_train), test = matrix(x_train),\n                     y = y_train, k = k)$pred\n  pred_te <- knn.reg(train = matrix(x_train), test = matrix(x_test),\n                     y = y_train, k = k)$pred\n  mse_train[i] <- mean((pred_tr - y_train)^2)\n  mse_test[i]  <- mean((pred_te - y_test)^2)\n}\n\nplot(ks, mse_test, type = \"l\", col = \"blue\", lwd = 3,\n     ylim = range(c(mse_train, mse_test)),\n     xlab = \"k (k grande = menos flexible)\", ylab = \"MSE\")\nlines(ks, mse_train, col = \"red\", lwd = 3)\nabline(h = sd_err^2, lty = 2)   # error irreducible\n\nk_opt <- ks[which.min(mse_test)]\nk_opt\nmin(mse_test)"}], "busqueda": "15 epe, mse y el balance sesgo varianza error irreducible, flexibilidad, curva en u del mse de test. supervisado clase 10, clase 11  el objetivo \n encontrar una funcion f que, dado x, prediga y lo mejor posible. la funcion optima bajo error\ncuadratico es la media condicional: \n  f_optima(x) = e[ y | x = x ]\n  \n los datos se generan como: \n  y = f_optima(x) + epsilon,   e[epsilon] = 0,  var(epsilon) = sigma^2\n  \n epe (expected prediction error) \n para un punto nuevo x0: \n  epe(x0) = e[ (y - fhat(x0))^2 ]\n        = sigma^2  +  [ sesgo(fhat(x0)) ]^2  +  var( fhat(x0) )\n  \n los tres terminos: \n \n  sigma^2 , error irreducible. no depende del modelo. es el piso. \n  sesgo al cuadrado , cuanto se aleja en promedio el modelo de la funcion real. baja cuando sube\n   la flexibilidad. \n  varianza , cuanto cambia el modelo estimado si se cambia la muestra de entrenamiento. sube\n   cuando sube la flexibilidad. \n \n el balance entre 2 y 3 produce la  curva en u  del error de test. \n mse como estimador del epe \n                  1\nmse = ---------------- * sum_i ( yhat_i - y_i )^2\n          n_muestra\n  \n regla central del curso, y la que mas se pregunta: \n \n  mse en train siempre baja  cuando el modelo se vuelve mas flexible. con flexibilidad maxima\n  llega a cero. por eso  no sirve para calibrar . \n  mse en test tiene forma de u . el minimo de esa curva es el nivel de flexibilidad calibrado. \n \n flexibilidad \n cada modelo tiene su parametro de flexibilidad: \n \n \n \n modelo \n parametro \n mas flexible cuando \n \n \n \n \n k vecinos \n k \n k pequeno \n \n \n kernel regression \n h (ventana) \n h pequeno \n \n \n regresion lineal \n numero de variables \n mas variables \n \n \n ridge, lasso, elastic net \n lambda \n lambda pequeno \n \n \n \n ojo con la direccion: en k vecinos y en kernel regression el parametro es  inversamente \nproporcional a la flexibilidad. \n por que importa el tamano de muestra \n con n pequeno, dos muestras de la misma poblacion producen modelos muy distintos. esa es la varianza\ndel estimador, y es la razon por la cual no se puede evaluar un modelo en los mismos datos con que\nse entreno.  escenario controlado: f_optima, sigma y muestras import math\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport random\n\na = 0.3\nb = 0.2\n\ndef f(x):\n    z = 2 + x**(a) * math.cos(x/b)\n    return(z)\n\npoints = np.arange(1.0, 5.0, 0.01)\nf_mean = np.frompyfunc(f, 1, 1)\nplt.plot(points, f_mean(points))\n\nn = 400\nx = np.random.uniform(1.0, 5.0, n)\nsd = 1.2                              # sigma: error irreducible\ny = f_mean(x) + np.random.normal(0, sd, n)\n\nplt.plot(x, y, 'o') particion train y test manual prop_train = 0.75\nn_train = int(n*prop_train)\ntrain_index = random.sample(range(len(x)), n_train)\n\nx_train = x[train_index]\ny_train = y[train_index]\n\nx_test = np.delete(x, train_index)\ny_test = np.delete(y, train_index)\n\n# sin semilla la particion cambia en cada corrida.\n# la alternativa es train_test_split de sklearn.model_selection curva en u: mse de train contra mse de test hh = np.arange(0.01, 1, 0.002)   # secuencia de niveles de flexibilidad\n\nmse_train = np.repeat(0.0, len(hh))\nmse_test = np.repeat(0.0, len(hh))\n\nfor i in range(len(hh)):\n    fhat_train = kernelreg(x_train, x_train, y_train, hh[i])\n    fhat_test = kernelreg(x_test, x_train, y_train, hh[i])\n    mse_train[i] = (sum((fhat_train-y_train)**2)/n_train)\n    mse_test[i] = sum((fhat_test-y_test)**2)/(n-n_train)\n\n# rojo: mse de train. cuando h va a cero, el mse va a cero\n# azul: mse de test. funcion convexa\nplt.plot(hh, mse_train, \"r\", linewidth='3')\nplt.plot(hh, mse_test, \"b\", linewidth='3')\n\n# punto calibrado\nh_opt = hh[np.argmin(mse_test)]\nmse_opt = min(mse_test)\n\nprint(\"h optimo:\", h_opt)\nprint(\"mse minimo en test:\", mse_opt) curva en u en r con k vecinos library(fnn)\n\n# escenario controlado\nset.seed(1)\na <- 0.3\nb <- 0.2\nf <- function(x) 2 + x^a * cos(x/b)\n\nn <- 400\nx <- runif(n, 1, 5)\nsd_err <- 1.2\ny <- f(x) + rnorm(n, 0, sd_err)\n\n# particion\nprop_train <- 0.75\nn_train <- floor(n*prop_train)\nidx <- sample(1:n, n_train)\n\nx_train <- x[idx] ; y_train <- y[idx]\nx_test  <- x[-idx] ; y_test  <- y[-idx]\n\n# curva de mse variando k\nks <- 1:60\nmse_train <- rep(0, length(ks))\nmse_test  <- rep(0, length(ks))\n\nfor (i in seq_along(ks)) {\n  k <- ks[i]\n  pred_tr <- knn.reg(train = matrix(x_train), test = matrix(x_train),\n                     y = y_train, k = k)$pred\n  pred_te <- knn.reg(train = matrix(x_train), test = matrix(x_test),\n                     y = y_train, k = k)$pred\n  mse_train[i] <- mean((pred_tr - y_train)^2)\n  mse_test[i]  <- mean((pred_te - y_test)^2)\n}\n\nplot(ks, mse_test, type = \"l\", col = \"blue\", lwd = 3,\n     ylim = range(c(mse_train, mse_test)),\n     xlab = \"k (k grande = menos flexible)\", ylab = \"mse\")\nlines(ks, mse_train, col = \"red\", lwd = 3)\nabline(h = sd_err^2, lty = 2)   # error irreducible\n\nk_opt <- ks[which.min(mse_test)]\nk_opt\nmin(mse_test)"}, {"num": "16", "slug": "kernel-regression", "parte": "Supervisado", "titulo": "Kernel regression y k vecinos", "resumen": "Modelos flexibles no paramétricos, ventana h, calibración por MSE de test.", "clases": "Clase 10, Clase 11", "teoria": "<h3>Kernel regression rectangular</h3>\n<p>Para predecir Y<em> dado un valor particular X</em>, se buscan en la muestra de entrenamiento los valores\nobservados X_i que caigan dentro del intervalo [X<em> - h, X</em> + h] alrededor de X<em>. La predicción es el\n</em><em>promedio de los Y_i</em>* correspondientes:</p>\n<pre><code>                sum_i  I( |X_i - X*| &lt;= h ) * Y_i\nfhat(X*) =  -------------------------------------\n                sum_i  I( |X_i - X*| &lt;= h )\n</code></pre>\n<p>donde I(a) es la función indicadora, que vale 1 cuando la condición es cierta y 0 cuando es falsa.</p>\n<h3>Relación con k vecinos</h3>\n<p>Son primos. La diferencia:</p>\n<ul>\n<li><strong>k vecinos</strong>: se fija el <strong>número</strong> de puntos cercanos. La ventana cambia de ancho según la\n  densidad local.</li>\n<li><strong>Kernel regression</strong>: se fija el <strong>ancho</strong> de la ventana. El número de puntos cambia según la\n  densidad local.</li>\n</ul>\n<p>En ambos la predicción es un promedio local de los Y.</p>\n<h3>El parámetro h</h3>\n<p>h controla la flexibilidad de forma <strong>inversa</strong>:</p>\n<ul>\n<li><strong>h grande</strong>: la ventana abarca muchos puntos, la función estimada queda muy suave. Hay <strong>sesgo</strong>,\n  falta flexibilidad. En el ejemplo del curso, h = 0.4 ya suaviza demasiado.</li>\n<li><strong>h pequeño</strong>: la ventana abarca pocos puntos, la función estimada sigue el ruido. Hay mucha\n  <strong>varianza</strong>, exceso de flexibilidad. Con h = 0.03 la curva estimada es un zigzag.</li>\n</ul>\n<p>La calibración no se puede hacer a ojo. Se recorre una secuencia de valores de h, se calcula el MSE\nen la muestra de test para cada uno, y se toma el h que lo minimiza.</p>\n<h3>Problema de las colas</h3>\n<p>Cerca de los extremos del rango de X la ventana queda incompleta y hay menos puntos. Ahí el\nestimador es menos confiable. En el código esto se ve en el <code>max(..., 0.1)</code> del denominador, que\nevita una división por cero cuando no cae ningún punto dentro de la ventana.</p>", "relacion": "<p>La función <code>kernelreg(xstar, X, Y, h)</code> es el corazón del tema. Sus argumentos:</p>\n<ul>\n<li><code>xstar</code>: los puntos <strong>nuevos</strong> donde se quiere predecir.</li>\n<li><code>X</code>, <code>Y</code>: los datos de <strong>entrenamiento</strong>.</li>\n<li><code>h</code>: el semiancho de la ventana.</li>\n</ul>\n<p>Línea por línea:</p>\n<pre><code class=\"language-python\">dist = abs(xstar[i] - X)                  # distancia del punto nuevo a cada dato de train\nzz = np.where(dist &lt;= h, Y, 0)            # deja el Y si está dentro de la ventana, si no pone 0\npred[i] = sum(zz) / max(sum(np.where(dist &lt;= h, 1, 0)), 0.1)\n</code></pre>\n<ul>\n<li><code>sum(zz)</code> es el numerador de la fórmula: la suma de los Y dentro de la ventana.</li>\n<li><code>sum(np.where(dist &lt;= h, 1, 0))</code> es el denominador: cuántos puntos cayeron dentro.</li>\n<li>El <code>max(..., 0.1)</code> protege contra la división por cero cuando la ventana está vacía.</li>\n</ul>\n<p>Fíjate en el orden de los argumentos al calcular los dos MSE, porque es el error más común:</p>\n<pre><code class=\"language-python\">fhat_train = kernelreg(x_train, x_train, y_train, hh[i])   # predice EN train, entrenado CON train\nfhat_test  = kernelreg(x_test,  x_train, y_train, hh[i])   # predice EN test,  entrenado CON train\n</code></pre>\n<p>El segundo argumento y el tercero <strong>siempre son los datos de entrenamiento</strong>. Lo único que cambia es\ndonde se predice.</p>\n<p>Para k vecinos la versión con librería es <code>KNeighborsRegressor(n_neighbors=vecinos)</code> y el flujo es\nel estándar de sklearn: <code>.fit(XTrain, yTrain)</code> y luego <code>.predict(XTest)</code>.</p>", "python": [{"titulo": "Implementación de kernel regression", "origen": "Del curso, class11_book1.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\n\ndef kernelreg(xstar, X, Y, h):\n    pred = np.repeat(0.0, len(xstar))\n    for i in range(len(xstar)):\n        dist = list()\n        dist = abs(xstar[i]-X)\n        zz = np.where(dist <= h, Y, 0)\n        pred[i] = sum(zz)/max(sum(np.where(dist <= h, 1, 0)), 0.1)\n    return(pred)\n\n\nxstar = np.arange(1.0, 5.0, .01)\n\n# h grande: mucha suavidad, hay SESGO\nyyy = kernelreg(xstar, x_train, y_train, .4)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")     # datos en negro\nplt.plot(points, f_mean(points), \"r\", linewidth='3') # función óptima en rojo\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2')  # función estimada en azul\n\n# h pequeño: mucha VARIANZA\nyyy = kernelreg(xstar, x_train, y_train, 0.03)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")\nplt.plot(points, f_mean(points), \"r\", linewidth='3')\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2')"}, {"titulo": "Calibración de h y modelo final", "origen": "Del curso, class11_book1.ipynb", "code": "hh = np.arange(0.01, 1, 0.002)\n\nmse_train = np.repeat(0.0, len(hh))\nmse_test = np.repeat(0.0, len(hh))\n\nfor i in range(len(hh)):\n    fhat_train = kernelreg(x_train, x_train, y_train, hh[i])\n    fhat_test = kernelreg(x_test, x_train, y_train, hh[i])\n    mse_train[i] = (sum((fhat_train-y_train)**2)/n_train)\n    mse_test[i] = sum((fhat_test-y_test)**2)/(n-n_train)\n\nplt.plot(hh, mse_train, \"r\", linewidth='3')\nplt.plot(hh, mse_test, \"b\", linewidth='3')\n\nh_opt = hh[np.argmin(mse_test)]\nh_opt\n\nmse_opt = min(mse_test)\nmse_opt\n\n# Modelo ya calibrado\nyyy = kernelreg(xstar, x_train, y_train, h_opt)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")\nplt.plot(points, f_mean(points), \"r\", linewidth='3')\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2')"}, {"titulo": "K vecinos con sklearn y MSE en test", "origen": "Del curso, class11_book2_CV.ipynb", "code": "import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import KNeighborsRegressor\n\nXTotal, yTotal = datasets.load_diabetes(return_X_y=True)\ndatosTotal = len(XTotal)\n\nXTrain, XTest, yTrain, yTest = train_test_split(XTotal, yTotal,\n                                                test_size=0.33, random_state=0)\n\nvecinos = 3\nneigh = KNeighborsRegressor(n_neighbors=vecinos)\nneigh.fit(XTrain, yTrain)\n\nprediccionKVecinos = neigh.predict(XTest)\n\nMSEKvecinos = np.average(np.square(prediccionKVecinos-yTest))\nmensaje = ['El MSE en test del modelo de K vecinos con k=', str(vecinos),\n           'es igual a', str(MSEKvecinos)]\nprint(\" \".join(mensaje))"}], "r": [{"titulo": "Kernel regression y k vecinos en R", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Implementación manual del kernel rectangular\nkernelreg <- function(xstar, X, Y, h) {\n  pred <- rep(0, length(xstar))\n  for (i in seq_along(xstar)) {\n    dentro <- abs(xstar[i] - X) <= h\n    pred[i] <- sum(Y[dentro]) / max(sum(dentro), 0.1)\n  }\n  return(pred)\n}\n\nxstar <- seq(1, 5, by = 0.01)\n\npred_ancho <- kernelreg(xstar, x_train, y_train, 0.4)    # sesgo\npred_angosto <- kernelreg(xstar, x_train, y_train, 0.03) # varianza\n\nplot(x_train, y_train, pch = 16, cex = 0.4)\ncurve(f, from = 1, to = 5, col = \"red\", lwd = 3, add = TRUE)\nlines(xstar, pred_ancho, col = \"blue\", lwd = 2)\n\n\n# Calibración de h\nhh <- seq(0.01, 1, by = 0.002)\nmse_train <- rep(0, length(hh))\nmse_test <- rep(0, length(hh))\n\nfor (i in seq_along(hh)) {\n  fhat_train <- kernelreg(x_train, x_train, y_train, hh[i])\n  fhat_test  <- kernelreg(x_test,  x_train, y_train, hh[i])\n  mse_train[i] <- mean((fhat_train - y_train)^2)\n  mse_test[i]  <- mean((fhat_test - y_test)^2)\n}\n\nplot(hh, mse_train, type = \"l\", col = \"red\", lwd = 3,\n     ylim = range(c(mse_train, mse_test)))\nlines(hh, mse_test, col = \"blue\", lwd = 3)\n\nh_opt <- hh[which.min(mse_test)]\nh_opt\n\n\n# Funciones ya implementadas en R\n# ksmooth: kernel regression con ventana box o normal\nks <- ksmooth(x_train, y_train, kernel = \"box\", bandwidth = 2*h_opt, x.points = xstar)\nlines(ks$x, ks$y, col = \"darkgreen\", lwd = 2)\n\n# loess: regresión local polinomial\nlo <- loess(y_train ~ x_train, span = 0.2)\nlines(xstar, predict(lo, data.frame(x_train = xstar)), col = \"purple\", lwd = 2)\n\n# k vecinos\nlibrary(FNN)\npred_knn <- knn.reg(train = matrix(x_train), test = matrix(xstar),\n                    y = y_train, k = 10)$pred"}], "busqueda": "16 kernel regression y k vecinos modelos flexibles no parametricos, ventana h, calibracion por mse de test. supervisado clase 10, clase 11  kernel regression rectangular \n para predecir y  dado un valor particular x , se buscan en la muestra de entrenamiento los valores\nobservados x_i que caigan dentro del intervalo [x  - h, x  + h] alrededor de x . la prediccion es el\n  promedio de los y_i * correspondientes: \n                  sum_i  i( |x_i - x*| &lt;= h ) * y_i\nfhat(x*) =  -------------------------------------\n                sum_i  i( |x_i - x*| &lt;= h )\n  \n donde i(a) es la funcion indicadora, que vale 1 cuando la condicion es cierta y 0 cuando es falsa. \n relacion con k vecinos \n son primos. la diferencia: \n \n  k vecinos : se fija el  numero  de puntos cercanos. la ventana cambia de ancho segun la\n  densidad local. \n  kernel regression : se fija el  ancho  de la ventana. el numero de puntos cambia segun la\n  densidad local. \n \n en ambos la prediccion es un promedio local de los y. \n el parametro h \n h controla la flexibilidad de forma  inversa : \n \n  h grande : la ventana abarca muchos puntos, la funcion estimada queda muy suave. hay  sesgo ,\n  falta flexibilidad. en el ejemplo del curso, h = 0.4 ya suaviza demasiado. \n  h pequeno : la ventana abarca pocos puntos, la funcion estimada sigue el ruido. hay mucha\n   varianza , exceso de flexibilidad. con h = 0.03 la curva estimada es un zigzag. \n \n la calibracion no se puede hacer a ojo. se recorre una secuencia de valores de h, se calcula el mse\nen la muestra de test para cada uno, y se toma el h que lo minimiza. \n problema de las colas \n cerca de los extremos del rango de x la ventana queda incompleta y hay menos puntos. ahi el\nestimador es menos confiable. en el codigo esto se ve en el  max(..., 0.1)  del denominador, que\nevita una division por cero cuando no cae ningun punto dentro de la ventana.  implementacion de kernel regression import numpy as np\nimport matplotlib.pyplot as plt\n\ndef kernelreg(xstar, x, y, h):\n    pred = np.repeat(0.0, len(xstar))\n    for i in range(len(xstar)):\n        dist = list()\n        dist = abs(xstar[i]-x)\n        zz = np.where(dist <= h, y, 0)\n        pred[i] = sum(zz)/max(sum(np.where(dist <= h, 1, 0)), 0.1)\n    return(pred)\n\n\nxstar = np.arange(1.0, 5.0, .01)\n\n# h grande: mucha suavidad, hay sesgo\nyyy = kernelreg(xstar, x_train, y_train, .4)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")     # datos en negro\nplt.plot(points, f_mean(points), \"r\", linewidth='3') # funcion optima en rojo\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2')  # funcion estimada en azul\n\n# h pequeno: mucha varianza\nyyy = kernelreg(xstar, x_train, y_train, 0.03)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")\nplt.plot(points, f_mean(points), \"r\", linewidth='3')\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2') calibracion de h y modelo final hh = np.arange(0.01, 1, 0.002)\n\nmse_train = np.repeat(0.0, len(hh))\nmse_test = np.repeat(0.0, len(hh))\n\nfor i in range(len(hh)):\n    fhat_train = kernelreg(x_train, x_train, y_train, hh[i])\n    fhat_test = kernelreg(x_test, x_train, y_train, hh[i])\n    mse_train[i] = (sum((fhat_train-y_train)**2)/n_train)\n    mse_test[i] = sum((fhat_test-y_test)**2)/(n-n_train)\n\nplt.plot(hh, mse_train, \"r\", linewidth='3')\nplt.plot(hh, mse_test, \"b\", linewidth='3')\n\nh_opt = hh[np.argmin(mse_test)]\nh_opt\n\nmse_opt = min(mse_test)\nmse_opt\n\n# modelo ya calibrado\nyyy = kernelreg(xstar, x_train, y_train, h_opt)\nplt.plot(x_train, y_train, 'o', ms=2, color=\"k\")\nplt.plot(points, f_mean(points), \"r\", linewidth='3')\nplt.plot(xstar, yyy, 'b', color=\"b\", linewidth='2') k vecinos con sklearn y mse en test import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import kneighborsregressor\n\nxtotal, ytotal = datasets.load_diabetes(return_x_y=true)\ndatostotal = len(xtotal)\n\nxtrain, xtest, ytrain, ytest = train_test_split(xtotal, ytotal,\n                                                test_size=0.33, random_state=0)\n\nvecinos = 3\nneigh = kneighborsregressor(n_neighbors=vecinos)\nneigh.fit(xtrain, ytrain)\n\nprediccionkvecinos = neigh.predict(xtest)\n\nmsekvecinos = np.average(np.square(prediccionkvecinos-ytest))\nmensaje = ['el mse en test del modelo de k vecinos con k=', str(vecinos),\n           'es igual a', str(msekvecinos)]\nprint(\" \".join(mensaje)) kernel regression y k vecinos en r # implementacion manual del kernel rectangular\nkernelreg <- function(xstar, x, y, h) {\n  pred <- rep(0, length(xstar))\n  for (i in seq_along(xstar)) {\n    dentro <- abs(xstar[i] - x) <= h\n    pred[i] <- sum(y[dentro]) / max(sum(dentro), 0.1)\n  }\n  return(pred)\n}\n\nxstar <- seq(1, 5, by = 0.01)\n\npred_ancho <- kernelreg(xstar, x_train, y_train, 0.4)    # sesgo\npred_angosto <- kernelreg(xstar, x_train, y_train, 0.03) # varianza\n\nplot(x_train, y_train, pch = 16, cex = 0.4)\ncurve(f, from = 1, to = 5, col = \"red\", lwd = 3, add = true)\nlines(xstar, pred_ancho, col = \"blue\", lwd = 2)\n\n\n# calibracion de h\nhh <- seq(0.01, 1, by = 0.002)\nmse_train <- rep(0, length(hh))\nmse_test <- rep(0, length(hh))\n\nfor (i in seq_along(hh)) {\n  fhat_train <- kernelreg(x_train, x_train, y_train, hh[i])\n  fhat_test  <- kernelreg(x_test,  x_train, y_train, hh[i])\n  mse_train[i] <- mean((fhat_train - y_train)^2)\n  mse_test[i]  <- mean((fhat_test - y_test)^2)\n}\n\nplot(hh, mse_train, type = \"l\", col = \"red\", lwd = 3,\n     ylim = range(c(mse_train, mse_test)))\nlines(hh, mse_test, col = \"blue\", lwd = 3)\n\nh_opt <- hh[which.min(mse_test)]\nh_opt\n\n\n# funciones ya implementadas en r\n# ksmooth: kernel regression con ventana box o normal\nks <- ksmooth(x_train, y_train, kernel = \"box\", bandwidth = 2*h_opt, x.points = xstar)\nlines(ks$x, ks$y, col = \"darkgreen\", lwd = 2)\n\n# loess: regresion local polinomial\nlo <- loess(y_train ~ x_train, span = 0.2)\nlines(xstar, predict(lo, data.frame(x_train = xstar)), col = \"purple\", lwd = 2)\n\n# k vecinos\nlibrary(fnn)\npred_knn <- knn.reg(train = matrix(x_train), test = matrix(xstar),\n                    y = y_train, k = 10)$pred"}, {"num": "17", "slug": "validacion-cruzada", "parte": "Supervisado", "titulo": "Validación cruzada", "resumen": "train_test_split, KFold, cross_val_score, LOOCV.", "clases": "Clase 11, Clase 12", "teoria": "<h3>El problema con una sola partición</h3>\n<p>Partir la muestra una sola vez en train y test tiene dos defectos:</p>\n<ol>\n<li>El MSE de test depende de <strong>qué partición salió</strong>. Con otra semilla da otro número.</li>\n<li>Se desperdicia información: el modelo final solo se entrena con una fracción de los datos.</li>\n</ol>\n<h3>Validación cruzada en K folds</h3>\n<p>Se parte la muestra en K bloques (folds) del mismo tamaño. Luego, K veces:</p>\n<ol>\n<li>Se entrena con K-1 folds.</li>\n<li>Se evalúa en el fold restante.</li>\n</ol>\n<p>El estimador final es el promedio de los K errores:</p>\n<pre><code>              1\nCV(K) =  --------- * sum_{j=1}^{K}  MSE_j\n              K\n</code></pre>\n<p>Cada observación se usa exactamente una vez para evaluar y K-1 veces para entrenar.</p>\n<h3>Elección de K</h3>\n<table>\n<thead>\n<tr>\n<th>K</th>\n<th>Sesgo del estimador</th>\n<th>Varianza</th>\n<th>Costo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>K pequeño (5)</td>\n<td>más sesgo (entrena con menos datos)</td>\n<td>menos varianza</td>\n<td>barato</td>\n</tr>\n<tr>\n<td>K grande (10)</td>\n<td>menos sesgo</td>\n<td>más varianza</td>\n<td>medio</td>\n</tr>\n<tr>\n<td>K = n (LOOCV)</td>\n<td>sesgo mínimo</td>\n<td>varianza alta</td>\n<td>caro</td>\n</tr>\n</tbody>\n</table>\n<p>El estándar de la práctica es <strong>K = 5 o K = 10</strong>. El código del curso usa 10.</p>\n<h3>Para qué se usa</h3>\n<p>Principalmente para <strong>calibrar el parámetro de flexibilidad</strong>: se recorre una rejilla de valores del\nparámetro, se calcula el CV para cada uno, y se escoge el que minimiza el error. Es lo que hacen por\ndentro <code>RidgeCV</code>, <code>LassoCV</code>, <code>ElasticNetCV</code> y <code>cv.glmnet</code>.</p>\n<h3>Advertencia</h3>\n<p>Toda transformación que use información de la respuesta o de toda la muestra (escalamiento,\nselección de variables) debe hacerse <strong>dentro</strong> de cada fold, no antes. Si se hace antes, la\ninformación del fold de evaluación se filtra al entrenamiento y el error estimado sale\noptimistamente bajo.</p>", "relacion": "<p>El notebook muestra <strong>tres niveles</strong> de la misma idea, de más manual a más automático.</p>\n<p><strong>Nivel 1, una sola partición.</strong></p>\n<pre><code>XTrain, XTest, yTrain, yTest = train_test_split(XTotal, yTotal, test_size=0.33, random_state=0)\n</code></pre>\n<p><code>test_size</code> es la proporción que va a evaluación. <code>random_state</code> fija la semilla para que la\npartición sea reproducible.</p>\n<p><strong>Nivel 2, los folds a mano.</strong></p>\n<pre><code>kf = KFold(n_splits=folds)\nkf.get_n_splits(XTotal)\n\nfor train_index, test_index in kf.split(XTotal):\n    X_trainCV, X_testCV = XTotal[train_index], XTotal[test_index]\n    y_trainCV, y_testCV = yTotal[train_index], yTotal[test_index]\n</code></pre>\n<p>Importante: <code>kf.split()</code> devuelve <strong>índices</strong>, no datos. El cuerpo del loop es donde iría el ajuste\ndel modelo y el cálculo del error de ese fold. En el notebook el loop está vacío a propósito, como\nplantilla.</p>\n<p><strong>Nivel 3, automático.</strong></p>\n<pre><code>print(cross_val_score(neigh, X, y, cv=10, scoring=&quot;neg_mean_squared_error&quot;))\n</code></pre>\n<p>Devuelve un vector con el puntaje de cada fold. Ojo con el prefijo <strong>neg_</strong>: sklearn siempre\nmaximiza, así que reporta el MSE con signo negativo. Para obtener el MSE hay que cambiarle el signo:\n<code>-cross_val_score(...).mean()</code>.</p>\n<p>El ejercicio final del notebook pide escribir una función que grafique la curva de MSE por validación\ncruzada contra el número de vecinos. Abajo está resuelto.</p>", "python": [{"titulo": "Las tres formas de particionar", "origen": "Del curso, class11_book2_CV.ipynb", "code": "import numpy as np\nfrom sklearn import datasets\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.neighbors import KNeighborsRegressor\nfrom sklearn.model_selection import KFold\nimport matplotlib.pyplot as plt\n\nXTotal, yTotal = datasets.load_diabetes(return_X_y=True)\ndatosTotal = len(XTotal)\n\n# 1. Una sola partición\nXTrain, XTest, yTrain, yTest = train_test_split(XTotal, yTotal,\n                                                test_size=0.33, random_state=0)\n\n# 2. Folds a mano\nfolds = 10\nkf = KFold(n_splits=folds)\nkf.get_n_splits(XTotal)\n\nfor train_index, test_index in kf.split(XTotal):\n    X_trainCV, X_testCV = XTotal[train_index], XTotal[test_index]\n    y_trainCV, y_testCV = yTotal[train_index], yTotal[test_index]\n    # aquí va el ajuste del modelo y el cálculo del error de este fold\n\n# 3. Métrica automática sobre los folds\nfrom sklearn.model_selection import cross_val_score\n\nneigh = KNeighborsRegressor(n_neighbors=3)\n\nX = XTotal[:150]\ny = yTotal[:150]\n\nprint(cross_val_score(neigh, X, y, cv=10, scoring=\"neg_mean_squared_error\"))"}, {"titulo": "Curva de MSE por validación cruzada (ejercicio del notebook resuelto)", "origen": "Solución agregada al ejercicio propuesto en class11_book2_CV.ipynb", "code": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.neighbors import KNeighborsRegressor\nfrom sklearn.model_selection import KFold\n\ndef curva_mse_cv(XTotal, yTotal, folds):\n    n_total = len(XTotal)\n    max_vecinos = n_total - int(n_total/folds)   # límite por el tamaño de cada fold\n\n    kf = KFold(n_splits=folds, shuffle=True, random_state=0)\n    lista_k = range(1, max_vecinos)\n    mse_por_k = []\n\n    for k in lista_k:\n        errores_fold = []\n        for train_index, test_index in kf.split(XTotal):\n            X_trainCV, X_testCV = XTotal[train_index], XTotal[test_index]\n            y_trainCV, y_testCV = yTotal[train_index], yTotal[test_index]\n\n            modelo = KNeighborsRegressor(n_neighbors=k)\n            modelo.fit(X_trainCV, y_trainCV)\n            prediccion = modelo.predict(X_testCV)\n\n            errores_fold.append(np.average(np.square(prediccion - y_testCV)))\n\n        mse_por_k.append(np.mean(errores_fold))\n\n    plt.plot(list(lista_k), mse_por_k)\n    plt.xlabel('Número de vecinos')\n    plt.ylabel('MSE por validación cruzada')\n    plt.title('Curva de calibración')\n    plt.show()\n\n    k_optimo = list(lista_k)[int(np.argmin(mse_por_k))]\n    print(\"k óptimo:\", k_optimo, \"con MSE:\", round(min(mse_por_k), 3))\n    return k_optimo, mse_por_k\n\nk_opt, curva = curva_mse_cv(XTotal, yTotal, 10)"}, {"titulo": "Versión compacta con cross_val_score y LOOCV", "origen": "Equivalente agregado, no viene del material del curso", "code": "from sklearn.model_selection import cross_val_score, LeaveOneOut, GridSearchCV\nfrom sklearn.neighbors import KNeighborsRegressor\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# Curva de calibración en pocas líneas\nlista_k = range(1, 50)\nmse_cv = []\n\nfor k in lista_k:\n    puntajes = cross_val_score(KNeighborsRegressor(n_neighbors=k),\n                               XTotal, yTotal, cv=10,\n                               scoring=\"neg_mean_squared_error\")\n    mse_cv.append(-puntajes.mean())   # el signo negativo se revierte\n\nplt.plot(list(lista_k), mse_cv)\nplt.xlabel(\"k\")\nplt.ylabel(\"MSE por CV\")\nplt.show()\n\nprint(\"k óptimo:\", list(lista_k)[int(np.argmin(mse_cv))])\n\n\n# Leave One Out\nloo = LeaveOneOut()\npuntajes_loo = cross_val_score(KNeighborsRegressor(n_neighbors=5),\n                               XTotal, yTotal, cv=loo,\n                               scoring=\"neg_mean_squared_error\")\nprint(\"LOOCV MSE:\", -puntajes_loo.mean())\n\n\n# Búsqueda automática del mejor parámetro\nrejilla = {'n_neighbors': list(range(1, 50))}\nbusqueda = GridSearchCV(KNeighborsRegressor(), rejilla, cv=10,\n                        scoring=\"neg_mean_squared_error\")\nbusqueda.fit(XTotal, yTotal)\n\nprint(busqueda.best_params_)\nprint(-busqueda.best_score_)"}], "r": [{"titulo": "Validación cruzada en R", "origen": "Equivalente agregado, no viene del material del curso", "code": "# Partición simple\nset.seed(0)\nn <- nrow(datos)\nidx <- sample(1:n, floor(0.67*n))\ntrain <- datos[idx, ]\ntest  <- datos[-idx, ]\n\n\n# Validación cruzada a mano con K folds\nK <- 10\nset.seed(0)\nfolds <- sample(rep(1:K, length.out = n))\n\nmse_fold <- rep(0, K)\nfor (j in 1:K) {\n  train_j <- datos[folds != j, ]\n  test_j  <- datos[folds == j, ]\n\n  modelo <- lm(y ~ ., data = train_j)\n  pred <- predict(modelo, test_j)\n  mse_fold[j] <- mean((test_j$y - pred)^2)\n}\n\nmean(mse_fold)   # estimador CV\nsd(mse_fold)     # variabilidad entre folds\n\n\n# cv.glm del paquete boot (para modelos glm o lm)\nlibrary(boot)\nmodelo_glm <- glm(Grad.Rate ~ ., data = College[, -1])\n\ncv10 <- cv.glm(College[, -1], modelo_glm, K = 10)\ncv10$delta[1]    # estimador CV crudo\ncv10$delta[2]    # estimador ajustado por sesgo\n\n# LOOCV: omitir el argumento K\ncv_loo <- cv.glm(College[, -1], modelo_glm)\ncv_loo$delta[1]\n\n\n# Con el paquete caret: calibrar k vecinos por CV\nlibrary(caret)\n\ncontrol <- trainControl(method = \"cv\", number = 10)\najuste <- train(Grad.Rate ~ ., data = College[, -1],\n                method = \"knn\",\n                trControl = control,\n                tuneGrid = data.frame(k = 1:30),\n                preProcess = c(\"center\", \"scale\"))\n\najuste\nplot(ajuste)\najuste$bestTune"}], "busqueda": "17 validacion cruzada train_test_split, kfold, cross_val_score, loocv. supervisado clase 11, clase 12  el problema con una sola particion \n partir la muestra una sola vez en train y test tiene dos defectos: \n \n el mse de test depende de  que particion salio . con otra semilla da otro numero. \n se desperdicia informacion: el modelo final solo se entrena con una fraccion de los datos. \n \n validacion cruzada en k folds \n se parte la muestra en k bloques (folds) del mismo tamano. luego, k veces: \n \n se entrena con k-1 folds. \n se evalua en el fold restante. \n \n el estimador final es el promedio de los k errores: \n                1\ncv(k)
